# Multi-replica single-flight concurrency harness (#1624).
#
# Originally reproduced #1606 (per-process singleflight races across replicas
# serving partial/truncated artifacts) as the acceptance gate for #1609. Both
# closed on 2026-07-03, so the original "red by design until #1609 lands"
# justification has EXPIRED — but the suite cannot be flipped to blocking yet:
# it is still red on `main` for a harness reason. The race driver aborts at
# `repo create returned HTTP 400` (the SSRF guard on remote-repo upstream
# URLs, added after this harness was written, rejects the docker-internal
# mock upstream) before the race is ever exercised. Tracked in #3363; once
# fixed and a dispatch run passes, remove the waiver on the race job so
# regressions hard-fail (the #3310 flip).
#
# It is NOT wired into `pull_request` and must never block the per-PR gate.
# It runs only on manual dispatch and a weekly schedule.
name: Concurrency E2E (single-flight race)

# Least-privilege default for GITHUB_TOKEN across all jobs (CodeQL hardening).
permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      replicas:
        description: "Number of backend replicas"
        required: false
        default: "3"
      concurrency:
        description: "Number of concurrent GETs"
        required: false
        default: "200"
      latency_ms:
        description: "Mock upstream per-response latency (ms) to widen the race window"
        required: false
        default: "1500"
      artifact_size_bytes:
        description: "Mock artifact size in bytes (default 256 MiB)"
        required: false
        default: "268435456"
      singleflight_advisory_locks:
        description: "Cross-replica single-flight (PROXY_SINGLEFLIGHT_ADVISORY_LOCKS_ENABLED) in the stack under test"
        required: false
        default: "true"
  schedule:
    # Weekly, Mondays 06:00 UTC. Keeps the #1606 reproduction observable on main.
    - cron: "0 6 * * 1"

# Never let this cancel or be cancelled by per-PR runs.
concurrency:
  group: concurrency-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint harness scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck scripts/concurrency/*.sh
      - name: python syntax check
        run: python3 -m py_compile scripts/concurrency/mock_upstream.py
      - name: assert_lib unit tests (no Docker)
        run: bash scripts/concurrency/test_assert_lib.sh
      - name: compose config parses
        run: docker compose -f docker-compose.concurrency-e2e.yml config >/dev/null

  race:
    name: Run single-flight race (allowed to fail on main)
    runs-on: ubuntu-latest
    needs: lint
    # WAIVER (#3310): soft-fail retained past #1609's close (2026-07-03).
    # The setup blocker is FIXED: docker-compose.concurrency-e2e.yml now sets
    # UPSTREAM_ALLOW_PRIVATE_IPS=true on the backend, so the race driver no
    # longer exits 2 at "repo create returned HTTP 400" before generating any
    # load (#3363). Run 35255381049 (2026-09-17) was the first to reach the
    # storm end-to-end and it is RED: 38 upstream fetches instead of 1 and 198
    # of 200 clients got a torn body, so the suite still cannot be flipped to
    # blocking.
    #   owner:    brandonrc
    #   reason:   the first end-to-end run is red on the product, not the
    #             harness; one green workflow_dispatch run is still the
    #             missing evidence
    #   tracking: #3310 (the flip this waiver defers), #3363 (the setup fix)
    #   expires:  at the next workflow_dispatch run — if it is green, remove
    #             this continue-on-error in the same PR
    continue-on-error: true
    env:
      REPLICAS: ${{ github.event.inputs.replicas || '3' }}
      CONCURRENCY: ${{ github.event.inputs.concurrency || '200' }}
      LATENCY_MS: ${{ github.event.inputs.latency_ms || '1500' }}
      ARTIFACT_SIZE_BYTES: ${{ github.event.inputs.artifact_size_bytes || '268435456' }}
      # The feature this suite exists to prove. Defaults to the compose file's
      # own default ("true"); a dispatch run can set it to "false" to compare
      # against the per-process-only coordinator.
      PROXY_SINGLEFLIGHT_ADVISORY_LOCKS_ENABLED: ${{ github.event.inputs.singleflight_advisory_locks || 'true' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build images
        run: |
          docker compose -f docker-compose.concurrency-e2e.yml build

      - name: Start stack with N backend replicas
        run: |
          # Override the mock upstream latency/size via env so the workflow
          # inputs take effect.
          export LATENCY_MS ARTIFACT_SIZE_BYTES PROXY_SINGLEFLIGHT_ADVISORY_LOCKS_ENABLED
          docker compose -f docker-compose.concurrency-e2e.yml up -d \
            --scale backend="${REPLICAS}"

      - name: Wait for the load balancer and replicas to be healthy
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:18080/health >/dev/null 2>&1; then
              echo "Backend reachable via LB."
              break
            fi
            echo "waiting for stack... ($i)"
            sleep 5
          done
          curl -sf http://localhost:19999/healthz

      - name: Run the single-flight race driver
        run: |
          CONCURRENCY="${CONCURRENCY}" bash scripts/concurrency/run-singleflight-race.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: concurrency-results
          path: /tmp/concurrency-results/
          if-no-files-found: ignore

      - name: Dump backend logs on failure
        if: failure() || always()
        run: |
          docker compose -f docker-compose.concurrency-e2e.yml logs --no-color > /tmp/concurrency-results/compose.log 2>&1 || true

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.concurrency-e2e.yml down -v || true
