name: CI

on:
  push:
    branches: [main, master, develop, 'release/**']
    paths-ignore:
      - 'site/**'
      - '**/*.md'
      - '.beads/**'
      - 'LICENSE'
      - 'CLAUDE.md'
  # No `paths-ignore` on pull_request: this workflow is the single owner of
  # the branch-protection required contexts ("🦀 Check Rust", "🧪 Backend
  # Unit Tests", "✅ CI Complete"), so it must trigger on every PR. The
  # `changes` job below decides whether the change is docs-only; heavy jobs
  # then skip via job-level `if`, which GitHub reports as success for
  # required checks ("Handling skipped but required checks"). This replaces
  # the docs-required-shim.yml workflow, which posted duplicate check runs
  # under the same required context names on PRs touching both docs and
  # code (#2923).
  #
  # `ready_for_review` in addition to the default types: CI Complete exempts
  # DRAFT pull requests from the coverage gate, and without a fresh run when
  # a draft is marked ready its last (exempt) verdict would stand. Not
  # `labeled`: a label change would re-run the whole pipeline; the coverage
  # labels are read live on "Re-run failed jobs" instead.
  pull_request:
    branches: [main, master, develop, 'release/**']
    types: [opened, synchronize, reopened, ready_for_review]
  # The merge queue. A required status check that does not trigger on
  # `merge_group` is never reported for the queue's temporary
  # `gh-readonly-queue/main/...` branch, and the queue then waits for it
  # until the status timeout ejects the pull request. The three required
  # contexts above are jobs of this workflow, so this is the one trigger the
  # queue needs. A merge-group run tests the tree `main` will have after the
  # merge; the `changes` job classifies it from the group's own diff
  # (merge_group.base_sha..head_sha), and every job it runs is
  # GitHub-hosted, so a stalled self-hosted pool cannot stall a merge.
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

# Concurrency: keyed by `event_name` + `ref` so push, pull_request,
# merge_group and workflow_dispatch are isolated from each other.
# `cancel-in-progress` is only true for push / pull_request; a manual run
# (`workflow_dispatch`) is never cancelled by a subsequent push, and a
# merge-group run has a ref of its own that the queue itself retires.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  SQLX_OFFLINE: "true"

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # DOCS-ONLY / BACKEND-CHANGE GATE
  # ════════════════════════════════════════════════════════════════════════════

  # Decides whether a PR touches anything beyond the docs paths that used to
  # live in this workflow's `paths-ignore` (and in docs-required-shim.yml's
  # `paths`). Replaces the shim: `paths` / `paths-ignore` cannot express
  # "fire only when the other workflow does not" (paths-ignore skips only if
  # ALL files match, paths fires if ANY file matches), so a PR touching a
  # `.md` file plus code triggered both workflows and got every required
  # context posted twice (#2923). Computing the decision here makes the two
  # outcomes mutually exclusive by construction.
  #
  # Fails open: on push / workflow_dispatch, or if the PR file listing
  # errors, `code` is "true" and full CI runs. Downstream jobs gate on
  # `code != 'false'` so an empty output also runs full CI. The file list
  # comes from the pulls/files API (server-side, same source GitHub's own
  # path filtering uses) — not from attacker-influenced checkout content.
  #
  # The same pass also classifies the PR as backend-touching or not (#3124).
  # `backend` drives whether the Tier 2 integration steps of
  # test-backend-unit run on the PR. It is a strict subset of `code`: the
  # docs arm is matched first, so `backend/README.md` is docs, not backend.
  #
  # `rust` gates the Rust jobs (check-rust, the unit-test shards, the
  # integration job and the test-backend-unit aggregate over them); `code`
  # still gates the cheap hosted jobs (shell-tests, security-audit,
  # coverage-gates via its `needs`). A PR whose files are all docs or
  # CI-only (release notes, scripts/release, docs/, and the scripts/ci/*.sh
  # gates no Rust job executes) runs the shell gates and skips the Rust
  # jobs. `rust` is a superset of `backend` and a subset
  # of `code`. Other workflow files deliberately stay on the Rust side: the
  # lib tests in backend/src/ci_test_surface.rs and backend/src/config.rs and
  # the workflow_scan_gate_tests target read every file under
  # .github/workflows/, so a workflow-only change can turn the unit job red.
  # scripts/ci/test-ci-change-classification.sh runs this step's script
  # against fixture file lists and fails if a Rust job starts executing a
  # script this arm would skip.
  #
  # On a push, `rust` is "false" when the pushed commit's tree is the exact
  # tree a merged pull request already proved green (see
  # scripts/ci/resolve-verified-tree.sh): a squash merge of a PR that was up
  # to date with its base produces that identical tree, and re-running the
  # Rust jobs on it re-proves a verdict that already exists. The proof
  # includes a green "🧪 Backend Integration Tests" on the PR head, so a PR
  # whose integration job was skipped by design proves nothing here and its
  # push runs everything. Any lookup failure leaves `rust` "true" and the
  # jobs run.
  #
  # A merge-group run is classified like a pull request, from the files
  # between the group's base (the tip of `main` it was built on) and its
  # head, read from the compare API. That is what makes `manifest` mean the
  # same thing in the queue as on the PR, so the Security Audit rule in CI
  # Complete can treat both alike. A failed listing fails open, as on a PR.
  #
  # `tests` gates the integration job on pull requests: it is "true" when
  # the PR touches backend/tests/, backend/migrations/ or this workflow.
  # The integration job also runs for the label `ci:full` (`ci_full`), and
  # always on merge_group and push, so the merged tree is always proven.
  # `ci_image` is the label `ci:image`, which runs the advisory image build
  # and smoke jobs on a PR that changes nothing under docker/. Labels are
  # read live from the API, so "add the label, then re-run all jobs" works;
  # if that read fails they fall back to the labels in the event payload.
  changes:
    name: 🔍 Docs-Only Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      # The push-time tree check reads the merged PR's check runs.
      checks: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      backend: ${{ steps.filter.outputs.backend }}
      manifest: ${{ steps.filter.outputs.manifest }}
      rust: ${{ steps.filter.outputs.rust }}
      rust_skip_reason: ${{ steps.filter.outputs.rust_skip_reason }}
      tests: ${{ steps.filter.outputs.tests }}
      ci_full: ${{ steps.filter.outputs.ci_full }}
      ci_image: ${{ steps.filter.outputs.ci_image }}
    steps:
      # Push only, and only the tree-check script: on a push the checkout is
      # the protected branch's own commit. Pull requests are classified from
      # the pulls/files API alone and check nothing out.
      - name: Check out the tree-check script
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci/resolve-verified-tree.sh
          sparse-checkout-cone-mode: false

      - name: Determine whether non-docs files changed
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          MG_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_BRANCH: ${{ github.ref_name }}
        run: |
          # Labels are a pull-request notion; everywhere else both are off.
          ci_full=false
          ci_image=false
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if ! labels=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.labels[].name'); then
              echo "live label read failed; using the event payload's labels" >&2
              labels=$(printf '%s\n' "$PR_LABELS" | tr ',' '\n')
            fi
            if printf '%s\n' "$labels" | grep -qx 'ci:full'; then ci_full=true; fi
            if printf '%s\n' "$labels" | grep -qx 'ci:image'; then ci_image=true; fi
          fi
          echo "ci_full=$ci_full" >> "$GITHUB_OUTPUT"
          echo "ci_image=$ci_image" >> "$GITHUB_OUTPUT"
          echo "label ci:full: $ci_full; label ci:image: $ci_image"

          if [ "$EVENT_NAME" != "pull_request" ] && [ "$EVENT_NAME" != "merge_group" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "manifest=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            rust=true
            if [ "$EVENT_NAME" = "push" ] && [ -f scripts/ci/resolve-verified-tree.sh ]; then
              # Fails open: a non-zero exit or anything but an explicit
              # verified=true leaves the Rust jobs running.
              verdict=$(bash scripts/ci/resolve-verified-tree.sh "$PUSH_SHA" "$PUSH_BRANCH") || verdict=""
              if printf '%s\n' "$verdict" | grep -qx 'verified=true'; then
                rust=false
                reason=$(printf '%s\n' "$verdict" | sed -n 's/^reason=//p' | head -1)
                echo "rust_skip_reason=${reason}" >> "$GITHUB_OUTPUT"
              fi
            fi
            echo "rust=$rust" >> "$GITHUB_OUTPUT"
            echo "rust jobs needed: $rust"
            exit 0
          fi
          full_ci() {
            echo "$1 — failing open to full CI" >&2
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "manifest=true" >> "$GITHUB_OUTPUT"
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          }
          if [ "$EVENT_NAME" = "merge_group" ]; then
            # The group's own diff: base is the `main` tip the queue built
            # on, head the commit `main` becomes. The compare API returns at
            # most 300 files; a listing that reaches that cap may be
            # truncated, so it counts as a failed listing.
            if [ -z "$MG_BASE_SHA" ] || [ -z "$MG_HEAD_SHA" ]; then
              full_ci "merge-group event carries no base/head sha"
            fi
            if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${MG_BASE_SHA}...${MG_HEAD_SHA}" --jq '.files[].filename'); then
              full_ci "merge-group file listing failed"
            fi
            if [ "$(printf '%s\n' "$files" | grep -c .)" -ge 300 ]; then
              full_ci "merge-group file listing may be truncated at 300 files"
            fi
          elif ! files=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename'); then
            full_ci "PR file listing failed"
          fi
          code=false
          backend=false
          manifest=false
          rust=false
          tests=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            # What the integration job reads that the unit shards do not:
            # its test crates, the schema it migrates, and its own
            # definition. Independent of the arms below (backend/tests/ is
            # also a backend and Rust input). Docs are never tests.
            case "$f" in
              *.md) ;;
              backend/tests/*|backend/migrations/*|.github/workflows/ci.yml)
                tests=true
                ;;
            esac
            # First arm: keep in sync with the `push` trigger's paths-ignore
            # list above (CLAUDE.md is already covered by *.md).
            #
            # Second arm: anything that can change what the integration
            # suites compile to, what schema they run against, or how the
            # job itself is defined. Keep in sync with `detect-changes`'
            # `backend` filter, minus docker/Dockerfile.backend (the
            # unit job compiles with cargo, it does not build an
            # image) and plus .github/workflows/ci.yml (so a change to this
            # gate exercises the gate), .config/nextest.toml (the db-serial
            # groups the Tier 2 suites run under) and
            # scripts/ci/run-measured-build.sh (the wrapper the Tier 2 build
            # step runs). A push whose tree a PR already proved skips Tier 2,
            # which is sound only if every Tier 2 input is in this arm.
            # Third arm (checked before the backend arm, which `backend/*`
            # would otherwise swallow): the files `cargo audit` reads. It
            # decides whether the Security Audit verdict blocks this PR --
            # see ci-complete. A strict subset of `backend`.
            #
            # Fourth arm: the toolchain pin and every script a Rust job
            # executes. They must be matched before the CI-only arm below,
            # whose scripts/ci/*.sh would otherwise swallow them. The shell
            # test for this step fails if a Rust job invokes a script that
            # is missing here.
            #
            # Fifth arm: CI-only files no Rust job reads. The shell gates
            # still run (`code`), the Rust jobs skip (`rust` stays false).
            case "$f" in
              site/*|*.md|.beads/*|LICENSE)
                ;;
              Cargo.toml|Cargo.lock|*/Cargo.toml|*/Cargo.lock)
                code=true
                backend=true
                manifest=true
                rust=true
                ;;
              backend/*|Cargo.toml|Cargo.lock|.sqlx/*|.github/workflows/ci.yml|\
              .config/nextest.toml|\
              scripts/ci/run-measured-build.sh)
                code=true
                backend=true
                rust=true
                ;;
              rust-toolchain|rust-toolchain.toml|\
              scripts/ci/setup-pinned-toolchain.sh|\
              scripts/ci/check-toolchain-pin.sh|\
              scripts/ci/check-no-legacy-admin-scope.sh|\
              scripts/ci/check-token-mint-surface.sh|\
              scripts/ci/check-auth-event-audit.sh|\
              scripts/ci/check-migration-ledger.sh|\
              scripts/ci/check-duplicate-migrations.sh)
                code=true
                rust=true
                ;;
              .github/release-notes/*|scripts/ci/*.sh|scripts/release/*|docs/*)
                code=true
                ;;
              *)
                code=true
                rust=true
                ;;
            esac
          done <<< "$files"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "non-docs changes: $code"
          echo "backend changes: $backend"
          echo "manifest/lockfile changes: $manifest"
          echo "rust-job inputs changed: $rust"
          echo "integration-job inputs changed: $tests"

  # ════════════════════════════════════════════════════════════════════════════
  # RELEASE-BUMP GATE
  # ════════════════════════════════════════════════════════════════════════════

  # Decides whether a PR is a version-bump-only release PR (#3045). Such PRs
  # touch only the release-bump file set (Cargo.toml, Cargo.lock,
  # backend/src/api/openapi.rs, .trivyignore, CHANGELOG.md, and the DELETION
  # of the changes/unreleased/*.md fragments the prep assembles into
  # CHANGELOG.md) and, for the files that feed the compile, change nothing
  # but version-string lines — so they cannot alter unit-test, clippy, or
  # coverage outcomes. The heavy Rust jobs (check-rust, test-backend-unit
  # and the jobs under it; coverage-gates follows through its `needs`) skip
  # via job-level `if`, which GitHub reports as success for required
  # checks — the same mechanics as the Docs-Only Gate above. shell-tests and
  # security-audit still run: they are cheap ubuntu-24.04 jobs, and
  # security-audit genuinely reads the Cargo.lock this PR touches.
  #
  # Fails CLOSED: on push / workflow_dispatch, on any API error, on any file
  # outside the allowed set, on any rename/add/delete, on a missing inline
  # patch (GitHub omits `patch` for very large diffs), or on any +/- diff
  # line that is not provably a version-string line, `bump_only` is "false"
  # and full CI runs. Downstream jobs gate on `bump_only != 'true'` so an
  # empty output also runs full CI. The file list and per-file patches come
  # from the pulls/files API (server-side, the PR's diff against its merge
  # base) — not from attacker-influenced checkout content.
  release-bump:
    name: 🔍 Release-Bump Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      bump_only: ${{ steps.filter.outputs.bump_only }}
    steps:
      - name: Determine whether the PR is a version-bump-only release PR
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "bump_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --slurp > /tmp/pr-files.json; then
            echo "PR file listing failed — failing closed to full CI" >&2
            echo "bump_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bump_only=$(python3 - /tmp/pr-files.json <<'PY'
          import json
          import re
          import sys

          # --slurp wraps each paginated response page in an outer array.
          pages = json.load(open(sys.argv[1]))
          files = [f for page in pages for f in page]

          SEMVER = r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?'
          # Allowed file -> regex every +/- diff line must match, or None if
          # any content change in that file is acceptable on the fast path.
          #
          # Cargo.toml: only the workspace `version = "X.Y.Z"` line (column 0)
          # may change; dependency edits use `name = { version = ... }` inline
          # tables, add/remove non-matching lines, or live in other files, so
          # they fall back to full CI.
          # Cargo.lock: a workspace version bump only rewrites the bare
          # `version = "..."` lines of workspace member [[package]] blocks. Any
          # real dependency change also touches `checksum =` / `source =` /
          # `name =` / `dependencies =` lines, which fail the pattern.
          # openapi.rs: only the `version = "X.Y.Z",` utoipa info line.
          ALLOWED = {
              'Cargo.toml': re.compile(r'^[+-]version = "' + SEMVER + r'"$'),
              'Cargo.lock': re.compile(r'^[+-]version = "' + SEMVER + r'"$'),
              'backend/src/api/openapi.rs': re.compile(r'^[+-]\s*version = "' + SEMVER + r'",$'),
              '.trivyignore': None,
              'CHANGELOG.md': None,
          }

          # The release prep assembles the CHANGELOG fragments and deletes
          # them (scripts/release/assemble-changelog.sh). A removed Markdown
          # file under changes/unreleased/ cannot reach the compile; adding
          # or editing one is not part of a bump and falls back to full CI.
          FRAGMENT = re.compile(r'^changes/unreleased/[^/]+\.md$')

          def full_ci(reason):
              print(f'full CI: {reason}', file=sys.stderr)
              print('false')
              sys.exit(0)

          if not files:
              full_ci('empty PR file listing')

          for f in files:
              name = f.get('filename')
              if FRAGMENT.match(name or ''):
                  if f.get('status') != 'removed':
                      full_ci(f'{name!r} has status {f.get("status")!r}; a release bump only deletes fragments')
                  continue
              if name not in ALLOWED:
                  full_ci(f'{name!r} is outside the release-bump file set')
              if f.get('status') != 'modified':
                  full_ci(f'{name!r} has status {f.get("status")!r}, not a plain modification')
              line_re = ALLOWED[name]
              if line_re is None:
                  continue
              patch = f.get('patch')
              if not patch:
                  full_ci(f'{name!r} has no inline patch to validate (diff too large)')
              # Split on '\n' ONLY. str.splitlines() also breaks on the
              # vertical tab, form feed, file/group/record separators, NEL and
              # the Unicode line/paragraph separators -- none of which git or
              # the GitHub patch field treat as a line terminator. Every one of
              # them is also valid Rust/TOML whitespace, so splitlines() turned
              # a single physical diff line into two Python "lines" and the
              # trailing fragment -- which does not start with +/- -- was
              # skipped entirely, letting arbitrary code ride into openapi.rs
              # on a line whose prefix matched the version regex. The gate then
              # skipped Check Rust, Backend Unit Tests and Code Coverage while
              # CI Complete reported success. Belt and braces: reject outright
              # any patch containing one of those separators.
              SPLIT_ONLY_IN_PYTHON = (
                  '\x0b', '\x0c', '\x1c', '\x1d', '\x1e',
                  '\x85', '\u2028', '\u2029',
              )
              if any(sep in patch for sep in SPLIT_ONLY_IN_PYTHON):
                  full_ci(f'{name!r} patch contains a non-newline line separator')
              lines = [ln.rstrip('\r') for ln in patch.split('\n')]
              # Cargo.toml: the regex alone is position-blind. A section table
              # ([dependencies.foo], [patch.crates-io.foo], ...) also puts
              # `version = "X.Y.Z"` at column 0, so a dependency edit would
              # match. Require that the only TOML section the hunk touches is
              # [workspace.package]; anything else falls back to full CI.
              if name == 'Cargo.toml':
                  sections = {
                      ln[1:].strip() for ln in lines
                      if ln[1:2] == '[' and ln[:1] in (' ', '+', '-')
                  }
                  if sections - {'[workspace.package]'}:
                      full_ci(f'Cargo.toml hunk touches sections {sorted(sections)}')
              for line in lines:
                  if line.startswith(('+', '-')) and not line_re.match(line):
                      full_ci(f'{name!r} changes a non-version line: {line!r}')

          print('true')
          PY
          ) || bump_only=false
          case "$bump_only" in
            true|false) ;;
            *) bump_only=false ;;
          esac
          echo "bump_only=$bump_only" >> "$GITHUB_OUTPUT"
          echo "version-bump-only release PR: $bump_only"

  # ════════════════════════════════════════════════════════════════════════════
  # TIER 1: FAST CI (Every Push/PR) - Target: < 5 minutes
  # ════════════════════════════════════════════════════════════════════════════

  check-rust:
    name: 🦀 Check Rust
    # GitHub-hosted, like every job a required context waits on. It ran on
    # ak-ci-runners until the design of 2026-09-24: 6 min warm there, but its
    # queue on that pool was p50 16 / p90 131 min (2026-09-17..24), and a
    # stalled pool (the runner-2.335.1 rejection, an unschedulable node) held
    # every merge. Hosted it has no sccache and a 4-vCPU / 16 GB VM; the
    # estimate is 10-15 min cold, and the rust-cache below is saved from
    # `main` so PR runs are warm.
    runs-on: ubuntu-24.04
    # 30, not 20: a cold rust-cache is a full `cargo clippy` of the
    # dependency graph, and the job has been cancelled at 20 with every step
    # green, once inside the cache-save step itself (#3944). A cancellation
    # at the ceiling throws the whole run away; ten more minutes of headroom
    # cost nothing on a green run.
    timeout-minutes: 30
    needs: [changes, release-bump]
    # Skip (reported as success for required checks) on docs-only PRs and on
    # version-bump-only release PRs; `!cancelled()` + `!= 'false'` /
    # `!= 'true'` fail open if either gate itself failed.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.release-bump.outputs.bump_only != 'true' }}
    # Debuginfo off: it is the largest peak-memory contributor for a crate
    # this size (#1515) and fmt/clippy do not need it.
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler (#3551); this installs exactly
      # that version, with the clippy and rustfmt components the file lists.
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: clippy, rustfmt

      # The compiler is an input to this job and it used to be an untracked one
      # (#3551): when the self-hosted image picked up Rust 1.98.0,
      # `cargo clippy -- -D warnings` went from clean to 555 result_large_err
      # errors on an unchanged tree and took main, every open PR and the
      # release chain red at once, with no diff to point at.
      #
      # rust-toolchain.toml now pins it. This step is what makes the pin
      # falsifiable rather than decorative: it prints the pinned channel next to
      # the rustc this job is actually about to use and fails if they differ.
      # It runs before the cache restore so a drifted toolchain fails in
      # seconds with a named reason, instead of ten minutes later as a wall
      # of lints.
      - name: Assert the pinned Rust toolchain is in force
        run: ./scripts/ci/check-toolchain-pin.sh --active

      # The self-hosted image shipped protoc; ubuntu-24.04 does not, and
      # build scripts in the dependency tree (which clippy runs) need it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Cache the dependency build so only the workspace crate recompiles.
      # ~635 deps are byte-identical run-to-run.
      #
      # prefix-key v2 (was v1 on ak-ci-runners): the v1 tarballs were saved
      # from a per-job CARGO_HOME under the pod's RUNNER_TEMP (#3154), so
      # restoring one here would unpack the registry to a path this runner
      # never reads and leave the build cold anyway. A fresh namespace
      # repopulates from the first `main` push.
      #
      # save-if: only `main` (and release/**) pushes write the cache. A
      # cache saved under a `refs/pull/N/merge` ref can only ever be restored
      # by that same PR, and one saved under a merge group's
      # `gh-readonly-queue/...` ref by nothing at all; every PR and merge
      # group restores from the `refs/heads/main` entry (exact key or prefix
      # fallback). The repository sits at the 10 GiB cache limit, and
      # per-ref entries nobody restores are what push main's own entries out.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          shared-key: clippy
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Forbidden-pattern gate (#1316): authorization on API-token scopes must
      # use the canonical `token_service::scopes_grant_access` helper, never an
      # inline `== "admin"` / `.any(|s| s == "admin")` raw-string scope match.
      # This grep gate fails the build if the legacy idiom reappears in
      # backend/src (test modules and the canonical helper are excluded).
      - name: No legacy admin scope check
        run: ./scripts/ci/check-no-legacy-admin-scope.sh

      # Token-minting surface pin (#1315, epic #1617 -> #1615): every handler
      # that calls AuthService::generate_api_token must be in the reviewed set
      # and carry its reject rule (enforce_admin_only_scopes or require_admin).
      # A new token-minting endpoint added without updating the pinned list
      # fails the build, forcing a deliberate review of the privilege-escalation
      # surface.
      - name: Pin token-minting endpoint surface
        run: ./scripts/ci/check-token-mint-surface.sh

      # Auth-event audit completeness (#1617 Phase 1): every token mint/revoke
      # handler must emit an ApiTokenCreated/ApiTokenRevoked audit event, and
      # every federated (OIDC/SAML/LDAP) login must audit its Login/LoginFailed
      # outcome. Guards the compliance audit trail against silent regression.
      - name: Check auth-event audit coverage
        run: ./scripts/ci/check-auth-event-audit.sh

      # Migration-ledger divergence guardrail (#2689): fail the build if `main`
      # and an active `release/*` branch assign the SAME migration version
      # number to DIFFERENT content, which bricks upgrades across the fork with
      # `sqlx migrate run` VersionMismatch (root cause of #2686). Known/handled
      # divergences (release/1.5.x slots 154/155, reconciled by
      # migration_repair::repair_release_1_5_x_divergence) are pinned by SHA-384
      # in scripts/ci/migration-ledger-allowlist.txt; only NEW, unhandled reuse
      # fails. The script self-fetches the release branches (git fetch
      # --depth=1), so the shallow default checkout above needs no depth change.
      - name: Check migration-ledger divergence
        run: ./scripts/ci/check-migration-ledger.sh

      # Unit-test shard gates: every inline test module carries the shard
      # attribute its file maps to, no test sits outside a gated module (it
      # would run in every leg), and the shard list agrees across
      # scripts/ci/test-shards.py, backend/Cargo.toml, backend/build.rs and
      # the unit-test matrix below. A module without a gate still compiles
      # and runs locally, but in CI it would run in every leg; one gated to
      # a shard the matrix does not run would never run at all. Pure text,
      # ~1s.
      - name: Check unit-test shard gates
        run: python3 scripts/ci/test-shards.py check

      - name: Run Clippy
        # CARGO_BUILD_JOBS is the hosted runner's core count. It was capped
        # at 2 and then 4 on the self-hosted pool after lib-test compiles
        # were OOM-killed there (#1515, #1594, #1679); a check-only pass
        # peaks well below the instrumented lib-test build the unit shards
        # run at 4 on the same 16 GB VM. CARGO_INCREMENTAL=0: incremental
        # state is useless in CI's clean checkout and only adds memory.
        env:
          CARGO_BUILD_JOBS: "4"
          CARGO_INCREMENTAL: "0"
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Memory and disk headroom on the hosted VM, recorded on every run so
      # a drift toward the 16 GB / free-disk ceilings shows before it fails
      # a required check. memory.peak is the job's cgroup high-water mark
      # INCLUDING page cache (a Rust build writes GBs of target files), so it
      # is an upper bound, not the compiler's footprint. Report only: it
      # never fails the job.
      - name: Memory and disk report
        if: always()
        run: |
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          peak=$(cat "$cg/memory.peak" 2>/dev/null || echo "")
          if [ -n "$peak" ]; then
            printf 'cgroup %s memory.peak: %s GiB\n' "$cg" "$(awk -v b="$peak" 'BEGIN{printf "%.2f", b/1073741824}')"
          else
            echo "::warning title=No memory.peak::$cg/memory.peak is not readable; this run records no memory watermark."
          fi
          free -g
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  # UNIT TESTS + COVERAGE, SHARDED ACROSS GITHUB-HOSTED RUNNERS.
  #
  # The instrumented lib-test target used to be ONE rustc invocation holding
  # the production crate and all ~17.5k inline `#[cfg(test)]` tests. It
  # peaked at 16.7 GiB (measured with `-j4`, sampling the rustc process
  # itself), which is why it needed the self-hosted pool and was still
  # SIGKILLed at a 16 GiB limit (#3841, #3846, #3856). Every inline test
  # module now carries a shard gate (`#[cfg(ak_test_shard = "...")]`, applied
  # and checked by scripts/ci/test-shards.py; backend/build.rs turns the
  # `test-shard-<name>` feature into that cfg), and this matrix builds and
  # runs one shard per leg. Measured peak of the largest leg: see the shard
  # table in scripts/ci/test-shards.py -- it fits a standard 16 GB hosted
  # runner with room for Postgres.
  #
  # Every leg compiles the WHOLE production crate instrumented, so every
  # production line is instrumented in every leg; each test-module line is
  # instrumented in exactly one. `coverage-gates` sums the legs' lcov
  # reports per line (scripts/ci/merge-lcov.py), which reproduces the report
  # of one unsharded run, and then applies the same floor and new-code gates
  # as before.
  #
  # The integration suites (backend/tests/) are not part of this: they link
  # the library WITHOUT `cfg(test)`, so sharding does nothing for them. They
  # run in `test-backend-integration`. The required context
  # "🧪 Backend Unit Tests" is `test-backend-unit` below, which passes only
  # when every leg here passed AND the integration job passed or was
  # skipped by design.
  test-backend-unit-shard:
    name: 🧪 Unit Tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    # Measured locally per leg: ~2 min instrumented lib-test compile at -j4
    # (20-core aarch64 host; a 4-vCPU hosted runner is slower), ~2-4 min of
    # tests, plus the instrumented dependency graph when the cache misses.
    timeout-minutes: 60
    needs: [changes, release-bump]
    # Skip on docs-only PRs and version-bump-only release PRs -- see check-rust.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.release-bump.outputs.bump_only != 'true' }}
    strategy:
      # Every leg reports: a red run should say everything that broke, and
      # `coverage-gates` needs all of them anyway.
      fail-fast: false
      matrix:
        # Must equal `SHARDS` in scripts/ci/test-shards.py (its `check`
        # compares them, and it runs in Check Rust).
        shard: [handlers-1, handlers-2, services-1, services-2, router]
    env:
      # Debuginfo off: coverage mapping comes from the instrumentation
      # (`__llvm_covmap`), not DWARF, and debuginfo is the largest peak-RSS
      # contributor for a crate this size (#1515, #1679).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      # A hosted runner has 4 vCPU; CARGO_BUILD_JOBS is also the jobserver
      # budget for LLVM codegen threads inside the one heavy rustc.
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_NET_RETRY: "10"
      SQLX_OFFLINE: true
      # The shard whose leg also builds and runs the bin-target tests
      # (backend/src/main.rs's test module is gated to it). test-shards.py
      # `check` fails if this is not the shard main.rs's tests carry.
      BIN_SHARD: services-2
    services:
      # DB-backed lib tests need it; one fresh database per leg also means
      # the `db-serial` groups in .config/nextest.toml only have to
      # serialize tests within a shard.
      postgres:
        # GHCR mirror (.github/workflows/mirror-images.yml): Docker Hub
        # anonymous-pull rate limits used to abort jobs before tests compiled.
        image: ghcr.io/artifact-keeper/ci-mirror/postgres:18-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: artifact_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler; this installs exactly that
      # version plus llvm-tools (llvm-profdata / llvm-cov for cargo-llvm-cov).
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: llvm-tools-preview

      - name: Assert the pinned Rust toolchain is in force
        run: ./scripts/ci/check-toolchain-pin.sh --active

      - name: Install cargo-llvm-cov, cargo-nextest and sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest,sqlx-cli

      # The self-hosted runner image ships protoc; ubuntu-24.04 does not,
      # and build scripts in the dependency tree need it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The instrumented dependency graph (~750 crates, 3.3 GB) is identical
      # in every leg, so all legs share one cache entry. Saved from `main`
      # only (see the note on check-rust's rust-cache step; a merge group's
      # ref is as unrestorable as a PR's) and from one leg only, so five legs
      # do not race to write the same key.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          shared-key: unit-shard-instrumented
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' && matrix.shard == 'router' }}

      # Resolve and fetch in a step of its own, with a retry -- the recipe
      # the pool job adopted after a stale/truncated crates.io index failed
      # `main` before any test ran (run 31176621357). This retries resolution
      # and download ONLY; no test step is ever retried.
      - name: Fetch dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            echo "cargo fetch failed (attempt ${attempt}/3) — retrying" >&2
            sleep $(( attempt * 10 ))
          done
          echo "ERROR: cargo fetch failed after 3 attempts" >&2
          exit 1

      - name: Run database migrations
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              break
            fi
            echo "  waiting for postgres... ($i/30)"
            sleep 1
          done
          sqlx migrate run --source backend/migrations
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry

      # One step of its own, so a BUILD failure is visibly distinct from a
      # test failure (#3154). The lib-test and bin-test targets are compiled
      # one at a time: their two rustc processes overlap otherwise (#3494).
      # Only the BIN_SHARD leg has bin-target tests, so only it pays for the
      # bins pass (the non-test library, instrumented, then main.rs's test
      # harness). run-measured-build.sh records each pass's peak RSS in the
      # job summary and retries only a SIGKILL, once (#3856); without sccache
      # on this runner every rustc is a child of cargo, so the number it
      # records is the compiler's own.
      - name: Build instrumented test binaries
        id: build
        run: |
          source <(cargo llvm-cov show-env --sh)
          cargo llvm-cov clean --workspace
          ok=true
          ./scripts/ci/run-measured-build.sh "lib (${{ matrix.shard }})" \
            cargo nextest run --workspace --lib --no-run --features "test-shard-${{ matrix.shard }}" || ok=false
          if [ "$ok" = true ] && [ "${{ matrix.shard }}" = "$BIN_SHARD" ]; then
            ./scripts/ci/run-measured-build.sh bins \
              cargo nextest run --workspace --bins --no-run --features "test-shard-${{ matrix.shard }}" || ok=false
          fi
          if [ "$ok" != true ]; then
            echo "::error title=Test BUILD failed — no test ran (shard ${{ matrix.shard }})::cargo could not build this shard's instrumented test binaries, so none of its tests or coverage ran. A genuine compile error also fails Check Rust on this commit. If the log shows 'signal: 9 (SIGKILL)', the build ran out of memory and was ALREADY retried once (#3856): read the peak RSS in the job summary."
            exit 1
          fi

      # See the pool job's history (#3494, #3699, #3479) for the flags:
      # `--bins` on the leg that owns the bin-target tests, `--no-fail-fast`
      # so a red run reports every failure, and the LLVM %Nm merge pool so
      # ~3.5k test processes do not each write a .profraw.
      #
      # AK_TESTS_REQUIRE_DB: a database is provisioned, so a connect failure
      # is a hard failure rather than a silent skip (#2924). JWT_SECRET lets
      # the SSO credential-encryption tests exercise their real paths.
      - name: Run unit tests
        id: unit
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry
          AK_TESTS_REQUIRE_DB: "1"
          JWT_SECRET: ci-coverage-secret-at-least-32-bytes-long-for-tests
        run: |
          source <(cargo llvm-cov show-env --sh)
          export LLVM_PROFILE_FILE="${LLVM_PROFILE_FILE%/*}/%32m.profraw"
          if [ "${{ matrix.shard }}" = "$BIN_SHARD" ]; then
            cargo nextest run --workspace --lib --bins --features "test-shard-${{ matrix.shard }}" --test-threads 8 --no-fail-fast
          else
            cargo nextest run --workspace --lib --features "test-shard-${{ matrix.shard }}" --test-threads 8 --no-fail-fast
          fi

      # This leg's share of the report. Only a fully green run yields one (a
      # failed run's counters are partial); `coverage-gates` then reports
      # "no coverage" by name instead of merging an incomplete set.
      - name: Generate coverage report
        id: coverage
        if: steps.unit.outcome == 'success'
        run: |
          source <(cargo llvm-cov show-env --sh)
          mkdir -p coverage
          cargo llvm-cov report --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --summary-only > coverage/summary.txt
          tail -3 coverage/summary.txt

      - name: Upload coverage artifact
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-shard-${{ matrix.shard }}
          path: coverage/
          if-no-files-found: error

      # A hosted runner has ~14 GB free; measured locally the instrumented
      # target directory is ~3.5 GB per leg (4.3 GB on the BIN_SHARD leg).
      # Printed so a change in that margin is visible before it bites.
      - name: Disk usage
        if: always()
        run: |
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  # INTEGRATION SUITES (backend/tests/), GitHub-hosted.
  #
  # These link the library WITHOUT `cfg(test)`, so the unit-test sharding
  # above does nothing for them, and they need a Postgres and ~6 min of
  # serial execution. They were steps of the single pool job that also built
  # and ran the unit suite (#4208); that job's unit half moved to the hosted
  # matrix, and this is the rest of it. It does not instrument: its counters
  # never reached the coverage report.
  #
  #   1. the pure integration targets (Tier 1 contract tests);
  #   2. the `#[ignore]`d DB integration suite (Tier 2).
  #
  # WHERE: ubuntu-24.04, not ak-ci-runners. The required "🧪 Backend Unit
  # Tests" context waits on this job, so while it ran on the pool a stalled
  # or saturated rocky node blocked every merge (queue p90 181 min,
  # 2026-09-17..24). Nothing here needs the pool: Postgres is a service
  # container from the GHCR mirror, and the pool's persistent target
  # directory was an accelerator with an explicit fallback to `target/`.
  #
  # WHEN: always on merge_group and push, so the tree `main` gets is always
  # proven; on a pull request only when it changes what this job reads that
  # the unit shards do not (backend/tests/, backend/migrations/, this
  # workflow: the `changes` job's `tests` output) or carries the label
  # `ci:full`. That is about 60 of 300 backend PR runs a week, and it keeps
  # one hosted slot and ~30 job-minutes off the other 240. A skip here is
  # accepted by "🧪 Backend Unit Tests" only when this same condition is
  # false (see that job), and `rust`/`bump_only` skip it as before.
  test-backend-integration:
    name: 🧪 Backend Integration Tests
    runs-on: ubuntu-24.04
    # Hosted estimate 25-35 min cold (the pool run was ~2 min of test-crate
    # compile and ~6 min of serial tests on a warm persistent target dir).
    # The acceptance bar for staying on PRs is 35 min and 12 GiB peak RSS;
    # 60 is headroom for a cold rust-cache, since a cancellation at the
    # ceiling wastes the whole run.
    timeout-minutes: 60
    needs: [changes, release-bump]
    # Skip on docs-only PRs and version-bump-only release PRs — see check-rust.
    # `tests != 'false'` fails open: an empty output (the gate died) runs it.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.release-bump.outputs.bump_only != 'true' && (github.event_name == 'merge_group' || needs.changes.outputs.tests != 'false' || needs.changes.outputs.ci_full == 'true') }}
    # Debuginfo off to keep the library's compile memory down (#1515,
    # #1679, #3856). CARGO_BUILD_JOBS is the hosted runner's core count
    # (it was 6 on the 12-CPU pool pods).
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      # Let cargo retry transient registry errors itself before the fetch
      # step below fails.
      CARGO_NET_RETRY: "10"
    services:
      # The Tier 2 integration suites need it outright (#1031), and the
      # Tier 1 targets open it too.
      postgres:
        # GHCR mirror (.github/workflows/mirror-images.yml): Docker Hub
        # anonymous-pull rate limits used to abort jobs before tests compiled.
        image: ghcr.io/artifact-keeper/ci-mirror/postgres:18-alpine
        env:
          POSTGRES_USER: registry
          POSTGRES_PASSWORD: registry
          POSTGRES_DB: artifact_registry
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml pins the compiler (#3551); this installs exactly
      # that version, and the next step proves it is the one in force.
      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Assert the pinned Rust toolchain is in force
        run: ./scripts/ci/check-toolchain-pin.sh --active

      - name: Install cargo-nextest and sqlx-cli
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,sqlx-cli

      # The self-hosted image shipped protoc; ubuntu-24.04 does not, and
      # build scripts in the dependency tree need it.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # The dependency graph and the library, saved from `main` only (see
      # the note on check-rust's rust-cache step). The pool job had no
      # rust-cache: there CARGO_HOME was a per-job path and restored entries
      # were never considered fresh (jobs 35213124311 and 35213128071,
      # 2026-09-17). Here CARGO_HOME is the runner's ~/.cargo, the path
      # rust-cache is built for.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v2-rust
          shared-key: integration
          save-if: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}

      # Resolve and fetch in a step of its own with a retry, after a
      # stale/truncated crates.io index failed `main` before any test ran
      # (run 31176621357, 2026-08-07). This retries resolution and download
      # ONLY; no test step is ever retried. No `--locked`: the build steps do
      # not use it either, so adding it here would newly fail PRs with a
      # legitimately-updated Cargo.lock.
      - name: Fetch dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            echo "cargo fetch failed (attempt ${attempt}/3) — retrying" >&2
            sleep $(( attempt * 10 ))
          done
          echo "ERROR: cargo fetch failed after 3 attempts" >&2
          exit 1

      # Catch migration-slot collisions before they reach the e2e/nightly job.
      # The nightly run on 2026-05-09 (#1128) crashed at startup with
      # `duplicate key value violates unique constraint "_sqlx_migrations_pkey"
      # Key (version)=(73)` because a forward-port attempted to reuse a slot
      # already taken on main; #3313 recorded the same shape as a near-miss
      # (193 renumbered to 195 during review).
      #
      # MERGE-RESULT PROPERTY THIS DEPENDS ON (#3313): a duplicate version is
      # invisible on either PR branch alone — each branch has exactly one file
      # at the colliding number. The `pull_request` checkout above is the PR's
      # MERGE COMMIT, which is what makes this step able to see the collision
      # at all. Do not change this job to check out `pull_request.head`.
      # A PR that adds a migration always runs this job (`tests` covers
      # backend/migrations/), and a merge group always does: its checkout is
      # `main` plus every PR queued ahead, the one place two PRs that each
      # took the same slot finally meet.
      #
      # The check itself (numeric-normalised dedup + sequence-gap warning)
      # lives in a script so it is self-testable; its self-test runs in
      # shell-tests.
      - name: Lint migration slots are unique
        run: ./scripts/ci/check-duplicate-migrations.sh

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          # The service --health-cmd already runs pg_isready, but the step can
          # start before health flips to "healthy" on slower runners. A short
          # TCP readiness loop avoids a flaky first connect.
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              echo "Postgres reachable on attempt $i"
              exit 0
            fi
            echo "  waiting for postgres... ($i/30)"
            sleep 1
          done
          echo "ERROR: Postgres did not become reachable within 30s"
          exit 1

      - name: Run database migrations
        run: sqlx migrate run --source backend/migrations
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry

      # The Tier 1 test crates, compiled in a measured `--no-run` pass of their
      # own so a BUILD failure is visibly distinct from a test failure (#3154)
      # and the peak RSS lands in the job summary (#3856). This also builds
      # the library they link, which the Tier 2 pass below reuses.
      - name: Build pure integration targets
        id: build
        env:
          SQLX_OFFLINE: true
        run: |
          if ! ./scripts/ci/run-measured-build.sh integration-tier1 \
              cargo nextest run --workspace --no-run \
              --test workflow_scan_gate_tests \
              --test security_tests \
              --test security_regression_tests \
              --test streaming_invariant \
              --test pypi_filename_parse \
              --test pypi_name_normalization \
              --test pypi_path_parse \
              --test pypi_version_conformance \
              --test scan_dedup_short_circuit_tests; then
            echo "::error title=Integration test BUILD failed — no test ran::cargo could not build the integration test crates. A genuine compile error also fails Check Rust on this commit; if this log shows ENOENT / 'dep info' / cc errors in vendored sources, this was the #3154 flake class — rerun the job. 'signal: 9 (SIGKILL)' means out of memory, already retried once (#3856)."
            exit 1
          fi

      # `workflow_scan_gate_tests` is the #2609 contract guard: it asserts that
      # docker-publish.yml's Trivy enforcement pass still gates (exit-code '1',
      # CRITICAL/HIGH, ignore-unfixed, .trivyignore, non-SARIF format) and that
      # every merge-* job `needs: scan-containers`. It lives in backend/tests/
      # so it is an INTEGRATION target, and it ran in NO job at all (#3437).
      #
      # It and the other targets here run in this, the DEFAULT-set step,
      # rather than in the Tier 2 step below, because the Tier 2 step runs
      # the `#[ignore]`d set only: these tests are not `#[ignore]`d, so adding
      # them there yields "0 tests" -- a green, permanently vacuous gate.
      #
      # `--no-tests=fail` so a rename or deletion of the target is a red job
      # instead of a silent zero-test pass.
      #
      # #3494 widened this step from workflow_scan_gate_tests alone to every
      # integration target whose tests are NOT #[ignore]d:
      #
      #   * security_tests (13) — request-smuggling/traversal/injection
      #     regression checks, pure.
      #   * security_regression_tests (8 of 12) — GHSA regression pins; its 4
      #     #[ignore]d DB cases run in the Tier 2 step, which also names this
      #     target.
      #   * streaming_invariant (2) — the #1608 full-body-buffering ratchet
      #     (#3607: it had drifted stale because it never ran; reconciled).
      #   * pypi_filename_parse / pypi_name_normalization / pypi_path_parse /
      #     pypi_version_conformance (24) — PyPI conformance-corpus checks.
      #   * scan_dedup_short_circuit_tests (1 of 8) — the pure helper check;
      #     its 7 #[ignore]d DB cases run in the Tier 2 step.
      #
      # The `every_integration_target_is_wired_into_ci_or_exempt` gate in
      # backend/src/ci_test_surface.rs fails if a target with non-#[ignore]d
      # tests is missing from a default-set step like this one.
      #
      # The integration targets are one nextest test group
      # (.config/nextest.toml), so they run one at a time.
      - name: Run workflow contract and pure integration targets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          SQLX_OFFLINE: true
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry
          AK_TESTS_REQUIRE_DB: "1"
          JWT_SECRET: ci-coverage-secret-at-least-32-bytes-long-for-tests
        run: |
          cargo nextest run --workspace --no-tests=fail --test-threads 8 \
            --test workflow_scan_gate_tests \
            --test security_tests \
            --test security_regression_tests \
            --test streaming_invariant \
            --test pypi_filename_parse \
            --test pypi_name_normalization \
            --test pypi_path_parse \
            --test pypi_version_conformance \
            --test scan_dedup_short_circuit_tests

      # ── TIER 2: DB INTEGRATION SUITES ────────────────────────────────────
      #
      # Reuses the library the Tier 1 build above compiled; only the test
      # crates compile here.
      #
      # WHEN: whenever this job runs (see its `if`) on a push, a merge group
      # or manual dispatch, and on a pull request that touches backend code
      # (`needs.changes.outputs.backend`, #3124); a `ci:full` PR outside
      # backend code runs the Tier 1 targets above only. Fails open to
      # RUNNING: `!= 'false'` means an empty output
      # (the `changes` job died) runs the suite anyway. A failure here fails
      # this job, and with it the REQUIRED "🧪 Backend Unit Tests" context
      # (`test-backend-unit` below); ci-complete needs no separate rule.
      #
      # WHAT: `--run-ignored ignored-only` runs the postgres-backed
      # `#[ignore]`d suites under `backend/tests/` (#1031). The job provisions
      # Postgres but NOT a running HTTP backend, Meilisearch, Trivy, or live
      # cloud credentials, so the list is restricted to suites that need only
      # a Postgres connection.
      #
      # #3494 extended the allowlist from 15 targets to every DB-only suite:
      # the allowlist model had quietly left 44 of 61 integration targets
      # running in NO job on ANY trigger. The
      # `every_integration_target_is_wired_into_ci_or_exempt` gate in
      # backend/src/ci_test_surface.rs now fails this job if a
      # backend/tests/*.rs file is neither named in a `--test` invocation nor
      # explicitly exempted there with a justification, so a new suite can no
      # longer be silently dead. Targets with non-#[ignore]d tests run in the
      # Tier 1 step above instead; security_regression_tests and
      # scan_dedup_short_circuit_tests are mixed and correctly appear in BOTH.
      #
      # Added since: ci_oidc_exchange_e2e_tests (#4031 CI OIDC token exchange
      # through the full router against an in-process HTTPS issuer on a
      # non-loopback interface, trusted via CUSTOM_CA_CERT_PATH).
      #
      # Deliberately excluded (would panic on first .expect() without extra
      # infra). These are the EXEMPT entries in backend/src/ci_test_surface.rs
      # — the gate fails if this set and that list drift apart:
      #
      #   - azure_rbac_live_test, azure_shared_key_live_test, s3_integration
      #     (live cloud creds via std::env::var().expect)
      #   - integration_tests, replication_integration,
      #     tag_filtered_replication_tests, storage_backend_tests,
      #     download_ticket_tests
      #     (read TEST_BASE_URL, need a running HTTP backend)
      #   - incus_upload_tests (most cases construct the router without the
      #     optional_auth middleware, so handler `Extension<AuthExtension>`
      #     extracts panic with a 500. Only
      #     `test_chunked_upload_cross_repo_session_rejected` wires the
      #     middleware in, so that case runs by name in the step after this
      #     one, covering issue #1317 without the broken siblings).
      #
      # SERIAL: the DB-backed suites share schema state through global
      # DELETEs in their cleanup helpers and would race under parallel
      # execution. That used to be `cargo test -- --test-threads=1`; under
      # nextest it is the `kind(test)` override in .config/nextest.toml,
      # which puts every integration target in the single-threaded
      # `db-serial` test group. `--test-threads 8` here therefore does not
      # parallelise them -- the group caps them at one.
      #
      # The test crates are compiled in a measured `--no-run` pass first so a
      # compile failure is distinct from a test failure, and so their peak
      # RSS lands in the job summary next to the lib/bins passes.
      - name: Build integration test binaries
        id: integration-build
        if: ${{ !cancelled() && steps.build.outcome == 'success' && (github.event_name != 'pull_request' || needs.changes.outputs.backend != 'false') }}
        env:
          SQLX_OFFLINE: true
        run: |
          ./scripts/ci/run-measured-build.sh integration \
          cargo nextest run --workspace --no-run \
            --test lifecycle_policy_tests \
            --test api_token_cache_flush_tests \
            --test image_builds_tests \
            --test grpc_sbom_tests \
            --test search_reindex_tests \
            --test scan_convert_to_reused_tests \
            --test stuck_scan_janitor_tests \
            --test virtual_docker_grouped_listing_test \
            --test virtual_members_atomicity_test \
            --test virtual_members_duplicate_test \
            --test oci_chunked_upload_cross_repo_tests \
            --test sso_oidc_login_callback_e2e_tests \
            --test ci_oidc_exchange_e2e_tests \
            --test sso_saml_acs_e2e_tests \
            --test cache_invalidation_fanout_tests \
            --test age_gate_tests \
            --test scan_policy_validation_tests \
            --test ansible_galaxy_tests \
            --test admin_middleware_fresh_user_tests \
            --test backup_cleanup_reclaims_storage_tests \
            --test catalog_keyset_tests \
            --test composer_packages_index_tests \
            --test conan_error_paths_tests \
            --test gitlfs_locks_tests \
            --test grouped_listing_keyset_tests \
            --test manifest_blob_refs_tests \
            --test maven_virtual_groupid_shadowing_test \
            --test migration_storage_path_tests \
            --test oci_packages_index_tests \
            --test oci_upload_range_test \
            --test oci_virtual_resolution_tests \
            --test optional_auth_deactivation_tests \
            --test promotion_block_unscanned_tests \
            --test promotion_open_cve_gating_tests \
            --test pypi_proxy_upload_time_tests \
            --test rpm_generic_upload_metadata_tests \
            --test sbom_cached_artifact_not_analyzable_tests \
            --test scan_dashboard_aggregation_tests \
            --test scan_dedup_short_circuit_tests \
            --test scan_dedup_zero_findings_ttl_tests \
            --test scan_latest_per_artifact_tests \
            --test search_checksum_sha1_md5_tests \
            --test search_sort_size_tests \
            --test security_regression_tests \
            --test setup_replica_unlock_tests \
            --test storage_stats_tests \
            --test swift_virtual_lookup_tests \
            --test users_password_routing_tests \
            --test incus_upload_tests

      # The Tier 2 suites assert instance-wide aggregates (e.g. the scan
      # dashboard totals in scan_latest_per_artifact_tests), so they must not
      # share a database with the Tier 1 targets that ran earlier in this job
      # and may have left rows behind; give them a fresh database on the same
      # service.
      - name: Create a fresh database for the integration suites
        if: ${{ !cancelled() && steps.integration-build.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry_integ
        run: |
          sqlx database create
          sqlx migrate run --source backend/migrations

      # AK_TESTS_REQUIRE_DB: Postgres is provisioned, so a connect failure
      # must be a loud failure, not a silent skip-and-PASS (#2924).
      - name: Run integration tests
        if: ${{ !cancelled() && steps.integration-build.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry_integ
          SQLX_OFFLINE: true
          AK_TESTS_REQUIRE_DB: "1"
          JWT_SECRET: ci-coverage-secret-at-least-32-bytes-long-for-tests
        run: |
          cargo nextest run --workspace --no-tests=fail --no-fail-fast --test-threads 8 \
            --run-ignored ignored-only \
            --test lifecycle_policy_tests \
            --test api_token_cache_flush_tests \
            --test image_builds_tests \
            --test grpc_sbom_tests \
            --test search_reindex_tests \
            --test scan_convert_to_reused_tests \
            --test stuck_scan_janitor_tests \
            --test virtual_docker_grouped_listing_test \
            --test virtual_members_atomicity_test \
            --test virtual_members_duplicate_test \
            --test oci_chunked_upload_cross_repo_tests \
            --test sso_oidc_login_callback_e2e_tests \
            --test ci_oidc_exchange_e2e_tests \
            --test sso_saml_acs_e2e_tests \
            --test cache_invalidation_fanout_tests \
            --test age_gate_tests \
            --test scan_policy_validation_tests \
            --test ansible_galaxy_tests \
            --test admin_middleware_fresh_user_tests \
            --test backup_cleanup_reclaims_storage_tests \
            --test catalog_keyset_tests \
            --test composer_packages_index_tests \
            --test conan_error_paths_tests \
            --test gitlfs_locks_tests \
            --test grouped_listing_keyset_tests \
            --test manifest_blob_refs_tests \
            --test maven_virtual_groupid_shadowing_test \
            --test migration_storage_path_tests \
            --test oci_packages_index_tests \
            --test oci_upload_range_test \
            --test oci_virtual_resolution_tests \
            --test optional_auth_deactivation_tests \
            --test promotion_block_unscanned_tests \
            --test promotion_open_cve_gating_tests \
            --test pypi_proxy_upload_time_tests \
            --test rpm_generic_upload_metadata_tests \
            --test sbom_cached_artifact_not_analyzable_tests \
            --test scan_dashboard_aggregation_tests \
            --test scan_dedup_short_circuit_tests \
            --test scan_dedup_zero_findings_ttl_tests \
            --test scan_latest_per_artifact_tests \
            --test search_checksum_sha1_md5_tests \
            --test search_sort_size_tests \
            --test security_regression_tests \
            --test setup_replica_unlock_tests \
            --test storage_stats_tests \
            --test swift_virtual_lookup_tests \
            --test users_password_routing_tests

      # `incus_upload_tests::test_chunked_upload_cross_repo_session_rejected`
      # is the only case in that file currently wired to run without an HTTP
      # server (see the exclusion note above). Run it by name so the #1317
      # incus regression has coverage too; `--no-tests=fail` turns a rename
      # of the test into a red step instead of a silent zero-test pass.
      - name: Run incus cross-repo session regression
        if: ${{ !cancelled() && steps.integration-build.outcome == 'success' }}
        env:
          DATABASE_URL: postgresql://registry:registry@localhost:5432/artifact_registry_integ
          SQLX_OFFLINE: true
          AK_TESTS_REQUIRE_DB: "1"
          JWT_SECRET: ci-coverage-secret-at-least-32-bytes-long-for-tests
        run: |
          cargo nextest run --workspace --no-tests=fail \
            --run-ignored ignored-only \
            --test incus_upload_tests \
            test_chunked_upload_cross_repo_session_rejected

      # The acceptance numbers for keeping this job on hosted PR runs: the
      # per-process peak RSS of each build pass is already in the job
      # summary (run-measured-build.sh, GNU time); this adds the job's
      # cgroup high-water mark (an upper bound: it includes page cache) and
      # the disk left on the VM. Report only, never fails the job.
      - name: Memory and disk report
        if: always()
        run: |
          cg="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          peak=$(cat "$cg/memory.peak" 2>/dev/null || echo "")
          if [ -n "$peak" ]; then
            gib=$(awk -v b="$peak" 'BEGIN{printf "%.2f", b/1073741824}')
            echo "cgroup $cg memory.peak: ${gib} GiB"
            echo "cgroup memory.peak (includes page cache): ${gib} GiB" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=No memory.peak::$cg/memory.peak is not readable; this run records no cgroup watermark."
          fi
          free -g
          df -h / | tail -1
          du -sh target 2>/dev/null || true

  # The REQUIRED branch-protection context "🧪 Backend Unit Tests" -- do not
  # rename it. Its job used to do all of the work; the work is now the
  # sharded hosted matrix above plus the hosted integration job, and this
  # is the one context that says both passed. Downstream `needs:` on
  # `test-backend-unit` (smoke-e2e, ci-complete) keep their meaning.
  #
  # `!cancelled()`, not the default `success()`: with the default, a failed
  # leg would make this job SKIPPED, and a skipped required check passes.
  # The `rust`/`bump_only` conditions are the legs' own, so it is skipped
  # exactly when they are (docs-only and version-bump-only PRs).
  #
  # The integration job may be SKIPPED BY DESIGN on a pull request that
  # changes none of its inputs and has no `ci:full` label. INTEGRATION_WANTED
  # is that job's own condition, evaluated the same way (and failing open
  # the same way), so a skip passes here only when that job was not meant
  # to run; any other skip, and every failure or cancellation, fails.
  test-backend-unit:
    name: 🧪 Backend Unit Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [changes, release-bump, test-backend-unit-shard, test-backend-integration]
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' && needs.release-bump.outputs.bump_only != 'true' }}
    steps:
      - name: Require every unit-test shard and the integration suites
        env:
          RESULT_SHARDS: ${{ needs.test-backend-unit-shard.result }}
          RESULT_INTEGRATION: ${{ needs.test-backend-integration.result }}
          INTEGRATION_WANTED: ${{ github.event_name == 'merge_group' || needs.changes.outputs.tests != 'false' || needs.changes.outputs.ci_full == 'true' }}
        run: |
          echo "unit-test shards: ${RESULT_SHARDS:-missing}"
          echo "integration suites: ${RESULT_INTEGRATION:-missing} (wanted: ${INTEGRATION_WANTED:-missing})"
          integration_ok=false
          if [ "$RESULT_INTEGRATION" = "success" ]; then
            integration_ok=true
          elif [ "$RESULT_INTEGRATION" = "skipped" ] && [ "$INTEGRATION_WANTED" = "false" ]; then
            integration_ok=true
            echo "integration suites skipped by design: no backend/tests, backend/migrations or ci.yml change and no ci:full label; the merge-group and push runs always run them"
          fi
          if [ "$RESULT_SHARDS" != "success" ] || [ "$integration_ok" != "true" ]; then
            echo "::error title=Backend tests did not pass::unit-test shards: ${RESULT_SHARDS:-missing}, integration suites: ${RESULT_INTEGRATION:-missing}. Open the failed '🧪 Unit Tests (<shard>)' or '🧪 Backend Integration Tests' job for the failure."
            exit 1
          fi

  shell-tests:
    name: 🐚 Shell Tests
    runs-on: ubuntu-24.04
    needs: changes
    # Skip on docs-only PRs — see check-rust.
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    # Self-contained bash + python3 regression tests for docker/ init scripts.
    # Runs in seconds and uses only the dependencies pre-installed on the
    # ubuntu-24.04 image (bash, python3, jq, curl). Kept off the Rust
    # critical path so it does not gate cargo jobs.
    # Cap wall-clock so a hung mock HTTP server (Python BaseHTTPRequestHandler
    # blocking in serve_forever) cannot pin a Tier 1 required check for the
    # 6h GitHub default. The whole script runs in well under a minute.
    timeout-minutes: 5
    steps:
      # `fetch-depth: 0` for the CHANGELOG-placement gate below (#3797): it
      # compares the bullets this branch ADDS against
      # `git merge-base HEAD origin/<base>`, and a depth-1 checkout has no
      # common ancestor to find. Same reasoning, and the same shape, as the
      # version-pin-bump job -- the script reports INFRA rather than guessing
      # a base, so a shallow checkout would leave it permanently
      # indeterminate instead of silently changing its verdict.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Into a STABLE remote-tracking ref, not FETCH_HEAD (see the
      # coverage-gates job's note on #1798). Only a pull_request has a base ref; on push the
      # placement gate below is a documented no-op, so nothing needs fetching.
      - name: Fetch the base ref
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: dtrack-init regression test
        run: bash docker/test-init-dtrack.sh

      # The cache-correctness E2E reads its verdict off the mock upstream's
      # counters, so a wrong mock reports a product bug that is not there. It
      # did: the backend revalidates an expired TTL with a CONDITIONAL HEAD
      # (`UpstreamClient::check_etag_changed`), the mock's do_HEAD answered an
      # unconditional 200 with no ETag, and the suite reported
      # "revalidations=0 — mutable serving stale" against a backend that was
      # behaving correctly (#3950). The E2E itself runs weekly and takes ~25
      # minutes; this pins the mock's HTTP contract here, in ~2s, on every PR.
      # Boots the mock on an ephemeral loopback port and drives it with curl;
      # no Docker, no network.
      - name: mock-upstream HTTP contract test
        run: bash scripts/native-tests/mock-upstream/test_mock_upstream.sh

      # Container CVE gate honesty (#3122): a Trivy step that BLOCKS a publish
      # must actually apply the severity filter it declares. trivy-action
      # silently `unset`s TRIVY_SEVERITY when the format is SARIF, which turned
      # the documented "CRITICAL,HIGH only" gate into one that failed on a
      # fixable CVE of ANY severity — a LOW blocked all publishing from `main`
      # for days (#3121). Pure YAML inspection, no network, runs in ~1s.
      - name: Check Trivy gate severity filter
        run: ./scripts/ci/check-trivy-gate-severity.sh

      # Same species as the check above, one layer out (#3308). That one asks
      # "does the publish gate apply the filter it declares?"; this one asks
      # "does the PRE-TAG gate block on what it just measured?" It did not:
      # release-preflight.sh printed "a tag cut will likely stall" and
      # "READY: ... Safe to cut the tag." in the same run, because the
      # measured-red branch called `warn` (non-incrementing) instead of `bad`.
      #
      # It needs a test rather than a live run because the interesting case is
      # invisible whenever main is green: with a green Docker Publish the buggy
      # and fixed scripts are byte-identical in behaviour. Stubs `gh`, so no
      # network and no dependence on main's current health. ~1s.
      #
      # Also covers check 4 (#3339), which asks whether a component's pinned
      # VERSION tag is already published from different sources. Same species
      # again: the v1.7.2 tag died on that collision while Docker Publish on
      # main passed for the SAME commit, because the exact-tag check only runs
      # on a clean refs/tags/v* ref. Registry answers are stubbed too, so this
      # stays offline.
      - name: Check release-preflight gates block on what they measure
        run: bash scripts/ci/test-release-preflight.sh

      # One layer further out again (#3538). The preflight can be right and
      # still not matter: nothing asserted that one had RUN against the commit
      # being tagged. v1.7.5 burned a version number to a check that existed
      # and was never run; v1.7.7 was tagged 18 minutes after a preflight
      # reported "verdict does not exist yet", and the run it was waiting on
      # concluded failure 19 seconds after the tag push. release.yml now
      # requires evidence of a green preflight for `github.sha`, and this
      # exercises every leg of that gate -- most importantly the ones that must
      # BLOCK (in-flight, superseded green, evidence naming another commit) and
      # the break-glass override, which must be loud and must refuse a bypass
      # with no stated reason. Stubs `gh`; offline, ~1s.
      - name: Check the preflight-evidence gate blocks what it must
        run: bash scripts/ci/test-assert-preflight-evidence.sh

      # The candidate-then-promote release flow (#3771, #3772, #3773; epic
      # #3769): nothing gets a permanent name until the full gate has passed
      # on the exact commit. Six scripts carry it, and every one has a
      # fail-open direction that a live run would only reveal at a cut:
      #   * assert-candidate-certified.sh -- the certification gate the
      #     promote, release.yml and docker-publish.yml all stand behind;
      #     must refuse a missing, foreign-workflow, other-commit, or
      #     digest-drifted certification, and report INFRA, never a pass,
      #     when it cannot measure;
      #   * resolve-certified-ref.sh -- WHICH branch may have certified a
      #     commit, and therefore which signing identity the gate demands
      #     once a patch release can be cut from release/X.Y.x. Its
      #     permissive direction hands an attacker-controlled branch the
      #     right to sign, so it must refuse an arbitrary branch, a case
      #     variant of a real one, a commit on neither, and a
      #     release-candidate.yml that is not byte-identical to a copy that
      #     lives on main;
      #   * registry-tag-digest.sh -- the digest probe the certification is
      #     compared against; must never invent a digest or read a 404 from
      #     an unreadable repository as absence;
      #   * assert-adapter-exact-version.sh -- the scanner-adapter check that
      #     used to run only on a stable tag push, now asked of the commit;
      #   * follow-dispatched-run.sh -- which dispatched run vouches for a
      #     step; must not follow another ref's or an older dispatch's run;
      #   * assert-changelog-documents-version.sh -- moved out of release.yml
      #     so the candidate can run it; pinned to behave as before.
      # All stub gh / curl / the registry probes; offline, ~1s each.
      - name: Check the release-candidate certification gate blocks what it must
        run: bash scripts/ci/test-assert-candidate-certified.sh
      - name: Check the certifying-ref resolver refuses every branch but the two
        run: bash scripts/ci/test-resolve-certified-ref.sh
      - name: Check the registry digest probe never guesses
        run: bash scripts/ci/test-registry-tag-digest.sh
      - name: Check the scanner-adapter exact-version parity check
        run: bash scripts/ci/test-assert-adapter-exact-version.sh
      - name: Check the dispatched-run follower selects the right run
        run: bash scripts/ci/test-follow-dispatched-run.sh
      - name: Check the CHANGELOG-documents-version gate
        run: bash scripts/ci/test-assert-changelog-documents-version.sh

      # release.yml's resolve-candidate-digest job picks WHICH docker-publish
      # run vouches for the commit being released (#3640). Both directions are
      # dangerous: accepting a success for another sha/ref is fail-open, and
      # accepting only event=push deadlocks a re-tagged release forever (the
      # v1.8.2 shape: the push run fails permanently on image immutability
      # while the documented promote dispatch succeeded). Stubs `gh`; offline,
      # ~1s.
      - name: Check the candidate publish-run resolver selects and blocks correctly
        run: bash scripts/ci/test-resolve-candidate-publish-run.sh

      # The other half of #3640: when the accepted run is a promote dispatch,
      # the published bytes were built from a DIFFERENT commit than the tag,
      # and adoption must be verified against the image's actual input set --
      # fail-open here certifies stale bytes for a tag they were not built
      # from. Real git commits in a scratch repo; the refusal legs (backend
      # source, Dockerfile, .dockerignore, missing provenance) are the point.
      # Offline, ~1s.
      - name: Check the image-adoption gate refuses what it must
        run: bash scripts/ci/test-assert-adopted-image-sources.sh

      # Duplicate sqlx migration versions merge CLEAN and abort the backend at
      # startup (#3313, #1128). The live gate runs in test-backend-unit against
      # the merge result; this exercises the script's failure modes (numeric
      # normalisation, gaps, unparseable prefixes) so the gate itself cannot
      # silently rot. ~1s, no dependencies.
      - name: Check duplicate-migration gate catches what it must
        run: bash scripts/ci/test-check-duplicate-migrations.sh

      # A release prep that renames `## [Unreleased]` to `## [X.Y.Z]` without
      # opening a fresh empty one strands every entry that lands after it:
      # PR branches cut before the rename anchor into the renamed, ALREADY
      # RELEASED section and merge with no conflict and no warning. That is
      # how 30 entries of 1.8.0 work ended up filed under `[1.7.5]`, a version
      # that produced no images and no release object (#3433, #3429). The
      # assertion is one grep — the first `## [` heading must be
      # `## [Unreleased]` — and it is a repo-state invariant, so it fires on
      # whichever PR reaches CI first rather than depending on who did it.
      #
      # The same script validates every CHANGELOG fragment under
      # changes/unreleased/ (one file per PR; the shared CHANGELOG.md was
      # what forced every open PR to rebase after each merge). Same docs-only
      # caveat as the placement gate below: a PR that adds only a fragment and
      # docs skips this job, so a malformed fragment is caught by the next
      # code PR, or by the release preflight (check 5), at the latest.
      - name: Check CHANGELOG has an open [Unreleased] section and valid fragments
        run: ./scripts/ci/check-changelog-unreleased.sh

      - name: Check the CHANGELOG gate catches what it must
        run: bash scripts/ci/test-check-changelog-unreleased.sh

      # The release prep renders changes/unreleased/ into the new
      # `## [X.Y.Z]` section (scripts/release/assemble-changelog.sh). This
      # pins that the rendering is lossless and deterministic, merges bullets
      # still under `[Unreleased]` (the transition window), and refuses to
      # file entries under a version that already has a section. Offline, ~1s.
      - name: Check the CHANGELOG fragment assembler renders what it must
        run: bash scripts/ci/test-changelog-fragments.sh

      # `d980ea92` (#3664) merged into main with CHANGELOG.md still carrying a
      # three-line conflict block between two `[Unreleased]` -> `### Security`
      # bullets, and every check was green: nothing in this repository reads a
      # file looking for the markers git writes when it cannot merge. They sat
      # on main for ~3 hours and three later PRs inherited them; had 1.9.0 been
      # cut in that window the promoted section and the release notes would
      # have carried them verbatim (#3675, #3676). A `.rs` or `.sql` file would
      # have failed to compile -- Markdown, YAML comments, `.env.example`, Helm
      # templates and workflow files all merge and ship intact -- so the scan
      # is repo-wide over tracked files rather than CHANGELOG-only. One
      # `git grep`, no toolchain, ~1s.
      - name: Check no git conflict markers are committed
        run: ./scripts/ci/check-conflict-markers.sh

      - name: Check the conflict-marker gate catches what it must
        run: bash scripts/ci/test-check-conflict-markers.sh

      # The other half of the CHANGELOG bookkeeping (#3797). A branch cut
      # before a release cut anchors its bullet to `## [Unreleased]`; the cut
      # renames that heading and opens a fresh one, so when the branch merges
      # main the hunk still applies -- CLEANLY -- and the entry ends up
      # documenting a version that shipped without it. Four PRs did exactly
      # that in one day (#3570 reached main), and nothing saw it: the merge is
      # clean, the gate above only asserts that an `[Unreleased]` section
      # exists, and preflight check 5 matches bullets by `#NNNN` wherever they
      # sit. This is the only gate here that needs a DIFF rather than a
      # repo-state invariant, which is why the checkout above is full-depth.
      # Pure git, no network, ~1s.
      #
      # Same docs-only caveat as the gate above: a CHANGELOG-only PR skips
      # this job entirely, so detection is delayed to the next code PR. The
      # shape this exists for arrives on code PRs.
      #
      # It also validates the fragments this PR adds (changes/unreleased/),
      # and exempts bullets under a `## [X.Y.Z]` heading the PR itself adds:
      # that is a release prep assembling the fragments, not a stranded entry.
      - name: Check CHANGELOG bullets land under [Unreleased] and fragments are valid
        run: ./scripts/ci/check-changelog-placement.sh "origin/${GITHUB_BASE_REF:-main}"

      - name: Check the CHANGELOG-placement gate catches what it must
        run: bash scripts/ci/test-check-changelog-placement.sh

      # The unit-test job's instrumented build is wrapped by
      # run-measured-build.sh, which retries a SIGKILL once (#3856). A retry
      # is only safe if it is NARROW, and neither half of that is observable
      # on a green run: the interesting cases need a runner that is out of
      # memory. So this stands fake commands in for the build — exit 137,
      # cargo's "(signal: 9 (SIGKILL))" with cargo's own exit 101, an
      # ordinary compile error, and a fail-once-then-succeed — and asserts
      # that only the SIGKILLs are retried, that a compile error still fails
      # on the first attempt, and that a retried SIGKILL is still written to
      # the job summary so the trend stays visible. Offline, ~1s.
      - name: Check the instrumented-build retry only retries SIGKILLs
        run: bash scripts/ci/test-run-measured-build.sh

      # The release-branch gate only runs on PRs against `release/*` — a
      # handful of runs per release, far too rare to notice a regression in.
      # It matters most for the two exemptions #3422 added (release prep,
      # narrowed backport), which must keep FAILING for everything they are
      # not: a `chore(release):` commit that also touches source, a
      # version-file-only commit under another subject, a cherry-pick trailer
      # naming a sha main does not have. Builds throwaway git repos; ~2s.
      - name: Check release-branch gate exemptions stay narrow
        run: bash scripts/ci/test-check-release-branch-commits.sh

      # Creating a release line runs once or twice a year, by hand, and for
      # the length of one API call it holds ruleset 20038606 open -- there is
      # no run to notice a regression in and both failure directions are
      # expensive (#3798). Pins the preconditions that keep an unreviewed
      # commit off the root of a release line, that `--dry-run` issues no
      # PUT/POST, and that a FAILED ref creation still restores
      # enforcement=active. Stubs `gh`; throwaway git repos, offline, ~2s.
      - name: Check the release-line creation procedure stays safe
        run: bash scripts/ci/test-create-release-line.sh
      # The other half of that gate, and the half the script self-test cannot
      # see: the WORKFLOW deciding whether to call the script at all (#4070).
      # `release-process: approved` used to skip every step, and a job whose
      # steps all skip still concludes success — so the required
      # `Verify commits trace back to main` context on ruleset 20038606 was
      # satisfied by anyone who could open a PR against `release/*` and label
      # their own PR. This asserts the wiring: nothing derived from a label may
      # condition the gate, and the gate step is still there to be conditioned.
      # Pure YAML inspection, no network, ~1s.
      - name: Check no label can bypass the release-branch gate
        run: bash scripts/ci/test-release-branch-gate.sh

      # Documentation describing a gate configuration that has since moved is
      # invisible to every other check here: docs are not compiled, linted or
      # executed. CLAUDE.md's mandatory pre-push checklist named
      # a plain `cargo test` unit-test run long after both CI unit-test jobs had
      # moved to nextest, so a contributor following it saw ten NuGet failures
      # unrelated to their change on a clean tree, and a hung run at the default
      # thread count — which teaches people to ignore red (#3479). This pins the
      # documented command to the one CI invokes. ~1s, no dependencies.
      - name: Check the pre-push test command matches CI
        run: ./scripts/ci/check-docs-test-command.sh

      - name: Check the docs/CI drift gate catches what it must
        run: bash scripts/ci/test-check-docs-test-command.sh

      # Six STEP-level `continue-on-error: true` on `Generate artifact
      # attestation` and `Attach VEX attestations` meant a failed provenance
      # push left the merge job GREEN and published the image anyway, with no
      # annotation and nothing in `needs.<job>.result` — so build provenance
      # had never been proven to attach to any image (#3496). Same species as
      # #2824 (cosign failed, 1.6.1 shipped unsigned). This pins the
      # invariant: attestation and cosign steps may never be soft-failed, and
      # docker-publish.yml may carry no step-level continue-on-error at all.
      # Pure YAML inspection, no network, ~1s.
      - name: Check supply-chain steps cannot fail silently
        run: ./scripts/ci/check-supply-chain-soft-fail.sh

      # Static half of the #3551 toolchain pin: rust-toolchain.toml must name a
      # concrete version, and no workflow may re-float past it with a
      # `dtolnay/rust-toolchain@stable` ref or a contradicting `toolchain:`
      # input. check-rust asserts the live compiler; this asserts the
      # configuration, on every PR including ones that touch no Rust. Pure file
      # inspection, no network, ~1s.
      - name: Check the Rust toolchain pin has not re-floated
        run: ./scripts/ci/check-toolchain-pin.sh

      - name: Check the toolchain-pin gate catches what it must
        run: bash scripts/ci/test-check-toolchain-pin.sh

      # The red-team suite's own reporting (#3491). It ran green against 1.8.0
      # while its report could not be parsed by `jq`, its summary printed
      # "Passed: 1 checks" after dozens of PASS lines, and its exit-code gate
      # therefore never fired — all because run-all.sh INVOKES each test script
      # rather than sourcing it, so the counters reset per script. A suite that
      # reports wrongly is worse than no suite, and none of it is visible from
      # a green run. Drives lib.sh and run-all.sh against a stub `curl`, so no
      # registry, no docker network and no redteam image are needed; ~1s.
      - name: Check the red-team suite reports what it measured
        run: bash scripts/ci/test-redteam-report.sh

      - name: Check the supply-chain soft-fail gate catches what it must
        run: bash scripts/ci/test-check-supply-chain-soft-fail.sh

      # The soft-fail guard above proves the signing step CAN report its own
      # failure. It cannot prove the signature reached the image that ships:
      # `cosign sign` prints nothing on the happy path, and the digest it is
      # given comes from the same job, so a green publish is not evidence
      # (#3559). docker-publish.yml now re-resolves each published TAG through
      # the registry and demands a cosign signature over that digest, and this
      # exercises every leg of that check — most importantly the three that
      # must BLOCK and would be easy to get wrong: an image carrying only an
      # `attest-build-provenance` bundle (which a bare `cosign verify` under
      # cosign v3 ACCEPTS), a valid signature over a DIFFERENT digest than the
      # tag resolves to, and an identity pattern loose enough to accept any
      # signer. The infrastructure legs assert exit 2 specifically, so a
      # Fulcio/Rekor outage can never be reported as a tampered image. Stubs
      # `curl` and `cosign`; offline, ~1s.
      - name: Check the published-signature gate catches what it must
        run: bash scripts/ci/test-check-published-image-signature.sh

      # One question further out again (#3519). The gate above proves a
      # published tag resolves to SIGNED bytes; nothing proved it resolves to
      # ATTESTED bytes. The four `Generate artifact attestation` steps carried
      # `continue-on-error: true` from the day they were added (#3496), so a
      # failed provenance push was indistinguishable from success and no
      # published digest's provenance has ever been proven present; #3518
      # made them hard-fail, which only proves the ACTION reported success --
      # a predicate pushed against the wrong subject still survives.
      # docker-publish.yml's `verify-published` now re-asks both questions
      # from the release tag, with `gh attestation verify oci://<image>@<digest>`
      # and the #3559 signature gate, and this exercises every leg of that
      # decision -- most importantly the ones that must BLOCK and would be
      # easy to get wrong: a digest with a signature and no provenance
      # (#3519's own shape), a digest with provenance and no signature
      # (#2824's), and a predicate of the wrong TYPE, which `--predicate-type`
      # should already have filtered out. The infrastructure legs assert exit
      # 2 specifically, so an attestations-API outage can never be reported as
      # an unattested image, and the suspended-image legs pin the one
      # exemption (backend-alpine publishes nothing, so its absent/unreadable
      # package must not redden a release cut). Stubs `gh` and both probe
      # commands; offline, ~1s.
      - name: Check the published-attestation audit catches what it must
        run: bash scripts/ci/test-audit-published-attestations.sh

      # The runtime gate above asserts about the refs it is HANDED, so it
      # cannot see a registry nobody passed it. That is not hypothetical: the
      # Docker Hub mirrors of every published image shipped unsigned for the
      # project's entire history because `cosign sign` was only ever given the
      # ghcr ref (#3562). Nothing was broken — a whole distribution channel was
      # simply absent from the controls, and absence is invisible to a runtime
      # check. This reads docker-publish.yml and requires that every registry a
      # publish job mirrors to is also one it signs on and verifies. Pure YAML
      # inspection, no network, ~1s.
      - name: Check every published registry is signed and verified
        run: ./scripts/ci/check-registry-publish-parity.sh

      - name: Check the registry-parity gate catches what it must
        run: bash scripts/ci/test-check-registry-publish-parity.sh

      # Four of the last eight releases shipped with wrong release bookkeeping
      # — a missing curated notes file, bullets filed under an already-released
      # heading, an [Unreleased] heading renamed without a fresh one being
      # opened — and every one was found by a human days later (#3537). The
      # gates that close those shapes fire only on a `v*` tag push, a handful
      # of runs per release, and their interesting cases are ones nobody wants
      # to reproduce live: a release that publishes with no curated notes
      # cannot be un-published. This exercises them offline, including the
      # `Resolve release notes` run-block extracted straight out of
      # release.yml, so a revert to the silent auto-notes fallback is a red
      # test rather than a review miss. Stubs `gh`; ~2s.
      - name: Check the release-bookkeeping gates catch what they must
        run: bash scripts/ci/test-assert-release-bookkeeping.sh

      # `:latest` and `:X.Y` used to be written by the merge jobs at tag-push
      # time -- before the release gate, which is what tests the bytes those
      # tags name. On v1.8.1 that gap was 78 minutes on a cut where nothing
      # went wrong; v1.7.2 published `:latest` for a version that was retired
      # with the gate never run. The fix is an ORDERING, and an ordering is
      # invisible on a green run: the same tags exist either way. So the
      # arrangement is pinned structurally -- exactly one job writes floating
      # tags, it fans in from every merge job with no `if:`, and the release
      # path promotes only after the gate and the release. Pure YAML
      # inspection, no network, ~1s.
      - name: Check floating tags are confined to the post-gate promotion
        run: ./scripts/ci/check-floating-tag-promotion.sh

      - name: Check the floating-tag gate catches what it must
        run: bash scripts/ci/test-check-floating-tag-promotion.sh

      # The rule the promotion obeys: a floating tag may only name a version
      # with a published GitHub Release, and only if it is newest in that line.
      # Its interesting cases (a backport that moves :X.Y but not :latest, a
      # version whose images exist but whose release never published) happen
      # about once per release and never on a normal one.
      - name: Check the floating-tag promotion rule
        run: bash scripts/ci/test-floating-tag-plan.sh

      # The scanner-adapter's published set (the adapter VERSION each
      # published release ships) feeds that rule on both the promote side and
      # the release-side assert; a lookup that fails open can only make an
      # older adapter version look newest, so the failure modes are pinned.
      - name: Check the adapter published-set resolver fails closed
        run: bash scripts/ci/test-adapter-published-set.sh

      # Release binaries shipped with only a `<name>.sha256` beside them, which
      # is served from the same place, by the same authority, as the artifact it
      # describes -- so whoever can replace the tarball can replace the checksum
      # (#3558). They are now covered by a cosign keyless signature over a
      # `checksums.txt` manifest and by build provenance, and release.yml
      # VERIFIES both before `Create Release`. That verification runs once per
      # release, on a path nobody can rehearse without cutting a tag, so its
      # failure legs are exercised here instead -- including the one that
      # matters most: a real, valid signature carrying the WRONG certificate
      # identity, which a permissive `--certificate-identity-regexp` would wave
      # through. Stubs `cosign` and `gh`; offline, ~2s.
      - name: Check the release-asset verification gate refuses what it must
        run: bash scripts/ci/test-verify-release-assets.sh

      # The other half of #3558: the release binaries now embed their own
      # dependency graph (`cargo auditable`) and ship a CycloneDX SBOM. The
      # tool that reads the embedding back out FAILS OPEN -- measured, cargo-audit
      # 0.22.2 prints "was not built with 'cargo auditable', the report will be
      # incomplete" and exits 0 -- so "we run cargo audit bin in CI" cannot fail
      # for the reason it was added. This exercises the assertion that can.
      - name: Check the embedded-SBOM gate refuses what it must
        run: bash scripts/ci/test-assert-binary-sbom.sh

      # The duplication gate measures whatever jscpd-prepare-sources.py hands
      # it, so a bug there silently changes the gate's verdict (#3495). The
      # dangerous direction is over-removal: an INDENTED `#[cfg(test)]` sits
      # inside another item, and treating it as a top-level boundary would
      # delete every production line up to the enclosing item's closing brace
      # — which the gate would then report as a clean measurement. Pure python
      # on throwaway files, ~1s.
      - name: Check the duplication gate's source preparation
        run: bash scripts/ci/test-jscpd-prepare-sources.sh

      # The unit-test matrix runs one shard of the inline tests per leg and
      # the coverage gates read the legs' merged lcov. Both scripts fail
      # silently if wrong: an ungated test module runs in every leg, a
      # merge that drops or max()es lines still yields a plausible
      # percentage. Throwaway trees, no cargo, ~1s.
      - name: Check the test-shard gates and the coverage merge
        run: bash scripts/ci/test-test-shards.sh

      # The coverage merge gate (coverage-gates -> CI Complete). Three ways it
      # can silently stop measuring what it claims: counting inline
      # `#[cfg(test)]` code as covered production code (it is ~65% of the
      # instrumented lines at ~98% hit, which is how the old floor read 90%
      # against a real 77%); diffing against the wrong commit, so other PRs'
      # lines count as this PR's (#1646); and a decision matrix that blocks
      # an exempt PR or lets an unauthorised override through. Fixture lcov +
      # linemap, a local git origin 250 commits ahead with a stubbed compare
      # API, and the full mode x date x draft x label x override x job-result
      # matrix with a stubbed gh. Offline, ~3s together.
      - name: Check the coverage gate counts production lines only
        run: bash scripts/ci/test-coverage-gate.sh
      - name: Check the coverage gate diffs against the true merge base
        run: bash scripts/ci/test-coverage-merge-base.sh
      - name: Check the coverage gate's merge decision
        run: bash scripts/ci/test-coverage-gate-decision.sh

      # The version-pin gate (#3754) is silent on almost every PR -- nearly
      # nothing touches a version-pinned component -- so a regression in it
      # would be invisible until the next release cut it failed to prevent.
      # The dangerous direction is fail-open, and a gate that never fires
      # looks identical to a working one on every green PR. This exercises
      # the collision itself and the three ways an answer can be MISSING
      # (unreadable registry, missing probe, unreadable component table),
      # none of which may be reported as a pass. Stubs the registry probe;
      # offline, ~1s.
      - name: Check the version-pin bump gate catches what it must
        run: bash scripts/ci/test-check-version-pin-bump.sh
      # Same fail-open hazard for the base-image watch (#3755): it is a
      # scheduled job, so a script that silently stopped answering would go
      # unnoticed until a CVE in the pinned trivy digest blocked a release --
      # which is exactly how CVE-2026-84304 was found, by hand, at the cut.
      # Covers vulnerable, stale-but-clean, current, and the probe failures
      # that must surface as INFRA rather than a pass. Offline.
      - name: Check the pinned base-image watch catches what it must
        run: bash scripts/ci/test-check-pinned-base-images.sh

      # The `changes` gate above decides whether the four Rust jobs run at
      # all, and a wrong "no" is invisible: the required contexts report the
      # skip as success. This runs the gate's own script (extracted from this
      # file) against fixture file lists, fails if a Rust job executes a
      # script the gate would classify as CI-only, and runs CI Complete's
      # verdict step to prove a gate-skipped Rust job passes there only when
      # the gate said so. The second test covers the push-time tree check
      # (resolve-verified-tree.sh): every refusal and API failure must fail
      # open. Both stub `gh`; offline, ~2s.
      - name: Check the Rust-job skip gate skips only what it must
        run: bash scripts/ci/test-ci-change-classification.sh
      - name: Check the push-time tree check fails open
        run: bash scripts/ci/test-resolve-verified-tree.sh

  # The live half of the gate above. release-preflight.sh check 4 (#3339)
  # already asks whether a version-pinned component's tag is published from
  # different sources -- but it asks at release-cut time, which is the most
  # expensive place to learn it and the one place it cannot be amended. The
  # publish job cannot catch it earlier: it only evaluates the exact tag on a
  # clean `refs/tags/v*` ref, so the offending PR goes green on main and on an
  # -rc.N tag alike. #3579 left docker/scanner-adapter/VERSION at 1.2.8 after
  # changing docker/Dockerfile.scanner-adapter and was found at the cut
  # (#3752); #3753 had to bump again days later. Both were one-line fixes.
  #
  # Reported through ✅ CI Complete rather than as a new required context, so
  # no branch-protection change is needed for it to block.
  version-pin-bump:
    name: 🔖 Version Pin Bump
    runs-on: ubuntu-24.04
    # PR-only: the question is whether THIS BRANCH moved a component's sources
    # without bumping its VERSION, which needs a base ref to diff against.
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: read
    # Reads at most one registry manifest and only when a version-pinned
    # component actually changed; on every other PR it is a git diff.
    timeout-minutes: 5
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The gate diffs `<base>...HEAD`, i.e. against the MERGE BASE. A
          # depth-1 checkout has no merge base, and the script reports INFRA
          # rather than guessing -- which would leave the gate permanently
          # indeterminate, the shape it exists to remove.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch the base ref
        run: git fetch --no-tags origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"

      - name: Check version-pinned components carry a VERSION bump
        env:
          # Used only when a component's sources changed and its VERSION did
          # not: the registry probe answers whether that exact tag is already
          # published. `packages: read` above is what makes this readable.
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_PIN_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          rc=0
          bash scripts/ci/check-version-pin-bump.sh "origin/${GITHUB_BASE_REF}" || rc=$?
          # Exit 2 is "could not measure", not "you must bump a VERSION".
          # Both fail the job -- an answer we could not obtain is never a pass
          # -- but they must not read the same to whoever sees the red.
          if [ "$rc" -eq 2 ]; then
            echo "::error title=Version-pin gate could not be measured::The registry or the component table could not be read (exit 2). This is NOT a verdict about this PR and NOT a pass; re-run the job. See the INFRA line above."
          fi
          exit "$rc"

  # The coverage GATES, evaluated from the reports the unit-test legs
  # (`test-backend-unit-shard`) wrote, merged into one report here first.
  #
  # The old `coverage` job compiled and ran the whole unit suite a second
  # time, instrumented, on the self-hosted pool: 24 min per PR push, a
  # quarter of all pool minutes (2026-09-17..22). That run is now the unit
  # job's own run, and the three gates -- the production-code floor, the
  # new-code gate and the jscpd duplication gate -- need no Rust at all, so
  # they run here on a GitHub-hosted runner in about a minute, off the pool.
  #
  # Floor and new-code count PRODUCTION lines only (inline `#[cfg(test)]`
  # code excluded, scripts/ci/coverage-gate.py) and diff against the merge
  # base from the compare API (scripts/ci/coverage-merge-base.sh). They are
  # a merge gate through CI Complete, which decides per
  # .github/coverage-gate.json whether a failure blocks: shadow or enforce,
  # a creation-date grace for in-flight PRs, drafts, a grace label and an
  # audited maintainer override (scripts/ci/coverage-gate-decision.sh).
  # jscpd stays advisory. Pull requests only: the gates diff against the PR
  # base, and the floor is checked on every PR's merge commit before it can
  # land. On pushes the unit-test legs still upload their `lcov-shard-*`
  # reports, so a coverage number for `main` is one
  # `scripts/ci/merge-lcov.py` away in every push run's artifacts.
  #
  # Keeps the "📊 Code Coverage" check name the old job had. It is not a
  # required context; CI Complete is.
  coverage-gates:
    name: 📊 Code Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The unit-test legs only, not the `test-backend-unit` aggregate: the
    # integration suites contribute no coverage, and waiting for them would
    # only delay the verdict.
    needs: [test-backend-unit-shard]
    # Skipped wherever the unit-test legs were (docs-only and
    # version-bump-only PRs). Runs after a FAILED leg too: jscpd needs no
    # coverage data, and the floor/new-code steps then report "error" (no
    # report), which CI Complete turns into a named "not measured" failure.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.test-backend-unit-shard.result != 'skipped' }}
    permissions:
      contents: read
      actions: read   # `gh run download` fallback for the lcov artifacts
    # Verdicts for CI Complete, which decides whether a failure blocks
    # (scripts/ci/coverage-gate-decision.sh, .github/coverage-gate.json).
    # floor/newcode: pass | fail | na | error (empty: the step never ran).
    outputs:
      floor: ${{ steps.floor.outputs.verdict }}
      floor_pct: ${{ steps.floor.outputs.pct }}
      newcode: ${{ steps.newcode.outputs.verdict }}
      newcode_pct: ${{ steps.newcode.outputs.pct }}
      jscpd: ${{ steps.jscpd.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # What the gates diff against, resolved server-side (compare API) and
      # fetched at depth 1. The old step walked a 200-commit shallow window
      # and fell back to the base TIP when that failed, so a branch far
      # enough behind main measured other PRs' lines as its own (#1646).
      # `github.sha` is the merge commit that was built and measured; see
      # the script for why that, and not the PR head, is the right argument.
      #
      # Also skips the gates on PRs that touch no Rust source: dependency
      # bumps (Cargo.toml/Cargo.lock only), workflow edits and docs cannot
      # move coverage numbers.
      - name: Resolve the merge base
        id: mb
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          MEASURED_SHA: ${{ github.sha }}
        run: |
          mb=$(bash scripts/ci/coverage-merge-base.sh)
          echo "sha=$mb" >> "$GITHUB_OUTPUT"
          echo "Diffing against merge base $mb"
          if git diff --name-only "$mb" -- '*.rs' | grep -q .; then
            echo "rust_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust_changed=false" >> "$GITHUB_OUTPUT"
            echo "### Coverage: skipped (no Rust source changes in this PR)" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One `lcov-shard-<shard>` artifact per unit-test leg (lcov.info +
      # summary.txt). A leg whose tests failed or were cancelled uploads
      # nothing; the merge step below then writes no report at all, and the
      # gate steps turn that into their named "error" verdict. A transfer
      # failure is retried through the API before it is believed.
      - name: Download the unit-test legs' coverage reports
        id: download
        if: steps.mb.outputs.rust_changed == 'true'
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: lcov-shard-*
          path: coverage-shards

      - name: Retry the coverage report download
        if: steps.mb.outputs.rust_changed == 'true' && steps.download.outcome != 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            rm -rf coverage-shards
            if gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'lcov-shard-*' -D coverage-shards; then
              exit 0
            fi
            echo "attempt $attempt failed"
            sleep $((attempt * 10))
          done
          exit 1

      # Merge the legs into the one coverage/lcov.info the gates below read,
      # BEFORE them, so they measure exactly what they measured when one job
      # ran every test. Every leg instruments the whole production crate and
      # each inline test module is compiled in exactly one leg, so summing
      # hits per line (scripts/ci/merge-lcov.py) reproduces the unsharded
      # report: on one run of the same tree coverage-gate.py's production
      # floor read 77.00% unsharded and 77.01% merged (35 of 439,246 lines
      # differ, all timing-dependent). All legs or none: a merge of four out
      # of five would read as a coverage drop that is not there, so a missing
      # leg leaves coverage/ empty and the gates report "error".
      - name: Merge the unit-test legs' reports
        if: steps.mb.outputs.rust_changed == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          missing=""
          reports=()
          for shard in $(python3 scripts/ci/test-shards.py shards); do
            f="coverage-shards/lcov-shard-${shard}/lcov.info"
            if [ -s "$f" ]; then
              reports+=("$f")
            else
              missing="$missing $shard"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Coverage incomplete::No coverage report from unit-test leg(s):${missing}. A leg uploads one only after a fully green test run; the gates below report 'not measured'."
            exit 1
          fi
          mkdir -p coverage
          python3 scripts/ci/merge-lcov.py --output coverage/lcov.info \
            --summary coverage/summary.txt "${reports[@]}"

      - name: Upload the merged coverage report
        if: ${{ !cancelled() && hashFiles('coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lcov-coverage
          path: coverage/
          if-no-files-found: error

      # Production code only: lines inside inline `#[cfg(test)]` modules
      # (and files declared by a `#[cfg(test)] mod x;`) are excluded -- the
      # same rule jscpd-prepare-sources.py applies for the duplication gate.
      # They were 65% of the instrumented lines on main at ~98% hit, which
      # made the old 50% total floor read ~90% while production code sat at
      # ~77%. The floor lives in .github/coverage-gate.json (floor_percent).
      - name: Coverage floor (production code)
        id: floor
        if: steps.mb.outputs.rust_changed == 'true'
        continue-on-error: true
        run: |
          mkdir -p coverage-verdict
          if [ ! -f coverage/lcov.info ] || [ ! -f coverage/summary.txt ]; then
            echo "::error title=No coverage measured::At least one '🧪 Unit Tests (<shard>)' leg produced no coverage report (the merge step above names it). A leg writes one only after a fully green test run, so its build or tests failed or were cancelled on this commit; fix that leg first -- this gate has nothing complete to measure."
            echo "### Coverage: FAILED (a unit-test leg produced no report)" >> "$GITHUB_STEP_SUMMARY"
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          # Per-file line coverage of the merged report (test code included),
          # for reference.
          {
            echo "<details><summary>Merged line coverage per file (all instrumented lines, test code included)</summary>"
            echo
            echo '```'
            cat coverage/summary.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

          python3 scripts/ci/coverage-gate.py floor \
            --lcov coverage/lcov.info --root . \
            --min "$(jq -r '.floor_percent' .github/coverage-gate.json)" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" \
            --json coverage-verdict/floor.json

      # Coverage of the production lines this PR adds (same test-code
      # exclusion as the floor: a PR that adds 300 test lines and 50
      # untested production lines used to read ~86% and pass). Lists every
      # uncovered new line in the step summary. Thresholds in
      # .github/coverage-gate.json (newcode_percent, newcode_min_lines).
      - name: New code coverage gate (production lines)
        id: newcode
        if: steps.mb.outputs.rust_changed == 'true'
        continue-on-error: true
        env:
          MERGE_BASE: ${{ steps.mb.outputs.sha }}
        run: |
          mkdir -p coverage-verdict
          if [ ! -f coverage/lcov.info ]; then
            echo "verdict=error" >> "$GITHUB_OUTPUT"
            echo "### New code coverage: not measured (a unit-test leg produced no report)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python3 scripts/ci/coverage-gate.py newcode \
            --lcov coverage/lcov.info --root . --merge-base "$MERGE_BASE" \
            --min "$(jq -r '.newcode_percent' .github/coverage-gate.json)" \
            --min-lines "$(jq -r '.newcode_min_lines' .github/coverage-gate.json)" \
            --summary "$GITHUB_STEP_SUMMARY" --github-output "$GITHUB_OUTPUT" \
            --json coverage-verdict/newcode.json

      # Advisory (never blocks, see CI Complete): it measures whole changed
      # FILES, so a PR touching a file with pre-existing clones fails on code
      # it did not write (#1619). Promote only once it is line-scoped.
      - name: Setup Node.js for jscpd
        if: ${{ !cancelled() && steps.mb.outcome == 'success' }}
        continue-on-error: true
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Code duplication gate
        id: jscpd
        if: ${{ !cancelled() && steps.mb.outcome == 'success' }}
        continue-on-error: true
        env:
          MERGE_BASE: ${{ steps.mb.outputs.sha }}
        run: |
          # verdict for CI Complete: na on the N/A exits below, fail on any
          # non-zero exit, pass otherwise.
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then v=fail; else v="${JSCPD_VERDICT:-pass}"; fi; echo "verdict=$v" >> "$GITHUB_OUTPUT"' EXIT
          # Install jscpd (copy-paste detector, same approach as SonarCloud's CPD engine)
          npm install -g jscpd@4 --silent

          # Changed .rs files since the merge base resolved above (compare
          # API; see "Resolve the merge base"). Diffing against the base TIP
          # instead counts files changed by OTHER PRs that merged after this
          # branch was cut as a phantom delta, so a stale branch inherited e.g.
          # formats/helm.rs (and its pre-existing clones) from main and failed
          # on code it never touched (#1824/#1825/#1827/#1796, #1646).
          echo "Diffing changed files against merge-base: $MERGE_BASE"
          # --diff-filter=d: a DELETED file has no source to measure; without
          # the filter it flows into jscpd-prepare-sources.py, which open()s
          # every listed path and crashes the whole gate on the first PR that
          # removes a .rs file (#3499's removal PR was the trigger case).
          CHANGED_RS=$(git diff --name-only --diff-filter=d "$MERGE_BASE" -- '*.rs' 2>/dev/null | grep -v '_test\|tests/' || true)

          # Exclude the per-ecosystem package-format handlers
          # (backend/src/api/handlers/<format>.rs). These are inherent structural
          # near-duplicates of one another (~18% cross-file duplication on main,
          # dominant clones are whole-file matches like sbt.rs <-> vscode.rs incl.
          # the shared import block). Without this exclusion ANY PR that legitimately
          # edits the download/upload path across several formats trips the 3% gate
          # regardless of code quality (#1704). The exclusion list is the single
          # source of truth in .jscpd.json; we filter the changed-file list here
          # rather than relying on jscpd's own ignore globs so the behavior is
          # deterministic regardless of jscpd version. The gate stays STRICT on all
          # other code (services, storage, middleware, non-format handlers, ...)
          # where duplication is a real smell.
          IGNORE_RE=$(python3 -c "
          import json, re
          cfg = json.load(open('.jscpd.json'))
          pats = [p for p in cfg.get('ignore', []) if p.startswith('backend/src/api/handlers/')]
          print('|'.join(re.escape(p) for p in pats))
          ")
          if [ -n "$IGNORE_RE" ]; then
            CHANGED_RS=$(printf '%s\n' "$CHANGED_RS" | grep -Ev "^(${IGNORE_RE})$" || true)
          fi

          if [ -z "$CHANGED_RS" ]; then
            echo "No measurable .rs source files changed (none, or only ignored format handlers), skipping duplication check"
            echo "### Code Duplication: N/A (no measurable Rust changes)" >> $GITHUB_STEP_SUMMARY
            JSCPD_VERDICT=na
            exit 0
          fi

          # Write changed files to a list for jscpd
          echo "$CHANGED_RS" > /tmp/changed-files.txt

          # Copy the changed sources with their inline `#[cfg(test)]` modules
          # removed, and keep a map of the removed line ranges so failures can
          # still report real line numbers (#3495).
          #
          # WHY: `backend/src` is 474k lines of which 265k -- 56% -- are inline
          # test modules; `repositories.rs` alone is 26,328 lines, 22,164 of
          # them test code. .jscpd.json already ignores `**/*_test.rs` and
          # `**/tests/**`, and the CHANGED_RS filter above already drops
          # `_test`/`tests/` paths, so test code is out of scope BY POLICY.
          # Inline test modules were out of scope only BY ACCIDENT, because the
          # files holding them were too big for jscpd to open (see the limits
          # below). Measured with the limits raised and nothing else changed,
          # the non-ignored tree scores 3.38% and 23 of the last 44
          # code-touching commits on main would have failed this gate, with 58
          # of 61 clones sitting entirely inside `#[cfg(test)]`. Stripping them
          # applies the existing policy: 2.27% tree-wide, 2 of those 44
          # commits over threshold, both on genuine production-code clones.
          rm -rf /tmp/jscpd-src /tmp/jscpd-linemap.json
          echo "Preparing sources (inline test modules are out of scope):"
          python3 scripts/ci/jscpd-prepare-sources.py \
            /tmp/jscpd-src /tmp/jscpd-linemap.json \
            $(echo "$CHANGED_RS" | tr '\n' ' ')

          # A source with fewer than --min-lines lines is legitimately not
          # analysed, and jscpd emits NO REPORT AT ALL for a set containing
          # only such files. Distinguish that from "the whole file set was
          # skipped", which must fail below.
          MEASURABLE=$(python3 -c "
          import os
          n = 0
          for path in open('/tmp/changed-files.txt').read().split():
              prepared = os.path.join('/tmp/jscpd-src', path)
              if not os.path.exists(prepared):
                  continue
              if len(open(prepared, encoding='utf-8', errors='replace').read().split('\n')) >= 10:
                  n += 1
          print(n)
          ")
          if [ "$MEASURABLE" -eq 0 ]; then
            echo "No changed file has 10+ production lines after inline test modules are excluded; nothing for jscpd to detect."
            echo "### Code Duplication: N/A (no changed file has 10+ production lines)" >> $GITHUB_STEP_SUMMARY
            JSCPD_VERDICT=na
            exit 0
          fi

          # jscpd's own defaults are maxLines 1000 / maxSize 100kb, and a file
          # over EITHER is skipped SILENTLY -- no error, no report entry (#3495).
          # That skipped 152 of 336 files under backend/src, 125 of them not on
          # the ignore list, so any PR whose Rust changes landed only in one of
          # them got a duplication verdict computed from an empty file set.
          # .jscpd.json is the single source of truth for the limits, the same
          # way it is for `ignore`; they are passed explicitly so the behaviour
          # does not depend on jscpd's config discovery or version.
          read -r MAX_LINES MAX_SIZE <<<"$(python3 -c "
          import json
          cfg = json.load(open('.jscpd.json'))
          print(cfg['maxLines'], cfg['maxSize'])
          ")"
          echo "jscpd limits from .jscpd.json: max-lines=${MAX_LINES} max-size=${MAX_SIZE}"

          # Run jscpd on the prepared copies (min 10 lines, threshold 3%).
          # `cd` so the report names the real repo-relative paths.
          RESULT=$(cd /tmp/jscpd-src && jscpd --min-lines 10 --threshold 3 \
            --max-lines "$MAX_LINES" --max-size "$MAX_SIZE" --reporters json \
            --format rust --output /tmp/jscpd-report \
            $(echo "$CHANGED_RS" | tr '\n' ' ') 2>&1) || true

          # A missing report used to be reported as "0% (no duplicates found)"
          # and passed. That is exactly what a whole-file-set skip looks like,
          # so it must be a failure, not a clean bill of health.
          if [ ! -f /tmp/jscpd-report/jscpd-report.json ]; then
            echo "::error::jscpd produced no report for $(echo "$CHANGED_RS" | wc -l) changed file(s). It analysed nothing, so this gate measured nothing (#3495)."
            echo "$RESULT"
            echo "### Code Duplication: FAILED (jscpd produced no report)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # Every changed file must actually appear in the report. jscpd skips
          # silently for several reasons (over max-lines, over max-size,
          # unreadable, unknown format) and reports whatever the remainder
          # measured; a file below --min-lines is the one legitimate omission.
          SKIP_FAIL=0
          python3 - <<'PYSKIP' || SKIP_FAIL=1
          import json, os, sys

          report = json.load(open('/tmp/jscpd-report/jscpd-report.json'))
          analysed = set(
              report.get('statistics', {})
              .get('formats', {})
              .get('rust', {})
              .get('sources', {})
              .keys()
          )
          cfg = json.load(open('.jscpd.json'))
          max_lines = int(cfg['maxLines'])
          max_size = cfg['maxSize']
          units = {'b': 1, 'kb': 1024, 'mb': 1024 ** 2, 'gb': 1024 ** 3}
          number = max_size.rstrip('abgkm')
          suffix = max_size[len(number):].lower() or 'b'
          max_bytes = float(number) * units[suffix]

          missing = []
          for path in open('/tmp/changed-files.txt').read().split():
              if path in analysed:
                  continue
              prepared = os.path.join('/tmp/jscpd-src', path)
              if not os.path.exists(prepared):
                  missing.append((path, 'was not prepared'))
                  continue
              lines = len(open(prepared, encoding='utf-8', errors='replace').read().split('\n'))
              size = os.path.getsize(prepared)
              if lines < 10:
                  continue  # below --min-lines; nothing to detect
              if lines > max_lines:
                  missing.append((path, f'{lines} lines exceeds maxLines {max_lines}'))
              elif size > max_bytes:
                  missing.append((path, f'{size} bytes exceeds maxSize {max_size}'))
              else:
                  missing.append((path, f'skipped by jscpd for an unknown reason ({lines} lines, {size} bytes)'))

          if missing:
              print('::error::The duplication gate did not analyse every changed file, so its verdict is not a measurement of this change (#3495).')
              for path, why in missing:
                  print(f'  {path}: {why}')
              print('Raise maxLines/maxSize in .jscpd.json, or exempt the file there deliberately.')
              sys.exit(1)
          PYSKIP
          if [ "$SKIP_FAIL" -ne 0 ]; then
            echo "### Code Duplication: FAILED (a changed file was not analysed)" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          DUP_PCT=$(python3 -c "
          import json
          data = json.load(open('/tmp/jscpd-report/jscpd-report.json'))
          stats = data.get('statistics', {})
          total = stats.get('total', {})
          pct = total.get('percentage', 0)
          dups = total.get('duplicatedLines', 0)
          lines = total.get('lines', 0)
          clones = len(data.get('duplicates', []))
          sources = len(stats.get('formats', {}).get('rust', {}).get('sources', {}))
          print(f'{pct:.1f} {dups} {lines} {clones} {sources}')
          " 2>/dev/null) || DUP_PCT="0.0 0 0 0 0"

          PCT=$(echo "$DUP_PCT" | awk '{print $1}')
          DUP_LINES=$(echo "$DUP_PCT" | awk '{print $2}')
          TOTAL_LINES=$(echo "$DUP_PCT" | awk '{print $3}')
          CLONES=$(echo "$DUP_PCT" | awk '{print $4}')
          SOURCES=$(echo "$DUP_PCT" | awk '{print $5}')

          echo "### Code Duplication: ${PCT}% (${DUP_LINES}/${TOTAL_LINES} lines, ${CLONES} clones, ${SOURCES} files analysed)" >> $GITHUB_STEP_SUMMARY
          echo "Duplication: ${PCT}% (${DUP_LINES}/${TOTAL_LINES} lines, ${CLONES} clones, ${SOURCES} files analysed)"

          # Fail if duplication exceeds 3%
          OVER=$(python3 -c "print('yes' if float('${PCT}') > 3.0 else 'no')")
          if [ "$OVER" = "yes" ]; then
            echo "::error::Code duplication is ${PCT}%, exceeding 3% threshold"

            # Show the duplicate blocks, with line numbers translated back
            # through the stripped test modules to the real file.
            python3 - <<'PYCLONES'
          import json

          data = json.load(open('/tmp/jscpd-report/jscpd-report.json'))
          line_map = json.load(open('/tmp/jscpd-linemap.json'))

          def original(name, line):
              shift = 0
              for start, end in line_map.get(name, []):
                  if start <= line + shift:
                      shift += end - start + 1
              return line + shift

          for d in data.get('duplicates', []):
              fa, sa = d['firstFile'], d['secondFile']
              a1, a2 = original(fa['name'], fa['startLoc']['line']), original(fa['name'], fa['endLoc']['line'])
              b1, b2 = original(sa['name'], sa['startLoc']['line']), original(sa['name'], sa['endLoc']['line'])
              print(f"  {fa['name']}:{a1}-{a2} <-> {sa['name']}:{b1}-{b2}")
          print("Clones may pre-date this change: the gate measures whole changed FILES, not changed lines (#1619).")
          PYCLONES

            exit 1
          fi

      - name: Upload coverage verdicts
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-verdict
          path: coverage-verdict/
          if-no-files-found: ignore
          retention-days: 30

      # The job's own colour: red when the floor or new-code gate failed or
      # could not measure, so the "📊 Code Coverage" check says so on the PR.
      # Whether that red BLOCKS merge is decided in CI Complete, by
      # scripts/ci/coverage-gate-decision.sh under .github/coverage-gate.json
      # (shadow / enforce, grace date, draft, grace label, audited override).
      # jscpd is advisory and does not turn this job red.
      - name: Coverage verdict
        if: ${{ !cancelled() }}
        env:
          MB_OUTCOME: ${{ steps.mb.outcome }}
          FLOOR: ${{ steps.floor.outputs.verdict }}
          FLOOR_OUTCOME: ${{ steps.floor.outcome }}
          NEWCODE: ${{ steps.newcode.outputs.verdict }}
          NEWCODE_OUTCOME: ${{ steps.newcode.outcome }}
          JSCPD: ${{ steps.jscpd.outputs.verdict }}
        run: |
          echo "merge base: ${MB_OUTCOME}; floor: ${FLOOR:-n/a} (${FLOOR_OUTCOME}); new code: ${NEWCODE:-n/a} (${NEWCODE_OUTCOME}); duplication: ${JSCPD:-n/a} (advisory)"
          if [ "$MB_OUTCOME" != success ] || [ "$FLOOR_OUTCOME" = failure ] || [ "$NEWCODE_OUTCOME" = failure ]; then
            echo "::error title=Coverage gate::coverage did not pass (see the summary above). Whether this blocks merging is decided in CI Complete per .github/coverage-gate.json."
            exit 1
          fi

  # ════════════════════════════════════════════════════════════════════════════
  # SMOKE E2E — ADVISORY, outside CI Complete (see the container-chain note
  # there). Runs wherever the backend image is built: pushes, and PRs that
  # change docker/ or carry `ci:image`. Never in a merge group.
  # Spins up fresh backend + postgres, runs native client tests, tears down
  # ════════════════════════════════════════════════════════════════════════════

  smoke-e2e:
    name: 🔥 Smoke E2E Tests
    # GitHub-hosted, like build-backend-image (see there). The stack is small
    # (Postgres, the backend, three client containers and a proxy check),
    # and the image arrives as the backend-image artifact, so nothing here
    # needs a pool-local daemon. Measured 2m25s on ubuntu-24.04 (release/1.10.x
    # run 35878583014) against 3.5-6.5 min on ak-e2e-runners the same day.
    # The docker daemon and the compose plugin ship with the hosted image;
    # the two steps below that wait for / install them are no-ops there.
    # The in-cluster suites (e2e.yml, scheduled-tests.yml, mesh, cache-
    # correctness, concurrency, the scheduled trivy scan) stay on
    # ak-e2e-runners.
    runs-on: ubuntu-24.04
    # Depend on the required fast-CI gates as well as the image build so a
    # known-red Check Rust or unit-test run never launches smoke. Smoke only
    # runs when all three succeeded; if the backend image was skipped (no
    # backend changes) or an upstream gate failed, smoke is skipped.
    needs: [check-rust, test-backend-unit, build-backend-image]
    if: needs.check-rust.result == 'success' && needs.test-backend-unit.result == 'success' && needs.build-backend-image.result == 'success'
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for Docker daemon
        run: |
          echo "Waiting for DinD daemon..."
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready"
              docker version
              break
            fi
            echo "  Attempt $i/30..."
            sleep 2
          done
          docker info >/dev/null 2>&1 || { echo "ERROR: Docker daemon not available"; exit 1; }

      - name: Install Docker Compose
        run: |
          # Skip install if docker compose is already available
          if docker compose version >/dev/null 2>&1; then
            echo "Docker Compose already available:"
            docker compose version
            exit 0
          fi

          DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
          COMPOSE_VERSION="v2.32.4"
          COMPOSE_BINARY="$DOCKER_CONFIG/cli-plugins/docker-compose"
          mkdir -p "$DOCKER_CONFIG/cli-plugins"

          echo "Downloading Docker Compose ${COMPOSE_VERSION}..."
          curl -fSL "https://github.com/docker/compose/releases/download/${COMPOSE_VERSION}/docker-compose-linux-x86_64" \
            -o "$COMPOSE_BINARY"

          # Verify download succeeded (curl -f returns non-zero on HTTP errors,
          # but also check file size as a safeguard)
          FILESIZE=$(stat -c%s "$COMPOSE_BINARY" 2>/dev/null || stat -f%z "$COMPOSE_BINARY" 2>/dev/null || echo "0")
          if [ "$FILESIZE" -lt 1000000 ]; then
            echo "ERROR: Downloaded file is ${FILESIZE} bytes (expected >60MB). Download likely failed."
            rm -f "$COMPOSE_BINARY"
            exit 1
          fi

          chmod +x "$COMPOSE_BINARY"
          docker compose version

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Download backend image from build job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-image
          path: /tmp

      - name: Load backend image
        run: |
          gunzip -c /tmp/backend-image.tar.gz | docker load
          docker tag artifact-keeper-backend:pr-test artifact-keeper-backend:test

      - name: Start smoke E2E stack
        run: docker compose -f docker-compose.test.yml --profile smoke up -d

      - name: Wait for tests to complete
        run: |
          echo "Waiting for test containers to finish..."
          timeout 480 docker wait e2e-test-pypi e2e-test-npm e2e-test-cargo e2e-test-proxy-virtual || {
            echo "ERROR: Tests timed out. Container statuses:"
            docker ps -a --filter "name=e2e-test" --format "table {{.Names}}\t{{.Status}}"
            echo ""
            echo "Backend logs (last 50 lines):"
            docker logs e2e-test-backend --tail 50 2>&1 || true
            exit 1
          }

      - name: Show test results
        if: always()
        run: |
          failed=false
          for test in pypi npm cargo proxy-virtual; do
            container="e2e-test-${test}"
            exit_code=$(docker inspect --format='{{.State.ExitCode}}' "$container" 2>/dev/null || echo "N/A")
            echo ""
            echo "═══════════════════════════════════════════"
            echo "  ${test} — Exit Code: $exit_code"
            echo "═══════════════════════════════════════════"
            docker logs "$container" 2>&1 || true
            if [ "$exit_code" != "0" ]; then failed=true; fi
          done
          if [ "$failed" = "true" ]; then exit 1; fi

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml --profile smoke down -v --remove-orphans

  # ════════════════════════════════════════════════════════════════════════════
  # CONTAINER BUILDS (push + PR, path-filtered, parallel)
  # ════════════════════════════════════════════════════════════════════════════

  # Until #3166 this job carried `if: github.event_name == 'push'`, while the
  # section header above claimed "PR only". The header was the aspiration and
  # the `if` was the behaviour, so the whole chain hanging off this job --
  # `build-backend-image`, `build-openscap-image`, and `smoke-e2e` via the
  # image -- never ran on a pull request. All three reported `skipped`, and
  # `ci-complete`'s `allow_skip` passes a skip, so a PR could break the
  # container build or the smoke suite and still show green; the breakage
  # surfaced only after merge, on a `main` push that blocks nothing. Same
  # failure mode as #3124/#3165, different jobs.
  #
  # `dorny/paths-filter` supports `pull_request` natively -- it reads the
  # changed-file list from the API (hence `pull-requests: read`) rather than
  # from git history -- so dropping the `if` is the whole fix. Push behaviour
  # is unchanged: the same filters, evaluated the same way.
  #
  # The whole chain is ADVISORY: `ci-complete` does not need it (see the
  # container-chain note there). It still runs on every push whose paths
  # match, and a failure there still turns that push run red.
  #
  # Pull requests: only when the PR changes something under docker/ (the
  # `docker` filter) or carries the label `ci:image` (read by the `changes`
  # job). A backend-only PR no longer pays the ~25 min image build and its
  # hosted slot; `main` builds and smoke-tests every merged commit instead.
  #
  # Merge groups: never. Nothing in the chain is a required context, and the
  # queue should spend its slots on the checks it waits for.
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    if: ${{ github.event_name != 'merge_group' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      openscap: ${{ steps.filter.outputs.openscap }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            backend:
              - 'docker/Dockerfile.backend'
              # Covers backend/src/**, backend/migrations/** and
              # backend/.sqlx/** (the crate-local query cache; the root
              # '.sqlx/**' below is the workspace one).
              - 'backend/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.sqlx/**'
              # So a change to this gate exercises the gate -- the same
              # reasoning the `changes` job states for its own backend arm.
              # Without this, a ci.yml-only PR (this one included) leaves the
              # entire container chain skipped, which is precisely how #3166
              # went unnoticed: the jobs were never observed NOT running.
              - '.github/workflows/ci.yml'
            openscap:
              - 'docker/Dockerfile.openscap'
              - 'scripts/openscap-wrapper.py'
            # What makes the backend image build run on a pull request.
            docker:
              - 'docker/**'

  build-backend-image:
    name: 🐳 Build Backend Image
    # GitHub-hosted (ubuntu-24.04, 4 vCPU / 16 GB, free for this public
    # repository), not a self-hosted pool. History: ak-ci-runners until
    # 2026-09-17 (median 39.4 min run plus a median 61 min queue, the Rust
    # pool's largest consumer), ubuntu-24.04 until #4206, then
    # ak-docker-runners. On that pool the build shares the rocky hosts'
    # CPUs with the Rust jobs: on 2026-09-23, with the lighter `ci` profile
    # (#4223), it ran 25-44 min (median ~32) after queueing from 28 min to
    # 4.8 h behind the pool's maxRunners. The same Dockerfile with the
    # heavier `release` profile took 25.5-26.7 min for this whole job on
    # ubuntu-24.04 the same day (release/1.10.x runs 35878583014 and
    # 35893576501, build step 22-24 min: cook 394 s, `cargo build` 949 s),
    # with no queue. Off every pool, the build still competes with nothing
    # on ak-ci-runners, which is criterion 2 of the "promote to blocking"
    # note in ci-complete.
    #
    # No "free disk space" step. The one this job carried until #4206 was
    # written for a ~14 GB hosted root disk; the current ubuntu-24.04 image
    # (20260907) reports 145 GB with 86 GB free before any cleanup (same
    # release/1.10.x job), against a build that holds the cooked target
    # dir, the loaded image and a ~505 MB gzipped tarball.
    runs-on: ubuntu-24.04
    # The release profile's cold-cook worst case (60-90 min on a hosted
    # runner, per the schedule note in docker-publish.yml) set this ceiling.
    # With the `ci` profile the cook is always cold here (see the build
    # step), so every run is the ~20-25 min case; 90 stays as headroom
    # until hosted runs confirm the figure, since a cancellation at the
    # ceiling wastes the whole build.
    timeout-minutes: 90
    needs: [changes, detect-changes]
    # Pushes: the backend filter, as always. Pull requests: a docker/ change
    # or the `ci:image` label (see detect-changes). `!cancelled()` plus an
    # explicit detect-changes result so a failed `changes` job (it only
    # supplies the label) cannot skip the push build.
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && ((github.event_name != 'pull_request' && needs.detect-changes.outputs.backend == 'true') || (github.event_name == 'pull_request' && (needs.detect-changes.outputs.docker == 'true' || needs.changes.outputs.ci_image == 'true'))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.backend
          platforms: linux/amd64
          push: false
          load: true
          tags: artifact-keeper-backend:pr-test
          # Read-only registry cache, warmed by docker-publish.yml on main.
          # No cache-to of any kind:
          #   - registry: PR-triggered jobs must not get packages:write (fork
          #     PRs would inherit it — pwn-request risk), and anonymous GHCR
          #     reads work because the packages are public, so fork PRs need
          #     no secret here.
          #   - type=gha: the layer worth caching is the `ci` cook in the
          #     intermediate `deps` stage, which only mode=max exports (mode=min
          #     keeps just the final runtime stage's layers, which the registry
          #     cache already serves). A mode=max export of the cooked target
          #     dir is the several-GB blob docker-publish.yml moved off
          #     type=gha for (~7.7 GB of the 10 GB Actions quota, evicting the
          #     Rust caches daily), and that quota is already full.
          # The registry cache still covers the non-Rust stages (base images,
          # rootfs-builder, the grype build, grype-db-seed); the Rust cook
          # misses it because it is warmed with `release` (see below).
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-backend:buildcache-amd64
          # CARGO_BUILD_JOBS=4: the hosted runner's core count, which is what
          # cargo would use anyway; passed explicitly because the Dockerfile
          # defaults to 8 for the self-hosted pools (see
          # docker/Dockerfile.backend).
          #
          # CARGO_PROFILE=ci: release without LTO, 16 codegen units,
          # opt-level 2 (root Cargo.toml). This image only feeds the smoke
          # job (via the backend-image artifact) and is never pushed, so it
          # does not need the shipped binary's size optimisation; measured at
          # -j8 the compile is 317 s vs 601 s, at the same peak memory. This
          # is the ONLY build of the Dockerfile that passes it:
          # docker-publish.yml (whose output release.yml certifies) and
          # e2e.yml keep the default `release`. The registry cache above is
          # warmed with `release`, so the cook layer never hits it for this
          # profile and is always cold here; a whole `ci` build is still
          # shorter than the `release` builder stage alone on a warm cook
          # (317 s vs 318 s + 191 s for the release lib and LTO'd bin).
          build-args: |
            CARGO_BUILD_JOBS=4
            CARGO_PROFILE=ci

      - name: Verify image starts
        run: |
          docker run --rm -d --name ak-test -p 8080:8080 \
            -e DATABASE_URL=postgresql://test:test@localhost/test \
            artifact-keeper-backend:pr-test || true
          sleep 2
          docker logs ak-test 2>&1 | head -20 || true
          docker rm -f ak-test 2>/dev/null || true

      - name: Image size
        run: |
          echo "## Backend Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images artifact-keeper-backend:pr-test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Disk headroom after the build, for the no-cleanup decision above.
          df -h /

      - name: Save image for smoke tests
        run: |
          docker save artifact-keeper-backend:pr-test | gzip > /tmp/backend-image.tar.gz
          ls -lh /tmp/backend-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image
          path: /tmp/backend-image.tar.gz
          retention-days: 1

  build-openscap-image:
    name: 🐳 Build OpenSCAP Image
    # GitHub-hosted for the same reason as build-backend-image above; a
    # small UBI image (docker-publish.yml built it in ~1 min on ubuntu-24.04
    # before #4206) that needs no pool.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [changes, detect-changes]
    # Its own filter on every event (its Dockerfile and the one script the
    # image copies, all image-shaped), or the `ci:image` label on a PR.
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && (needs.detect-changes.outputs.openscap == 'true' || (github.event_name == 'pull_request' && needs.changes.outputs.ci_image == 'true')) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build openscap image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.openscap
          platforms: linux/amd64
          push: false
          load: true
          tags: artifact-keeper-openscap:pr-test
          # Read-only registry cache — see backend image build for rationale.
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}-openscap:buildcache-amd64

      - name: Verify image starts
        run: |
          docker run --rm -d --name oscap-test -p 8091:8091 \
            artifact-keeper-openscap:pr-test || true
          sleep 3
          docker logs oscap-test 2>&1 | head -20 || true
          docker rm -f oscap-test 2>/dev/null || true

      - name: Image size
        run: |
          echo "## OpenSCAP Image" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          docker images artifact-keeper-openscap:pr-test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ════════════════════════════════════════════════════════════════════════════
  # SECURITY (Runs on all events, non-blocking)
  # ════════════════════════════════════════════════════════════════════════════

  security-audit:
    name: 🔒 Security Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    # Skip on docs-only PRs — see check-rust. (Docs-only PRs never change
    # Cargo.lock, and previously did not run this job either: ci.yml did not
    # trigger at all.)
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@1.98.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

  # ════════════════════════════════════════════════════════════════════════════
  # FINAL STATUS
  # ════════════════════════════════════════════════════════════════════════════

  ci-complete:
    name: ✅ CI Complete
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Not smoke-e2e, build-backend-image or build-openscap-image: they are
    # advisory (see the container-chain note in the step below), and a
    # `needs` edge would make this required context wait ~25 min for them.
    needs: [changes, release-bump, check-rust, test-backend-unit-shard, test-backend-unit, shell-tests, version-pin-bump, coverage-gates, security-audit]
    if: always()
    # The coverage decision reads the PR's live labels/draft state, the
    # override label's `labeled` events and `/coverage-override` comments,
    # and the collaborator permission of whoever applied/wrote them.
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      # The coverage policy and the script that applies it; nothing else.
      - name: Check out the coverage gate policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/coverage-gate.json
            scripts/ci/coverage-gate-decision.sh
          sparse-checkout-cone-mode: false

      - name: Check CI status
        # Results are passed through the environment rather than interpolated
        # directly into the script body so a job result string can never alter
        # the shell control flow.
        env:
          RESULT_CHECK_RUST: ${{ needs.check-rust.result }}
          RESULT_UNIT: ${{ needs.test-backend-unit.result }}
          RESULT_UNIT_SHARDS: ${{ needs.test-backend-unit-shard.result }}
          RESULT_SHELL: ${{ needs.shell-tests.result }}
          RESULT_VERSION_PIN: ${{ needs.version-pin-bump.result }}
          RESULT_COVERAGE: ${{ needs.coverage-gates.result }}
          RESULT_SECURITY: ${{ needs.security-audit.result }}
          CODE_CHANGED: ${{ needs.changes.outputs.code }}
          BACKEND_CHANGED: ${{ needs.changes.outputs.backend }}
          RUST_CHANGED: ${{ needs.changes.outputs.rust }}
          RUST_SKIP_REASON: ${{ needs.changes.outputs.rust_skip_reason }}
          MANIFEST_CHANGED: ${{ needs.changes.outputs.manifest }}
          BUMP_ONLY: ${{ needs.release-bump.outputs.bump_only }}
          COVERAGE_FLOOR: ${{ needs.coverage-gates.outputs.floor }}
          COVERAGE_FLOOR_PCT: ${{ needs.coverage-gates.outputs.floor_pct }}
          COVERAGE_NEWCODE: ${{ needs.coverage-gates.outputs.newcode }}
          COVERAGE_NEWCODE_PCT: ${{ needs.coverage-gates.outputs.newcode_pct }}
          COVERAGE_JSCPD: ${{ needs.coverage-gates.outputs.jscpd }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "## CI Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          failed=false

          # Docs-only PRs legitimately skip the Tier 1 jobs (see the
          # `changes` job). Version-bump-only release PRs legitimately skip
          # the heavy Rust jobs — check-rust and test-backend-unit, but NOT
          # shell-tests, which still runs on that path (see the
          # `release-bump` job). Any other skip/failure of a Tier 1 job is
          # fatal.
          docs_only=false
          if [[ "$CODE_CHANGED" == "false" ]]; then
            docs_only=true
            echo "📝 docs-only change — Tier 1 jobs skipped by design" >> "$GITHUB_STEP_SUMMARY"
          fi
          bump_only=false
          if [[ "$BUMP_ONLY" == "true" ]]; then
            bump_only=true
            echo "🔖 version-bump-only release PR — heavy Rust jobs skipped by design" >> "$GITHUB_STEP_SUMMARY"
          fi
          # The `changes` job found nothing a Rust job reads (a CI-only PR),
          # or, on a push, a merged PR already proved this exact tree green.
          # Same allowance as the bump path: check-rust and test-backend-unit
          # may skip; shell-tests and security-audit still run and must
          # succeed. Only an explicit "false" counts -- an empty output (the
          # gate died) makes a skip fatal, matching the jobs' own fail-open
          # `!= 'false'` condition.
          rust_skipped=false
          if [[ "$docs_only" != "true" && "$RUST_CHANGED" == "false" ]]; then
            rust_skipped=true
            echo "🦀 no Rust-job inputs to re-verify${RUST_SKIP_REASON:+ ($RUST_SKIP_REASON)} — Rust jobs skipped by design" >> "$GITHUB_STEP_SUMMARY"
          fi

          # Required jobs run on every event. Anything other than success,
          # including a skip or a cancellation, is a hard failure so an
          # unexpected non-run can never be reported as green — except on a
          # docs-only change, where these jobs are skipped by design.
          require_success() {
            local name="$1" result="$2"
            if [[ "$result" == "success" ]]; then
              echo "✅ $name" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" && "$docs_only" == "true" ]]; then
              echo "⏭️ $name (docs-only)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" && "$bump_only" == "true" \
                    && ( "$name" == "check-rust" || "$name" == "test-backend-unit" ) ]]; then
              # Only the two heavy Rust jobs are skippable on the bump path.
              # shell-tests and security-audit still run and must succeed.
              echo "⏭️ $name (version-bump-only release PR)" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" && "$rust_skipped" == "true" \
                    && ( "$name" == "check-rust" || "$name" == "test-backend-unit" ) ]]; then
              echo "⏭️ $name (no Rust-job inputs to re-verify)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $name: ${result:-missing}" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          }

          # Conditionally-required jobs are legitimately skipped in some events
          # (no backend changes, PR-only skips). A skip passes, but a failure or
          # cancellation fails so an aborted upstream job is never masked.
          #
          # #3166 asked, for every allow_skip call site: can this job be skipped
          # for a reason that should NOT pass? Current answers:
          #   - integration tests: not checked here. test-backend-unit
          #     (required above) needs the integration job and accepts its
          #     skip only when that job's own condition was false.
          #   - version-pin-bump off pull requests: it needs a base ref.
          allow_skip() {
            local name="$1" result="$2"
            if [[ "$result" == "success" ]]; then
              echo "✅ $name" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" ]]; then
              echo "⏭️ $name (skipped)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "❌ $name: ${result:-missing}" >> "$GITHUB_STEP_SUMMARY"
              failed=true
            fi
          }

          # Reports a real result without blocking. Distinct from allow_skip:
          # a failure is surfaced loudly in the summary but does not set
          # `failed`. Used for the Security Audit off `push` (below).
          advisory() {
            local name="$1" result="$2"
            if [[ "$result" == "success" ]]; then
              echo "✅ $name" >> "$GITHUB_STEP_SUMMARY"
            elif [[ "$result" == "skipped" ]]; then
              echo "⏭️ $name (skipped)" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "⚠️ $name: ${result:-missing} (advisory — not blocking)" \
                >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          require_success "check-rust" "$RESULT_CHECK_RUST"
          require_success "test-backend-unit" "$RESULT_UNIT"
          require_success "shell-tests" "$RESULT_SHELL"

          # Security Audit blocks a pull request or a merge group only when
          # the change itself touches what `cargo audit` reads (Cargo.toml /
          # Cargo.lock, at any depth -- the `manifest` output of the
          # `changes` job, which classifies a merge group from its own
          # base..head diff); on a push it is required. The verdict is a
          # function of the lockfile alone, so on a change that does not
          # touch the lockfile it is the base branch's verdict, and gating on
          # it means one advisory against one transitive crate blocks every
          # open PR until someone lands the bump: RUSTSEC-2026-0286
          # (cryptoki) held every PR for ~18 h on 2026-09-16/17 until #3964.
          # In the merge queue it would be worse: every queued group would
          # fail and be ejected after each new advisory (28-31 audit
          # failures a week), emptying the queue. The advisory does not go
          # unseen under this rule -- pushes to main and release/** still
          # fail on it, the PR that fixes it necessarily touches Cargo.lock
          # and must be green, and scheduled-tests.yml files a daily
          # non-gating report. Fails closed: an empty MANIFEST_CHANGED (the
          # `changes` job itself died) counts as lockfile-touching, matching
          # the job's own fail-open-to-running direction. workflow_dispatch
          # always reports manifest=true, so it stays blocking as well.
          if [[ "$GITHUB_EVENT_NAME" != "push" && "$MANIFEST_CHANGED" == "false" ]]; then
            advisory "security-audit" "$RESULT_SECURITY"
          else
            require_success "security-audit" "$RESULT_SECURITY"
          fi

          # The version-pin gate only runs on pull requests -- it needs a base
          # ref to diff against -- so on a push or a merge group its skip is
          # by design. On a PR it is REQUIRED, including on a docs-only one:
          # it is a git diff over two paths there and costs nothing, and
          # exempting it would make the one gate that predicts a blocked
          # release chain the one gate a docs-only PR can turn off. A merge
          # group adds no change of its own to a PR that already passed it.
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            require_success "version-pin-bump" "$RESULT_VERSION_PIN"
          else
            allow_skip "version-pin-bump" "$RESULT_VERSION_PIN"
          fi

          # Container chain (build-backend-image -> smoke-e2e, plus the
          # OpenSCAP image): NOT checked here, and not in this job's `needs`.
          # It is advisory on every event. On a pull request it runs only for
          # a docker/ change or the `ci:image` label; on a push it runs as
          # before, and a failure there turns the push run red on its own
          # (a failed job fails the workflow run) without holding this
          # context. It is never part of a merge group.
          #
          # History: #3166 made the chain run on PRs, as advisory, because its
          # jobs then queued on the self-hosted pools; the image build takes
          # ~25 min even hosted. Waiting on it cost the median backend PR
          # 3.4 min and the p90 11.5 min to CI Complete (2026-09-17..24), and
          # tied the required context to a pool whose queue p90 was 146 min.
          # Promoting it to blocking again is a deliberate latency decision:
          # add the jobs back to `needs` and to this step.

          # Coverage (floor + new code; jscpd advisory) is a merge gate on
          # pull requests, rolled out by .github/coverage-gate.json: in
          # `shadow` mode it only reports what it would do; in `enforce` a
          # failure blocks unless the PR predates `enforce_after`, is a
          # draft, carries the grace label, or has the audited maintainer
          # override. All of that lives in the script; this passes it the
          # one thing only this step knows -- whether the unit job was
          # skipped BY DESIGN (then no coverage is expected) or not (then
          # nothing was measured, which is a failure).
          coverage_skip_reason=""
          if [[ "$docs_only" == "true" ]]; then
            coverage_skip_reason="docs-only"
          elif [[ "$bump_only" == "true" ]]; then
            coverage_skip_reason="version-bump-only"
          elif [[ "$rust_skipped" == "true" ]]; then
            coverage_skip_reason="no Rust-job inputs${RUST_SKIP_REASON:+: $RUST_SKIP_REASON}"
          fi
          if [[ -f scripts/ci/coverage-gate-decision.sh ]]; then
            # The coverage comes from the unit-test legs alone, so the
            # decision reads their result, not the aggregate that also
            # covers the integration suites (already required above).
            if ! RESULT_UNIT="$RESULT_UNIT_SHARDS" COVERAGE_SKIP_REASON="$coverage_skip_reason" \
                bash scripts/ci/coverage-gate-decision.sh; then
              failed=true
            fi
          else
            echo "❌ coverage: scripts/ci/coverage-gate-decision.sh was not checked out" >> "$GITHUB_STEP_SUMMARY"
            failed=true
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$failed" == "true" ]]; then
            echo "❌ **CI Failed**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ **CI Passed**" >> "$GITHUB_STEP_SUMMARY"
