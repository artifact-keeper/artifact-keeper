name: Docker Publish

on:
  push:
    # `release/**`, not a hardcoded series (#3422): a commit landing on
    # release/1.7.x used to publish NOTHING, so release-preflight check 3
    # correctly reported "no Docker Publish run exists for HEAD" (#3338) and
    # every 1.7.x cut needed an undocumented manual workflow_dispatch first.
    # Every maintenance branch now publishes on push exactly as release/1.1.x
    # already did.
    branches: [main, master, 'release/**']
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - '.beads/**'
      - 'LICENSE'
      - 'CLAUDE.md'
  # Keep the registry layer cache warm (#3044). The amd64 backend build takes
  # ~60-90 min when the :buildcache-amd64 registry cache is cold or stale
  # (arm64 stays ~9 min), so a release tag cut after a quiet spell on main
  # pays that full cost. A scheduled main build re-runs the normal publish
  # pipeline, refreshing the buildcache-* cache tags (cache-to mode=max) so a
  # subsequent tag cut hits warm cache. On a schedule event github.ref is
  # refs/heads/main, so docker/metadata-action produces exactly the main-push
  # tag set (main, dev, sha-<sha>) — the release-facing tags (semver, latest)
  # are gated on refs/tags/v* and cannot fire, and the tag-push/dispatch
  # guards in publish-preflight are skipped for schedule events.
  schedule:
    - cron: '23 5 * * 1,4'  # Mon/Thu 05:23 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: 'Candidate image tag (e.g., rc-1.5.9, pr-123, 1.1-dev). Release-managed labels such as latest/dev/stable and version numbers are refused. Ignored when promote_version is set.'
        required: false
        default: 'rc-candidate'
      # PROMOTE mode (#2698): complete a partially-published release without
      # rebuilding. Given a version already built on ghcr, resolve its published
      # manifest-list digest and idempotently (re)apply every version tag and the
      # Docker Hub mirror for all three images. The digest-aware guard still runs,
      # so promote can only re-apply the SAME digest -- never replace it -- which
      # is why it needs no manual tokens: it uses the pipeline's own credentials.
      promote_version:
        description: 'PROMOTE: finish/re-apply a version already built on ghcr (e.g. 1.6.2) — re-applies all tags + the Docker Hub mirror for all three images WITHOUT rebuilding. Leave blank for a normal build.'
        required: false
        default: ''
      # POST-GATE FLOATING PROMOTION. Off by default, which is what keeps the
      # documented recovery dispatch (`-f promote_version=X.Y.Z` on its own)
      # byte-for-byte the operation it has always been: re-apply the exact
      # version tag and mirror ghcr's CURRENT floating state to Docker Hub,
      # never moving a floating tag.
      #
      # Turned on, it lets the promote re-point `:latest` / `:X.Y` AT THE SAME
      # DIGEST the exact version tag already names, which is how release.yml
      # applies floating tags only after the release gate has certified those
      # bytes. It is not a licence to name anything: `apply-floating-tags`
      # runs `.github/scripts/floating-tag-plan.sh`, which refuses any version
      # without a published, non-draft, non-prerelease GitHub Release and
      # refuses to move a floating tag backwards.
      promote_floating:
        description: 'PROMOTE: also advance the floating tags (:latest, :X.Y) to promote_version. Only permitted for a version with a published GitHub Release that is the newest in its line. Requires promote_version.'
        required: false
        type: boolean
        default: false

permissions: {}

# Concurrency rules:
#
# - The group is keyed by `event_name` + `ref` so push and workflow_dispatch
#   for the same branch are in DIFFERENT groups. A manual run (`workflow_dispatch`)
#   never gets cancelled by an auto run, and vice versa.
# - `cancel-in-progress` is ALWAYS false. Runs queue behind each other and
#   every one of them finishes.
#
# This workflow *publishes* — it is not a check whose only product is a
# pass/fail verdict, so a cancelled run is not merely wasted CI time, it is a
# floating tag left pointing at a stale digest.
#
# #2099: it used to cancel superseded branch pushes to "stop building stale
# containers". The arm64 legs run on GitHub-hosted `ubuntu-24.04-arm` and
# finish fast, but the amd64 legs run on the capped self-hosted
# `ak-ci-runners` and were still in flight when the next merge landed. The
# cancel killed them mid-build, so the multi-arch *manifest* jobs — which fan
# in from both arches and are the only thing that moves `:dev`/`:main` — never
# ran at all. After merging #2092, #2090 and #1927 back-to-back on 2026-07-01,
# `artifact-keeper-scanner-adapter:dev` was simply never published, and iac
# PR #186's `Verify Image References` gate had nothing to resolve.
#
# Queueing is the right trade here: the tail run republishes the floating tags
# for the newest commit either way, and the intermediate runs cost build
# minutes but leave the registry consistent at every step. Cancelling saves
# those minutes by gambling that the *next* run completes — and when merges
# arrive faster than the amd64 build takes, that gamble loses every time.
concurrency:
  group: docker-publish-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ${{ github.repository }}-backend
  OPENSCAP_IMAGE: ${{ github.repository }}-openscap
  SCANNER_ADAPTER_IMAGE: ${{ github.repository }}-scanner-adapter
  DOCKERHUB_BACKEND: artifactkeeper/backend
  DOCKERHUB_OPENSCAP: artifactkeeper/openscap
  DOCKERHUB_SCANNER_ADAPTER: artifactkeeper/scanner-adapter

jobs:
  publish-preflight:
    name: Publish identity preflight
    runs-on: ubuntu-latest
    # Scheduled cache-warm runs (#3044) only make sense in the canonical repo:
    # forks have no business refreshing our ghcr buildcache and would just
    # burn runner minutes. Every other job needs this one (directly or
    # transitively) without a status-check override, so skipping it skips the
    # whole run; the always()-gated summary job carries the same guard.
    if: ${{ github.event_name != 'schedule' || github.repository == 'artifact-keeper/artifact-keeper' }}
    permissions:
      contents: read
    outputs:
      # The validated, normalized manual tag. Downstream metadata steps use
      # THIS value rather than the raw input, so the string that was checked is
      # the string that gets published. Empty for non-dispatch events, where
      # the manual tag line is disabled anyway.
      dispatch_tag: ${{ steps.manual_tag.outputs.tag }}
      # The validated PROMOTE target version (empty unless this is a promote
      # dispatch). Non-empty flips the build jobs off and the merge jobs into
      # re-apply-existing-digest mode.
      promote_version: ${{ steps.promote.outputs.version }}
      # 'true' only when this promote dispatch was explicitly asked to advance
      # the floating tags AND the target is a stable X.Y.Z. Consumed by
      # `apply-floating-tags` (the only job that writes a floating tag).
      advance_floating: ${{ steps.promote.outputs.advance_floating }}
      # The `X.Y-dev` floating alias for a maintenance branch push -- `1.1-dev`
      # for release/1.1.x, `1.7-dev` for release/1.7.x -- and empty for every
      # other ref. Computed once here rather than hardcoded per image, which
      # is what left the `release/**` glob (#3422) publishing a series-dev tag
      # for exactly one series.
      series_dev_tag: ${{ steps.series.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      # Scope, stated honestly: `created` is false only when a push updates an
      # existing ref, so this catches a force-push over a live tag -- the
      # v1.5.8 failure mode. It does NOT catch delete-then-recreate: GitHub
      # reports the recreating push as a brand-new ref (created=true,
      # forced=false), indistinguishable from a first-time tag. `deleted` is
      # not checked because Actions does not run `push` workflows on ref
      # deletion at all, so the branch would be dead code.
      #
      # Genuine tag immutability is a repository ruleset (restrict updates AND
      # deletions on refs/tags/v*), not a workflow control. This job narrows
      # the window; it does not close it.
      # `github.event.created` / `.forced` only exist on a `push` event. A
      # workflow_dispatch aimed at a tag ref -- which is exactly how a promote
      # is run "from the release commit", and how release.yml dispatches the
      # post-gate floating promotion -- has neither, so this check used to fail
      # closed on an operation that moves no tag at all. Scoping it to `push`
      # keeps the force-push protection it was written for and stops it firing
      # on a build-free re-application of an existing digest.
      - name: Reject moved version tags
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_CREATED: ${{ github.event.created }}
          TAG_FORCED: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$TAG_CREATED" != "true" || "$TAG_FORCED" == "true" ]]; then
            echo "::error title=Version tag is not new::${GITHUB_REF_NAME} was moved or force-pushed. Refusing to replace published container tags; create a new version instead."
            exit 1
          fi

      # PROMOTE mode (#2698): validate the requested version and prove it is
      # already published on ghcr BEFORE any downstream job tries to promote it,
      # so a typo or an un-built version fails fast here rather than deep in the
      # graph. Promote never builds; it only re-applies an existing digest, and
      # the merge jobs re-run the digest-aware guard, so this cannot become a
      # path to publish new content.
      - name: Validate promote request
        id: promote
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_version != ''
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROMOTE_VERSION: ${{ github.event.inputs.promote_version }}
          # See the note on the refuse-step below for why this goes through
          # `format`: it renders "true"/"false" for a boolean or a string input
          # alike, so the shell comparison has one shape to handle.
          PROMOTE_FLOATING: ${{ format('{0}', github.event.inputs.promote_floating) }}
        run: |
          set -euo pipefail
          V="$PROMOTE_VERSION"
          # A promote target is an EXACT release version (the identity a chart
          # pins) -- bare or v-prefixed semver with an optional prerelease
          # suffix -- never a floating/candidate label.
          if [[ ! "$V" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid promote_version::'${V}' is not an exact version (expected e.g. 1.6.2 or 1.6.2-rc.1)."
            exit 1
          fi
          V="${V#v}"
          # It must already exist on ghcr; promote completes an existing build.
          state=$(.github/scripts/registry-tag-state.sh ghcr.io "${BACKEND_IMAGE}" "$V" || true)
          if [[ "$state" != "present" ]]; then
            echo "::error title=Nothing to promote::ghcr.io/${BACKEND_IMAGE}:${V} is '${state}', not 'present'. Promote re-applies an already-built version; build it first."
            exit 1
          fi
          echo "Promote target validated: ${V} (present on ghcr.io/${BACKEND_IMAGE})."
          echo "version=${V}" >> "$GITHUB_OUTPUT"

          # Floating advance is opt-in and stable-only. A prerelease has never
          # taken a floating tag (`type=raw,value=latest` is gated on
          # `!contains(github.ref, '-')`), and that stays true here: the
          # request is refused rather than silently downgraded, so an operator
          # who typed an -rc version gets told, not ignored.
          if [[ "${PROMOTE_FLOATING}" == "true" ]]; then
            if [[ "${V}" == *-* ]]; then
              echo "::error title=Floating tags are stable-only::promote_floating was requested for prerelease ${V}. Prereleases never take :latest or :X.Y."
              exit 1
            fi
            echo "advance_floating=true" >> "$GITHUB_OUTPUT"
            echo "Floating tags (:latest, :${V%.*}) will be considered for advancement to ${V}; the published-release rule decides which actually move."
          else
            echo "advance_floating=false" >> "$GITHUB_OUTPUT"
          fi

      # `promote_floating` alone does nothing -- the floating plan is keyed on
      # the promote target -- so accepting it silently would let an operator
      # believe a floating tag had been considered when no job ever looked.
      #
      # `format('{0}', ...)` rather than a bare comparison: a `type: boolean`
      # dispatch input arrives as the STRING "true" from `gh workflow run -f`
      # and the UI checkbox, but as a JSON boolean from a typed API call.
      # `'true' == true` is false in GitHub expressions (the boolean is cast to
      # a number, the string to NaN), and a bare truthiness test is worse still
      # -- the non-empty string "false" is truthy. Rendering both through
      # `format` gives one comparison that is right for either shape.
      - name: Refuse promote_floating without promote_version
        if: github.event_name == 'workflow_dispatch' && format('{0}', github.event.inputs.promote_floating) == 'true' && github.event.inputs.promote_version == ''
        run: |
          echo "::error title=promote_floating needs promote_version::promote_floating only applies to a promote dispatch; set promote_version to the release you want :latest / :X.Y to name."
          exit 1

      # Manual builds are useful for candidate/dev labels, but must not be a
      # back door around the guarded release path. See the script for why the
      # normalized value is what gets validated and published. Skipped in
      # promote mode (the tag input is ignored there).
      - name: Validate manual tag
        id: manual_tag
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_version == ''
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          TAG=$(.github/scripts/validate-dispatch-tag.sh "$REQUESTED_TAG")
          echo "Manual tag accepted: ${TAG}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Derive the `X.Y-dev` alias from the branch name so a new maintenance
      # line gets one the moment it is created, with no workflow edit. Only a
      # `release/<major>.<minor>.x` branch qualifies; anything else (main, a
      # tag, a dispatch, a stray `release/hotfix`) yields the empty string and
      # the metadata line disables itself -- the same shape `dispatch_tag`
      # already uses, so an empty raw value here is a pattern the workflow
      # already relies on rather than a new risk.
      - name: Derive the series-dev tag for maintenance branch pushes
        id: series
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          tag=""
          if [[ "$GH_REF" =~ ^refs/heads/release/([0-9]+\.[0-9]+)\.x$ ]]; then
            tag="${BASH_REMATCH[1]}-dev"
          fi
          echo "series-dev tag: '${tag}'"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Backend (${{ matrix.platform }})
    needs: [publish-preflight]
    # PROMOTE mode re-applies an existing ghcr digest and never rebuilds, so the
    # build jobs are skipped entirely there. For every other event this is true.
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.promote_version != '') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-tag: arm64
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate to Docker Hub before buildx so transitive `FROM`
      # statements that pull from docker.io (e.g., the alpine:3.23 stage
      # used to pre-seed the Grype CVE DB inside Dockerfile.backend) are
      # not subject to the 100-pull/6h anonymous rate limit.
      - name: Log in to Docker Hub (for transitive base-image pulls)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}

      # The backend image compiles Rust inside Docker, which can exhaust the
      # ~14GB free disk on a stock hosted amd64 runner. Reclaim the large
      # preinstalled toolchains we do not use before building. amd64 only:
      # the arm64 runner layout differs and its build is unaffected. If the
      # hosted disk still proves insufficient, the fallback per the CI
      # reliability plan is a dedicated image-builder scale set, not a return
      # to the shared Rust runner path.
      - name: Free disk space
        if: matrix.platform == 'linux/amd64'
        run: |
          echo "Disk before cleanup:"
          df -h /
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          echo "Disk after cleanup:"
          df -h /

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.backend
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Registry cache instead of type=gha: buildkit blobs were consuming
          # ~7.7GB of the repo's 10GB Actions cache quota, evicting the rust
          # caches daily. image-manifest+oci-mediatypes are required for GHCR
          # to accept mode=max cache manifests.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache-${{ matrix.cache-tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache-${{ matrix.cache-tag }},mode=max,image-manifest=true,oci-mediatypes=true
          # Always re-run the package-refresh and runtime stages: their RUN
          # lines (`dnf upgrade`, `grype db update`) are only correct when
          # executed against the CURRENT repos, but the registry cache would
          # otherwise happily serve months-old layers, shipping stale security
          # errata and a stale grype DB (#2391). The expensive Rust stages
          # (planner/deps/builder) stay fully cached.
          #
          # `grype-bin` joined that list with #3352: it now COMPILES grype from
          # source instead of copying a prebuilt binary, so the Go toolchain it
          # resolves (`golang:1.26-alpine`, floating to the newest patch) is a
          # security input exactly like `dnf upgrade` is. Cached, it would keep
          # shipping the toolchain from whenever the layer was first built —
          # which is the failure mode #3352 exists to remove.
          no-cache-filters: rootfs-builder,grype-bin,grype-db-seed,runtime
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-openscap:
    name: OpenSCAP (${{ matrix.platform }})
    needs: [publish-preflight]
    # Skipped in PROMOTE mode (re-apply existing digest, no rebuild).
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.promote_version != '') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-tag: arm64
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate to Docker Hub for transitive base-image pulls; see
      # the matching step in build-backend for rationale.
      - name: Log in to Docker Hub (for transitive base-image pulls)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.openscap
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}:buildcache-${{ matrix.cache-tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}:buildcache-${{ matrix.cache-tag }},mode=max,image-manifest=true,oci-mediatypes=true
          # Re-run the dnf package-refresh stage against current errata on
          # every publish instead of serving it from stale cache (#2391).
          no-cache-filters: rootfs-builder
          sbom: true
          provenance: mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openscap-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-scanner-adapter:
    name: Scanner Adapter (${{ matrix.platform }})
    needs: [publish-preflight]
    # Skipped in PROMOTE mode (re-apply existing digest, no rebuild).
    if: ${{ !(github.event_name == 'workflow_dispatch' && github.event.inputs.promote_version != '') }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-tag: arm64
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Authenticate to Docker Hub for transitive base-image pulls; see
      # the matching step in build-backend for rationale.
      - name: Log in to Docker Hub (for transitive base-image pulls)
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.scanner-adapter
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}:buildcache-${{ matrix.cache-tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}:buildcache-${{ matrix.cache-tag }},mode=max,image-manifest=true,oci-mediatypes=true
          # Re-run the runtime stage (`apk add --no-cache`) against current
          # Alpine errata on every publish instead of serving it from stale
          # cache (#2391). The Go build stage stays cached.
          no-cache-filters: runtime
          sbom: true
          provenance: mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scanner-adapter-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  build-backend-alpine:
    name: Backend Alpine (${{ matrix.platform }})
    needs: [publish-preflight]
    # Alpine builds suspended. UBI is the default backend image and the
    # only one we currently publish. Re-enable when the Alpine variant is
    # needed again (smaller footprint, distroless-style use cases).
    if: false
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ak-ci-runners
            cache-tag: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-tag: arm64
    outputs:
      digest-amd64: ${{ steps.build.outputs.digest }}
      digest-arm64: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./docker/Dockerfile.backend.alpine
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache-alpine-${{ matrix.cache-tag }}
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:buildcache-alpine-${{ matrix.cache-tag }},mode=max,image-manifest=true,oci-mediatypes=true
          # Re-run the package-refresh, grype-source-build and runtime stages
          # against current errata/toolchain on every publish; see the backend
          # job note (#2391, #3352).
          no-cache-filters: grype-bin,grype-db-seed,runtime
          sbom: true
          provenance: mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-alpine-digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  scan-containers:
    name: Security Scan
    runs-on: ubuntu-24.04
    # `build-backend-alpine` removed from `needs` while alpine builds are
    # suspended. Re-add it (and re-enable the alpine-gated steps below)
    # when the alpine variant comes back online.
    needs: [build-backend, build-openscap, build-scanner-adapter]
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download backend amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: backend-digests-amd64
          path: /tmp/backend-digests

      - name: Download openscap amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: openscap-digests-amd64
          path: /tmp/openscap-digests

      - name: Download scanner-adapter amd64 digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: scanner-adapter-digests-amd64
          path: /tmp/scanner-adapter-digests

      # Alpine digest download skipped while alpine builds are suspended.
      # - name: Download backend alpine amd64 digest
      #   uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      #   with:
      #     name: backend-alpine-digests-amd64
      #     path: /tmp/backend-alpine-digests

      - name: Resolve image references
        id: refs
        run: |
          BACKEND_DIGEST=$(ls /tmp/backend-digests/)
          OPENSCAP_DIGEST=$(ls /tmp/openscap-digests/)
          SCANNER_ADAPTER_DIGEST=$(ls /tmp/scanner-adapter-digests/)
          echo "backend=${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@sha256:${BACKEND_DIGEST}" >> $GITHUB_OUTPUT
          echo "openscap=${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}@sha256:${OPENSCAP_DIGEST}" >> $GITHUB_OUTPUT
          echo "scanner-adapter=${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}@sha256:${SCANNER_ADAPTER_DIGEST}" >> $GITHUB_OUTPUT
          # backend-alpine digest output skipped while alpine builds are suspended.

      # --- Trivy CVE scanning ---
      # TWO PASSES PER IMAGE (#3122). This is the structure the comments here
      # have always described; until #3122 it did not actually exist, and the
      # single combined pass silently gated on every severity.
      #
      #   Pass 1 - VISIBILITY: `format: sarif`, `exit-code: '0'`. Never blocks.
      #     Feeds the GitHub code-scanning Security tab with findings at ALL
      #     severities. It deliberately declares no `severity:` — trivy-action
      #     throws that input away for SARIF (see below), so writing one there
      #     only creates the illusion of a filter.
      #
      #   Pass 2 - GATE: `format: 'table'`, `severity: 'CRITICAL,HIGH'`,
      #     `exit-code: '1'`. This is the control that ENFORCES (#2609): a
      #     CRITICAL or HIGH CVE with an available fix fails this job, and the
      #     merge-* jobs `need` this job, so no tag is published from a failing
      #     scan. Table format is load-bearing, not cosmetic — it is what keeps
      #     the severity filter alive.
      #
      # WHY THE SPLIT (#3122): `aquasecurity/trivy-action` runs
      # `unset TRIVY_SEVERITY` whenever the format is SARIF and
      # `limit-severities-for-sarif` is not exactly "true"
      # (entrypoint.sh:75-83 at the pinned SHA; it logs the giveaway line
      # "Building SARIF report with all severities"). The old single pass was
      # SARIF + `severity: CRITICAL,HIGH` + `exit-code: '1'`, so the filter was
      # discarded and the gate failed on a fixable CVE of ANY severity. #3121
      # was a LOW (`security-severity: 3.1`) that blocked all publishing from
      # `main` for days while this file and the step summary both claimed
      # CRITICAL/HIGH-only. Setting `limit-severities-for-sarif: true` would
      # also fix the gate, but it truncates the SARIF to CRITICAL/HIGH and
      # costs the Security-tab view of everything below that. Splitting keeps
      # full visibility AND an honest gate.
      # Guarded against regression by scripts/ci/check-trivy-gate-severity.sh.
      #
      # The exception paths on the GATE pass, in order:
      #   * --ignore-unfixed: CVEs with no released fix (typically UBI base
      #     image CVEs that are Red Hat's responsibility) do not block
      #     publication. Note they are filtered out of the SARIF pass too, so
      #     they are not surfaced in the Security tab either — dropping
      #     `ignore-unfixed` from pass 1 would surface them, at the cost of a
      #     large volume of base-image noise. Deliberately left as-is.
      #   * .trivyignore: per-CVE accepted exceptions, each justified in that
      #     file. This is the documented way to unblock a publish while a fix
      #     is pending. Applied to both passes so the Security tab and the gate
      #     agree on what has been accepted.
      # All scan steps run to completion (`if: always()`) so a failing image
      # never hides findings in the others, and the SARIF uploads below also
      # run on failure.
      # NOTE: trivy binary extracted from official GHCR image because the
      # aquasecurity/trivy GitHub repo was wiped (no releases/tags).
      #
      # Network resilience (#2981, #2982): every network dependency of this
      # gate (trivy binary pull, vulnerability-DB download, scan-target image
      # pulls) happens in dedicated steps BEFORE the scans, wrapped in the
      # same bounded retry-with-backoff the Docker Hub mirror step uses
      # (5 attempts, n*10s sleep). The scan steps themselves then run with
      # TRIVY_SKIP_DB_UPDATE=true against locally pulled images, so they do
      # no DB network I/O at scan time: a red scan step means findings
      # (CVEs), while an infra/network failure surfaces in the pre-steps
      # with an explicit "(infra)" error annotation. Only idempotent
      # pulls/downloads are retried; the scans themselves are never
      # retried, so a finding can never be retried away.
      - name: Install Trivy
        run: |
          set -euo pipefail
          n=0; max=5
          until docker pull -q ghcr.io/aquasecurity/trivy:0.69.3; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              echo "::error title=Trivy install failed (infra)::Pulling ghcr.io/aquasecurity/trivy:0.69.3 failed after ${max} attempts. Infrastructure failure, not a vulnerability finding."
              exit 1
            fi
            echo "Trivy image pull attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done
          CONTAINER_ID=$(docker create ghcr.io/aquasecurity/trivy:0.69.3)
          docker cp "$CONTAINER_ID:/usr/local/bin/trivy" /usr/local/bin/trivy
          docker rm "$CONTAINER_ID"
          trivy --version

      # Cache the vulnerability DB across runs, keyed by date (the same key
      # scheme trivy-action uses internally; its own cache step is disabled
      # below via `cache: false` so this workflow owns the key). With a warm
      # cache the pre-fetch below is a cheap freshness check; during an
      # upstream DB-mirror outage a previous day's DB (restore-keys) still
      # lets the gate scan instead of failing closed on infra (#2981).
      - name: Compute Trivy DB cache key
        id: trivy-db-date
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.trivy-db-date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Pre-fetch Trivy vulnerability DB
        run: |
          set -euo pipefail
          CACHE_DIR="${GITHUB_WORKSPACE}/.cache/trivy"
          n=0; max=5
          until trivy image --download-db-only --cache-dir "${CACHE_DIR}"; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              if [[ -f "${CACHE_DIR}/db/trivy.db" ]]; then
                echo "::warning title=Trivy DB refresh failed (infra)::Vulnerability DB download failed after ${max} attempts; scanning with the cached DB from a previous run."
                exit 0
              fi
              echo "::error title=Trivy DB fetch failed (infra)::Could not download the Trivy vulnerability DB after ${max} attempts and no cached DB is available. Infrastructure failure, not a vulnerability finding."
              exit 1
            fi
            echo "Trivy DB fetch attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      # Pre-pull the scan targets so the scan steps read from the local
      # Docker daemon instead of hitting the registry mid-scan (#2982).
      - name: Pre-pull scan target images
        run: |
          set -euo pipefail
          pull_with_retry() {
            local ref="$1" n=0 max=5
            until docker pull -q "${ref}"; do
              n=$((n + 1))
              if [[ "$n" -ge "$max" ]]; then
                echo "::error title=Scan image pull failed (infra)::docker pull ${ref} failed after ${max} attempts. Infrastructure failure, not a vulnerability finding."
                return 1
              fi
              echo "Pull attempt ${n}/${max} for ${ref} failed; retrying in $((n * 10))s..."
              sleep $((n * 10))
            done
          }
          pull_with_retry "${{ steps.refs.outputs.backend }}"
          pull_with_retry "${{ steps.refs.outputs.openscap }}"
          pull_with_retry "${{ steps.refs.outputs.scanner-adapter }}"

      # ---- Pass 1: SARIF visibility (all severities, never blocks) ----

      - name: Trivy SARIF - Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ steps.refs.outputs.backend }}
          format: 'sarif'
          output: 'backend-trivy.sarif'
          # No `severity:` here on purpose — trivy-action unsets it for SARIF
          # (#3122). All severities are reported; the gate pass below filters.
          ignore-unfixed: true
          # Suppress residual CVEs in the bundled trivy/grype CLI binaries that
          # have no fixed tool release yet (justified per-CVE in .trivyignore).
          trivyignores: '.trivyignore'
          exit-code: '0'
          skip-setup-trivy: true
          # DB caching is owned by the explicit steps above.
          cache: 'false'
        env:
          # DB was pre-fetched (with retry) above; never download mid-scan.
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Trivy SARIF - OpenSCAP
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          image-ref: ${{ steps.refs.outputs.openscap }}
          format: 'sarif'
          output: 'openscap-trivy.sarif'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Trivy SARIF - Scanner Adapter
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          image-ref: ${{ steps.refs.outputs.scanner-adapter }}
          format: 'sarif'
          output: 'scanner-adapter-trivy.sarif'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      # Alpine scan skipped while alpine builds are suspended.
      - name: Trivy SARIF - Backend Alpine
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: false
        with:
          image-ref: ${{ steps.refs.outputs.backend-alpine }}
          format: 'sarif'
          output: 'backend-alpine-trivy.sarif'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '0'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      # ---- Pass 2: the gate (CRITICAL/HIGH, fixed only — blocks publish) ----
      # `format: 'table'` is what keeps `severity:` alive; do not change it to
      # sarif without setting `limit-severities-for-sarif: true` (#3122).
      # Every image is gated with `if: always()` so one blocking image does not
      # hide another's CRITICAL/HIGH findings.

      - name: Trivy gate - Backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          image-ref: ${{ steps.refs.outputs.backend }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Trivy gate - OpenSCAP
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          image-ref: ${{ steps.refs.outputs.openscap }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Trivy gate - Scanner Adapter
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: always()
        with:
          image-ref: ${{ steps.refs.outputs.scanner-adapter }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      # Alpine gate skipped while alpine builds are suspended.
      - name: Trivy gate - Backend Alpine
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        if: false
        with:
          image-ref: ${{ steps.refs.outputs.backend-alpine }}
          format: 'table'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          exit-code: '1'
          skip-setup-trivy: true
          cache: 'false'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'

      - name: Upload Backend Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: 'backend-trivy.sarif'
          category: 'trivy-backend'

      - name: Upload OpenSCAP Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: 'openscap-trivy.sarif'
          category: 'trivy-openscap'

      - name: Upload Scanner Adapter Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: 'scanner-adapter-trivy.sarif'
          category: 'trivy-scanner-adapter'

      # Alpine SARIF upload skipped while alpine builds are suspended.
      - name: Upload Backend Alpine Trivy SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: false
        with:
          sarif_file: 'backend-alpine-trivy.sarif'
          category: 'trivy-backend-alpine'

      - name: Upload Trivy reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: trivy-scan-reports
          path: |
            backend-trivy.sarif
            openscap-trivy.sarif
            scanner-adapter-trivy.sarif
            backend-alpine-trivy.sarif
          retention-days: 90

      # --- OpenSCAP STIG compliance scan ---
      - name: Install OpenSCAP
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openscap-utils rpm2cpio

      - name: Download SCAP Security Guide (RHEL 9 STIG content)
        if: always()
        run: |
          SSG_VERSION=$(curl -sI "https://github.com/ComplianceAsCode/content/releases/latest" | grep -i ^location | sed 's|.*/||' | tr -d '\r')
          curl -sSfL -o /tmp/ssg.zip \
            "https://github.com/ComplianceAsCode/content/releases/download/${SSG_VERSION}/scap-security-guide-${SSG_VERSION#v}.zip"
          mkdir -p /tmp/ssg && unzip -q /tmp/ssg.zip -d /tmp/ssg
          SSG_DS=$(find /tmp/ssg -name "ssg-rhel9-ds.xml" | head -1)
          echo "SSG_DS=${SSG_DS}" >> $GITHUB_ENV

      - name: STIG scan - Backend
        if: always()
        run: |
          docker pull ${{ steps.refs.outputs.backend }}
          CID=$(docker create ${{ steps.refs.outputs.backend }})
          mkdir -p /tmp/rootfs/backend
          docker export ${CID} | tar -xf - -C /tmp/rootfs/backend
          docker rm ${CID}

          oscap xccdf eval \
            --profile xccdf_org.ssgproject.content_profile_stig \
            --results backend-stig-results.xml \
            --report backend-stig-report.html \
            --chroot /tmp/rootfs/backend \
            "${SSG_DS}" || true

      - name: STIG scan - OpenSCAP
        if: always()
        run: |
          docker pull ${{ steps.refs.outputs.openscap }}
          CID=$(docker create ${{ steps.refs.outputs.openscap }})
          mkdir -p /tmp/rootfs/openscap
          docker export ${CID} | tar -xf - -C /tmp/rootfs/openscap
          docker rm ${CID}

          oscap xccdf eval \
            --profile xccdf_org.ssgproject.content_profile_stig \
            --results openscap-stig-results.xml \
            --report openscap-stig-report.html \
            --chroot /tmp/rootfs/openscap \
            "${SSG_DS}" || true

      - name: Upload STIG reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: stig-compliance-reports
          path: |
            *-stig-report.html
            *-stig-results.xml
          retention-days: 90

      - name: STIG compliance summary
        if: always()
        run: |
          echo "## Container Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trivy CVE Scan" >> $GITHUB_STEP_SUMMARY
          # This claim is earned (#2609): the scan steps run with
          # `exit-code: 1` and every merge-* job `needs` this job, so a
          # CRITICAL/HIGH fixable finding fails the scan and no tag is
          # published. Keep this text and that wiring in sync.
          echo "- **Gate scope**: CRITICAL and HIGH severity, fixed CVEs only (\`.trivyignore\` documents accepted exceptions)" >> $GITHUB_STEP_SUMMARY
          echo "- **Report scope**: the SARIF uploaded to the Security tab carries **all** severities, fixed CVEs only — a LOW/MEDIUM alert there does *not* block publication (#3122)" >> $GITHUB_STEP_SUMMARY
          echo "- **Policy**: enforced — a CRITICAL/HIGH CVE with an available fix fails this job, and the merge jobs depend on it, so publication is blocked" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend**: $([ -f backend-trivy.sarif ] && echo 'Scanned' || echo 'Skipped')" >> $GITHUB_STEP_SUMMARY
          echo "- **OpenSCAP**: $([ -f openscap-trivy.sarif ] && echo 'Scanned' || echo 'Skipped')" >> $GITHUB_STEP_SUMMARY
          echo "- **Scanner Adapter**: $([ -f scanner-adapter-trivy.sarif ] && echo 'Scanned' || echo 'Skipped')" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Alpine**: $([ -f backend-alpine-trivy.sarif ] && echo 'Scanned' || echo 'Skipped')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### OpenSCAP STIG Compliance" >> $GITHUB_STEP_SUMMARY
          echo "- **Profile**: DISA STIG for RHEL 9" >> $GITHUB_STEP_SUMMARY
          echo "- HTML reports uploaded as workflow artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Alpine CVE Comparison" >> $GITHUB_STEP_SUMMARY
          echo "- No STIG scan for Alpine variant (no applicable DISA STIG profile)" >> $GITHUB_STEP_SUMMARY
          echo "- Compare Trivy SARIF results between UBI and Alpine for CVE delta" >> $GITHUB_STEP_SUMMARY

  merge-backend:
    name: Backend Multi-Arch Manifest
    runs-on: ubuntu-latest
    # `scan-containers` is a real gate (#2609): a CRITICAL/HIGH fixable CVE in
    # ANY of the three images blocks ALL tag publication, because the scan job
    # scans them together. `.trivyignore` is the exception path if one image
    # must ship while another is being fixed.
    needs: [publish-preflight, build-backend, scan-containers]
    # Runs on a normal build (build + scan green) OR in PROMOTE mode, where the
    # build/scan jobs are skipped because promote re-applies an existing digest.
    if: >-
      ${{ !cancelled() && needs.publish-preflight.result == 'success'
          && (needs.publish-preflight.outputs.promote_version != ''
              || (needs.build-backend.result == 'success' && needs.scan-containers.result == 'success')) }}
    outputs:
      # Handed to `apply-floating-tags`, which re-points :latest / :X.Y at THIS
      # manifest-list digest -- the very digest :X.Y.Z already names. A floating
      # tag is therefore an alias for tested bytes, never a second build.
      digest: ${{ steps.incoming.outputs.digest }}
      # The exact chart-pinned identity version published by this job, or empty
      # for a branch/pr/manual build that publishes no such tag.
      version: ${{ steps.plan.outputs.exact }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Non-empty => PROMOTE mode: re-apply the existing ghcr digest, no rebuild.
      PROMOTE_VERSION: ${{ needs.publish-preflight.outputs.promote_version }}

    steps:
      - name: Checkout (scripts and VEX files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/scripts
            .vex

      - name: Download digests
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: backend-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (ghcr.io)
        id: meta
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Extract metadata (Docker Hub)
        id: meta-dockerhub
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.DOCKERHUB_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      # Resolve, for BOTH modes, the full ghcr + Docker Hub tag sets and the
      # single "exact" version tag that must be guarded (empty for branch/pr/
      # manual builds that publish no chart-pinned identity tag).
      - name: Resolve publish plan
        id: plan
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          META_HUB_JSON: ${{ steps.meta-dockerhub.outputs.json }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "${PROMOTE_VERSION}" ]]; then
            # PROMOTE: no build metadata. Re-apply the EXACT identity tag, and
            # only that. The floating tags (X.Y, latest) used to be decided here
            # too; they now belong to `apply-floating-tags`, which is the single
            # job that writes a floating tag for any of the three images. This
            # job cannot see whether its siblings published, so a floating tag
            # written from here is a floating tag that can move on a partial
            # publish -- the shape that let v1.7.2 put `:latest` on bytes no
            # gate ever ran against.
            VERSION="${PROMOTE_VERSION}"
            GIMG="${REGISTRY}/${BACKEND_IMAGE}"; HIMG="docker.io/${DOCKERHUB_BACKEND}"
            vdig=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${GIMG}:${VERSION}" 2>/dev/null | jq -r '.digest' 2>/dev/null || true)
            if [[ "${vdig}" != sha256:* ]]; then
              echo "::error title=Nothing to promote::${GIMG}:${VERSION} is not present on ghcr; cannot promote."; exit 1
            fi
            ghcr=( "${GIMG}:${VERSION}" ); hub=( "${HIMG}:${VERSION}" )
            printf '%s\n' "${ghcr[@]}" | jq -R . | jq -cs . > /tmp/ghcr-tags.json
            printf '%s\n' "${hub[@]}"  | jq -R . | jq -cs . > /tmp/hub-tags.json
            echo "exact=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            # NORMAL: tags come straight from docker/metadata-action.
            jq -c '.tags' <<< "${META_JSON}" > /tmp/ghcr-tags.json
            jq -c '.tags' <<< "${META_HUB_JSON}" > /tmp/hub-tags.json
            # Only a clean release tag publishes a guarded exact identity tag.
            if [[ "${GH_REF}" == refs/tags/v* ]]; then
              echo "exact=${META_VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "exact=" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ghcr tags:"; cat /tmp/ghcr-tags.json; echo
          echo "hub tags:";  cat /tmp/hub-tags.json;  echo

      # Resolve the manifest-list digest this run will point the tags at, WITHOUT
      # writing the exact/floating tags first:
      #   NORMAL  - assemble the multi-arch manifest onto a content-addressed
      #             anchor tag (:sha-...). A sha tag names the content it points
      #             at, so writing it is safe even on a refuse path, and it makes
      #             the digest knowable BEFORE the guard runs.
      #   PROMOTE - the manifest already exists on ghcr; just read its digest.
      - name: Resolve incoming digest
        id: incoming
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${BACKEND_IMAGE}"
          if [[ -n "${PROMOTE_VERSION}" ]]; then
            REF="${IMG}:${PROMOTE_VERSION}"
          else
            ANCHOR=$(jq -r 'map(select(test(":sha-")))[0] // empty' /tmp/ghcr-tags.json)
            if [[ -z "${ANCHOR}" ]]; then
              echo "::error::no :sha- anchor tag in the ghcr tag set; cannot stage the manifest safely"; exit 1
            fi
            shopt -s nullglob
            srcs=()
            for f in /tmp/digests/*; do srcs+=( "${IMG}@sha256:$(basename "$f")" ); done
            if [[ "${#srcs[@]}" -eq 0 ]]; then
              echo "::error::no per-arch digests in /tmp/digests"; exit 1
            fi
            docker buildx imagetools create -t "${ANCHOR}" "${srcs[@]}"
            REF="${ANCHOR}"
          fi
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${REF}" | jq -r '.digest')
          [[ "${DIGEST}" == sha256:* ]] || { echo "::error::could not resolve a digest for ${REF}"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Incoming manifest-list digest: ${DIGEST} (from ${REF})"

      # Digest-aware republish guard (preserves the supply-chain property).
      #
      # Runs whenever an exact chart-pinned identity tag is being published
      # (release tags AND promote), on BOTH registries this job writes to. The
      # comparison, spelled out:
      #   - tag absent            -> allow (fresh publish, or a partial-publish
      #                              this run is completing on the missing side).
      #   - tag == incoming digest -> allow (idempotent re-apply / promote no-op).
      #   - tag != incoming digest -> REFUSE. A released tag would be silently
      #                              re-pointed to DIFFERENT content (a moved/
      #                              re-cut git tag the preflight cannot see, or a
      #                              tamper). This is the exact protection the old
      #                              "tag exists -> refuse" guard gave, kept intact.
      #   - state indeterminate    -> REFUSE (fail closed).
      # This is what lets a partial publish (ghcr done, Docker Hub not) be
      # completed by a re-run/promote while still forbidding a different-digest
      # overwrite.
      - name: Refuse to overwrite a published backend version
        if: ${{ steps.plan.outputs.exact != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/assert-version-digest-consistent.sh \
            "${{ steps.plan.outputs.exact }}" \
            "${{ steps.incoming.outputs.digest }}" \
            "ghcr.io|${BACKEND_IMAGE}" \
            "docker.io|${DOCKERHUB_BACKEND}"

      # Apply (or re-apply) every ghcr tag at the resolved digest. Re-pointing a
      # tag to the SAME digest is a no-op, so this is safe to re-run.
      - name: Apply ghcr tags
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(jq -r '.[]' /tmp/ghcr-tags.json)
          args=(); for t in "${TAGS[@]}"; do args+=( -t "$t" ); done
          docker buildx imagetools create "${args[@]}" \
            "${REGISTRY}/${BACKEND_IMAGE}@${{ steps.incoming.outputs.digest }}"
          docker buildx imagetools inspect "${REGISTRY}/${BACKEND_IMAGE}@${{ steps.incoming.outputs.digest }}" >/dev/null

      # Mirror to Docker Hub with retry. A transient PROTOCOL_ERROR/ETIMEDOUT on
      # the Docker Hub side is exactly what left v1.6.2 half-published; because
      # imagetools create re-points tags to the SAME digest, each retry is a safe
      # no-op-or-complete rather than a re-publish.
      - name: Copy to Docker Hub
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(jq -r '.[]' /tmp/hub-tags.json)
          args=(); for t in "${TAGS[@]}"; do args+=( -t "$t" ); done
          SRC="${REGISTRY}/${BACKEND_IMAGE}@${{ steps.incoming.outputs.digest }}"
          n=0; max=5
          until docker buildx imagetools create "${args[@]}" "${SRC}"; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              echo "::error title=Docker Hub mirror failed::imagetools create to Docker Hub failed after ${max} attempts."
              exit 1
            fi
            echo "Docker Hub copy attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.incoming.outputs.digest }}

      # CONTROL, not telemetry (#3496). This step carried
      # `continue-on-error: true` from the day it was added, so a failed
      # provenance push (OIDC token unavailable, registry rejection, action
      # outage, rate limit) was indistinguishable from success: the job stayed
      # green, `needs.<job>.result` stayed green, and the image published with
      # no provenance and no annotation anywhere. That is the same shape as
      # #2824, where the cosign step failed and 1.6.1 shipped unsigned and was
      # caught only because a human went looking.
      #
      # Hard-failing here does NOT block a publish: the tags were already
      # applied and mirrored by the steps above, so what this converts is a
      # silent supply-chain gap into a visible red job. Recovery is
      # "Re-run failed jobs" — every step in this job is idempotent
      # (imagetools re-points the SAME digest, cosign sign and attest are
      # both safe to repeat), which is what makes hard-fail affordable here.
      #
      # Enforced by scripts/ci/check-supply-chain-soft-fail.sh: no
      # attestation or cosign step in .github/workflows/ may be soft-failed,
      # and docker-publish.yml may carry no step-level continue-on-error at
      # all. If a step here is ever genuinely best-effort, express that in
      # its script with an explicit ::warning:: (see "Attach VEX
      # attestations" below) rather than with an invisible YAML key.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.incoming.outputs.digest }}
          push-to-registry: true

      # .vex was fetched by the checkout at the top of this job.
      #
      # BEST-EFFORT, and explicitly so (#3496). `docker scout attestation add`
      # depends on an external SaaS (Docker Scout) and on Docker Hub
      # credentials, so an outage there is not a reason to redden a publish —
      # unlike the provenance attestation above, which is a control. This step
      # used to say that with `continue-on-error: true`, which also made the
      # failure invisible: no annotation, no job-summary line, nothing to
      # notice. The soft-fail now lives in the script where a reader can see
      # it, and every failure raises a ::warning:: and a summary entry. If VEX
      # ever becomes a control, delete the failure-collecting arm rather than
      # re-adding continue-on-error.
      - name: Attach VEX attestations
        run: |
          set -uo pipefail
          failed=()
          for vex in .vex/*.vex.json; do
            [ -f "$vex" ] || continue
            echo "Attaching VEX: $vex"
            if ! docker scout attestation add \
              --file "$vex" \
              --predicate-type https://openvex.dev/ns/v0.2.0 \
              ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.incoming.outputs.digest }}; then
              failed+=("$vex")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::warning title=VEX attestation not attached::docker scout attestation add failed for ${failed[*]}. The image is published and its provenance is attested; only the VEX predicate is missing. Re-run this job to retry."
            {
              echo "### VEX attestations NOT attached"
              echo ""
              printf -- '- `%s`\n' "${failed[@]}"
              echo ""
              echo "Best-effort step (#3496): the published image is unaffected. Re-run this job to retry."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  merge-openscap:
    name: OpenSCAP Multi-Arch Manifest
    runs-on: ubuntu-latest
    # Gated on the container scan; see merge-backend (#2609).
    needs: [publish-preflight, build-openscap, scan-containers]
    # Normal build (build + scan green) OR PROMOTE mode. See merge-backend.
    if: >-
      ${{ !cancelled() && needs.publish-preflight.result == 'success'
          && (needs.publish-preflight.outputs.promote_version != ''
              || (needs.build-openscap.result == 'success' && needs.scan-containers.result == 'success')) }}
    outputs:
      # See merge-backend.
      digest: ${{ steps.incoming.outputs.digest }}
      version: ${{ steps.plan.outputs.exact }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PROMOTE_VERSION: ${{ needs.publish-preflight.outputs.promote_version }}

    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Download digests
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: openscap-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (ghcr.io)
        id: meta
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Extract metadata (Docker Hub)
        id: meta-dockerhub
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.DOCKERHUB_OPENSCAP }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      # See merge-backend for the full rationale of the plan/anchor/guard/apply/
      # mirror sequence. Same shape, OpenSCAP image.
      - name: Resolve publish plan
        id: plan
        env:
          META_JSON: ${{ steps.meta.outputs.json }}
          META_HUB_JSON: ${{ steps.meta-dockerhub.outputs.json }}
          META_VERSION: ${{ steps.meta.outputs.version }}
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ -n "${PROMOTE_VERSION}" ]]; then
            # Exact identity tag only; floating tags belong to
            # `apply-floating-tags`. See merge-backend.
            VERSION="${PROMOTE_VERSION}"
            GIMG="${REGISTRY}/${OPENSCAP_IMAGE}"; HIMG="docker.io/${DOCKERHUB_OPENSCAP}"
            vdig=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${GIMG}:${VERSION}" 2>/dev/null | jq -r '.digest' 2>/dev/null || true)
            if [[ "${vdig}" != sha256:* ]]; then
              echo "::error title=Nothing to promote::${GIMG}:${VERSION} is not present on ghcr; cannot promote."; exit 1
            fi
            ghcr=( "${GIMG}:${VERSION}" ); hub=( "${HIMG}:${VERSION}" )
            printf '%s\n' "${ghcr[@]}" | jq -R . | jq -cs . > /tmp/ghcr-tags.json
            printf '%s\n' "${hub[@]}"  | jq -R . | jq -cs . > /tmp/hub-tags.json
            echo "exact=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            jq -c '.tags' <<< "${META_JSON}" > /tmp/ghcr-tags.json
            jq -c '.tags' <<< "${META_HUB_JSON}" > /tmp/hub-tags.json
            if [[ "${GH_REF}" == refs/tags/v* ]]; then
              echo "exact=${META_VERSION}" >> "$GITHUB_OUTPUT"
            else
              echo "exact=" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "ghcr tags:"; cat /tmp/ghcr-tags.json; echo
          echo "hub tags:";  cat /tmp/hub-tags.json;  echo

      - name: Resolve incoming digest
        id: incoming
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${OPENSCAP_IMAGE}"
          if [[ -n "${PROMOTE_VERSION}" ]]; then
            REF="${IMG}:${PROMOTE_VERSION}"
          else
            ANCHOR=$(jq -r 'map(select(test(":sha-")))[0] // empty' /tmp/ghcr-tags.json)
            if [[ -z "${ANCHOR}" ]]; then
              echo "::error::no :sha- anchor tag in the ghcr tag set; cannot stage the manifest safely"; exit 1
            fi
            shopt -s nullglob
            srcs=()
            for f in /tmp/digests/*; do srcs+=( "${IMG}@sha256:$(basename "$f")" ); done
            if [[ "${#srcs[@]}" -eq 0 ]]; then
              echo "::error::no per-arch digests in /tmp/digests"; exit 1
            fi
            docker buildx imagetools create -t "${ANCHOR}" "${srcs[@]}"
            REF="${ANCHOR}"
          fi
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${REF}" | jq -r '.digest')
          [[ "${DIGEST}" == sha256:* ]] || { echo "::error::could not resolve a digest for ${REF}"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Incoming manifest-list digest: ${DIGEST} (from ${REF})"

      - name: Refuse to overwrite a published openscap version
        if: ${{ steps.plan.outputs.exact != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/assert-version-digest-consistent.sh \
            "${{ steps.plan.outputs.exact }}" \
            "${{ steps.incoming.outputs.digest }}" \
            "ghcr.io|${OPENSCAP_IMAGE}" \
            "docker.io|${DOCKERHUB_OPENSCAP}"

      - name: Apply ghcr tags
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(jq -r '.[]' /tmp/ghcr-tags.json)
          args=(); for t in "${TAGS[@]}"; do args+=( -t "$t" ); done
          docker buildx imagetools create "${args[@]}" \
            "${REGISTRY}/${OPENSCAP_IMAGE}@${{ steps.incoming.outputs.digest }}"
          docker buildx imagetools inspect "${REGISTRY}/${OPENSCAP_IMAGE}@${{ steps.incoming.outputs.digest }}" >/dev/null

      - name: Copy to Docker Hub
        run: |
          set -euo pipefail
          mapfile -t TAGS < <(jq -r '.[]' /tmp/hub-tags.json)
          args=(); for t in "${TAGS[@]}"; do args+=( -t "$t" ); done
          SRC="${REGISTRY}/${OPENSCAP_IMAGE}@${{ steps.incoming.outputs.digest }}"
          n=0; max=5
          until docker buildx imagetools create "${args[@]}" "${SRC}"; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              echo "::error title=Docker Hub mirror failed::imagetools create to Docker Hub failed after ${max} attempts."
              exit 1
            fi
            echo "Docker Hub copy attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}@${{ steps.incoming.outputs.digest }}

      # CONTROL, not telemetry (#3496) — see the long note on the same step
      # in merge-backend. No continue-on-error: a provenance push that fails
      # must be visible, and this job is idempotent so the fix is a re-run.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}
          subject-digest: ${{ steps.incoming.outputs.digest }}
          push-to-registry: true

  merge-scanner-adapter:
    name: Scanner Adapter Multi-Arch Manifest
    runs-on: ubuntu-latest
    # Gated on the container scan; see merge-backend (#2609).
    needs: [publish-preflight, build-scanner-adapter, scan-containers]
    # Normal build (build + scan green) OR PROMOTE mode. See merge-backend.
    if: >-
      ${{ !cancelled() && needs.publish-preflight.result == 'success'
          && (needs.publish-preflight.outputs.promote_version != ''
              || (needs.build-scanner-adapter.result == 'success' && needs.scan-containers.result == 'success')) }}
    outputs:
      # The adapter's floating line (X.Y / X / latest) is its OWN, decoupled
      # from the AK release version, and it deliberately follows an
      # unchanged-source rebuild that the exact tag does not (#2391). So the
      # digest is passed explicitly rather than re-resolved from the version
      # tag: re-resolving would put the adapter's floating tags on the PREVIOUS
      # build whenever the exact tag stayed put, which is the opposite of what
      # that rebuild is for.
      digest: ${{ steps.inspect.outputs.digest || steps.promote_digest.outputs.digest }}
      version: ${{ steps.adapter_version.outputs.version }}
      floating: ${{ steps.adapter_publish.outputs.publish_floating }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      # Non-empty => PROMOTE mode. The adapter is independently versioned, so
      # promote re-applies the adapter version recorded in docker/scanner-adapter/
      # VERSION at the checked-out ref; run promote from the release commit so
      # that file names the version that shipped with the release being completed.
      PROMOTE_VERSION: ${{ needs.publish-preflight.outputs.promote_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The scanner-adapter has its own independent semver (source of truth:
      # docker/scanner-adapter/VERSION), decoupled from AK's appVersion/git tag.
      # MAJOR encodes the backend compatibility contract (Harbor Pluggable
      # Scanner API v1). Derive version / major.minor / major from that file.
      - name: Read adapter version
        id: adapter_version
        env:
          GH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          V=$(tr -d '[:space:]' < docker/scanner-adapter/VERSION)
          echo "version=${V}" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
          echo "major=${V%%.*}" >> "$GITHUB_OUTPUT"
          # Stable adapter tags are considered only for clean release-tag
          # builds. Main publishes dev + sha tags and must never move the
          # adapter's exact semver tag without a VERSION bump.
          if [[ "$GH_REF" == refs/tags/v* && "$GH_REF" != *-* ]]; then
            echo "stable_requested=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable_requested=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: scanner-adapter-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two different tags with two different jobs:
      #
      #   exact (1.2.1)          identity. Published once, never re-pointed.
      #   floating (1.2, 1, latest)  "the newest build of that line". May move.
      #
      # The distinction matters because this image is rebuilt deliberately:
      # build-scanner-adapter sets `no-cache-filters: runtime` so `apk` re-runs
      # against current Alpine errata on every publish (#2391). A rule that
      # froze every stable tag once the version existed would leave the
      # chart-pinned floating tags on the old, unpatched digest with no way to
      # deliver an Alpine CVE fix short of a version bump for someone else's
      # security update. So an unchanged-source rebuild re-points the floating
      # tags and leaves the exact tag alone; a changed-source build still
      # demands a VERSION bump.
      - name: Decide stable adapter publication
        id: adapter_publish
        if: ${{ env.PROMOTE_VERSION == '' }}
        env:
          ADAPTER_VERSION: ${{ steps.adapter_version.outputs.version }}
          STABLE_REQUESTED: ${{ steps.adapter_version.outputs.stable_requested }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          publish_exact=false
          publish_floating=false
          finish() {
            echo "publish_exact=${publish_exact}" >> "$GITHUB_OUTPUT"
            echo "publish_floating=${publish_floating}" >> "$GITHUB_OUTPUT"
          }

          if [[ "$STABLE_REQUESTED" != "true" ]]; then
            echo "Branch/pr/manual build: publishing scanner-adapter dev/sha tags only."
            finish
            exit 0
          fi

          # Ask both registries, because this job writes to both. ghcr.io
          # answering "absent" says nothing about docker.io -- and deleting a
          # ghcr package version is a routine admin action, which must not
          # become permission to overwrite a published Docker Hub tag.
          PROBE=.github/scripts/registry-tag-state.sh
          GHCR_STATE=$("$PROBE" ghcr.io "${SCANNER_ADAPTER_IMAGE}" "$ADAPTER_VERSION" || true)
          HUB_STATE=$("$PROBE" docker.io "${DOCKERHUB_SCANNER_ADAPTER}" "$ADAPTER_VERSION" || true)
          echo "Adapter ${ADAPTER_VERSION}: ghcr.io=${GHCR_STATE}, docker.io=${HUB_STATE}"

          if [[ "$GHCR_STATE" == "indeterminate" || "$HUB_STATE" == "indeterminate" ]]; then
            echo "::error title=Adapter registry lookup inconclusive::Unable to prove whether ${ADAPTER_VERSION} is already published (ghcr.io=${GHCR_STATE}, docker.io=${HUB_STATE}); failing closed rather than risk replacing a published tag."
            exit 1
          fi

          if [[ "$GHCR_STATE" == "absent" && "$HUB_STATE" == "absent" ]]; then
            publish_exact=true
            publish_floating=true
            echo "Scanner-adapter ${ADAPTER_VERSION} is new on both registries; exact and floating tags will be created."
            finish
            exit 0
          fi

          if [[ "$GHCR_STATE" != "$HUB_STATE" ]]; then
            # One registry has the exact tag, the other does not -- typically a
            # partial publish whose Docker Hub mirror died mid-run. A fresh build
            # must NOT resolve that by re-pushing the exact tag (a rebuild has a
            # new digest and would move the tag that is meant to be immutable), so
            # this path still fails closed. The digest-safe way to finish it is
            # the PROMOTE dispatch, which re-applies the ALREADY-published digest:
            #   gh workflow run docker-publish.yml -f promote_version=<AK version>
            # run from the release commit. See the promote path below.
            echo "::error title=Adapter registries disagree::${ADAPTER_VERSION} is ${GHCR_STATE} on ghcr.io but ${HUB_STATE} on docker.io — likely a partial publish. A rebuild will not re-point the immutable exact tag. Complete it with the promote dispatch (promote_version=<AK version>, run from the release commit), which re-applies the published digest."
            exit 1
          fi

          # Present on both. The exact tag stays where it is; decide whether the
          # floating tags may follow this rebuild.
          EXACT_REF="${IMAGE}:${ADAPTER_VERSION}"
          MANIFEST_JSON=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "$EXACT_REF")
          EXISTING_REV=$(jq -r '.annotations["org.opencontainers.image.revision"] // empty' <<< "$MANIFEST_JSON")
          if [[ ! "$EXISTING_REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Adapter provenance missing::${EXACT_REF} exists but has no valid source revision annotation, so this build cannot prove the floating tags would advance the same sources. Bump docker/scanner-adapter/VERSION."
            exit 1
          fi

          if ! git cat-file -e "${EXISTING_REV}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$EXISTING_REV"
          fi

          # Tolerate a trailing newline or CRLF in the recorded VERSION file
          # rather than reporting a version collision over whitespace.
          EXISTING_VERSION=$(git show "${EXISTING_REV}:docker/scanner-adapter/VERSION" | tr -d '[:space:]')
          if [[ "$EXISTING_VERSION" != "$ADAPTER_VERSION" ]]; then
            echo "::error title=Adapter version collision::${EXACT_REF} records VERSION=${EXISTING_VERSION}, expected ${ADAPTER_VERSION}."
            exit 1
          fi

          if ! git diff --quiet "$EXISTING_REV" "$GITHUB_SHA" -- \
            docker/scanner-adapter docker/Dockerfile.scanner-adapter; then
            echo "::error title=Scanner adapter VERSION bump required::${EXACT_REF} already exists at ${EXISTING_REV}, but scanner-adapter sources changed. Bump docker/scanner-adapter/VERSION; exact version tags are never republished."
            exit 1
          fi

          publish_floating=true
          echo "Scanner-adapter ${ADAPTER_VERSION} already exists and sources are unchanged."
          echo "Keeping the exact ${ADAPTER_VERSION} tag on its published digest; moving the floating tags to this rebuild so base-image errata reach the chart-pinned tags."
          finish

      - name: Extract metadata (ghcr.io)
        id: meta
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}
          # Tags come from the adapter's own VERSION file, NOT the AK git-tag
          # semver used by backend/web/openscap. The exact version tag is
          # created once per adapter VERSION. Main builds keep only dev +
          # sha-<sha> for traceability. The floating tags (X.Y / X / latest)
          # are applied by `apply-floating-tags` from this job's digest output,
          # so they cannot move unless all three merge jobs published.
          tags: |
            type=raw,value=${{ steps.adapter_version.outputs.version }},enable=${{ steps.adapter_publish.outputs.publish_exact == 'true' }}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Extract metadata (Docker Hub)
        id: meta-dockerhub
        if: ${{ env.PROMOTE_VERSION == '' }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.DOCKERHUB_SCANNER_ADAPTER }}
          # Mirror of the ghcr.io tag set above: adapter's own VERSION, not the
          # AK git-tag semver. Same tags published to both registries; the
          # floating tags are added later by `apply-floating-tags`.
          tags: |
            type=raw,value=${{ steps.adapter_version.outputs.version }},enable=${{ steps.adapter_publish.outputs.publish_exact == 'true' }}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Create manifest list and push (ghcr.io)
        if: ${{ env.PROMOTE_VERSION == '' }}
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${ADAPTER_VERSION}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}@sha256:%s ' *)
        env:
          ADAPTER_VERSION: ${{ steps.adapter_version.outputs.version }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        id: inspect
        if: ${{ env.PROMOTE_VERSION == '' }}
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}:${{ steps.meta.outputs.version }}
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' \
            ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}:${{ steps.meta.outputs.version }} | jq -r '.digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      # Carry the same annotations the ghcr.io index gets. The source-revision
      # annotation is what the publication decision above reads back to tell an
      # unchanged-source rebuild from a version collision, so a Docker Hub index
      # without it would have no provenance anchor at all.
      - name: Copy to Docker Hub
        if: ${{ env.PROMOTE_VERSION == '' }}
        env:
          ADAPTER_VERSION: ${{ steps.adapter_version.outputs.version }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta-dockerhub.outputs.json }}
        run: |
          set -euo pipefail
          # Retry the cross-registry copy: a transient PROTOCOL_ERROR/ETIMEDOUT on
          # the Docker Hub side is what leaves a release half-published. imagetools
          # create re-points tags to the SAME digest, so each retry is a safe
          # no-op-or-complete.
          # shellcheck disable=SC2046  # tag args are intentionally word-split
          n=0; max=5
          until docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "index:org.opencontainers.image.version=${ADAPTER_VERSION}" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}@${{ steps.inspect.outputs.digest }}; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              echo "::error title=Docker Hub mirror failed::imagetools create to Docker Hub failed after ${max} attempts."
              exit 1
            fi
            echo "Docker Hub copy attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      # ── PROMOTE path (#2698) ──────────────────────────────────────────────
      # Re-apply the adapter's already-published version + floating tags and the
      # Docker Hub mirror WITHOUT rebuilding, to finish a partial publish. The
      # exact tag is only ever re-pointed to its OWN published digest, and the
      # digest-aware guard enforces that.
      - name: Promote — resolve published adapter digest
        id: promote_digest
        if: ${{ env.PROMOTE_VERSION != '' }}
        env:
          ADAPTER_VERSION: ${{ steps.adapter_version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          IMG="${REGISTRY}/${SCANNER_ADAPTER_IMAGE}"
          state=$(.github/scripts/registry-tag-state.sh ghcr.io "${SCANNER_ADAPTER_IMAGE}" "${ADAPTER_VERSION}" || true)
          if [[ "$state" != "present" ]]; then
            echo "::error title=Nothing to promote for scanner-adapter::ghcr.io/${SCANNER_ADAPTER_IMAGE}:${ADAPTER_VERSION} is '${state}'. The adapter VERSION at this ref (${ADAPTER_VERSION}) is not the published one; run promote from the release commit."
            exit 1
          fi
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${IMG}:${ADAPTER_VERSION}" | jq -r '.digest')
          [[ "${DIGEST}" == sha256:* ]] || { echo "::error::could not resolve adapter digest"; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Promoting scanner-adapter ${ADAPTER_VERSION} at ${DIGEST}"

      - name: Promote — refuse to overwrite a published scanner-adapter version
        if: ${{ env.PROMOTE_VERSION != '' }}
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          .github/scripts/assert-version-digest-consistent.sh \
            "${{ steps.adapter_version.outputs.version }}" \
            "${{ steps.promote_digest.outputs.digest }}" \
            "ghcr.io|${SCANNER_ADAPTER_IMAGE}" \
            "docker.io|${DOCKERHUB_SCANNER_ADAPTER}"

      - name: Promote — re-apply adapter tags (ghcr + Docker Hub)
        if: ${{ env.PROMOTE_VERSION != '' }}
        env:
          V: ${{ steps.adapter_version.outputs.version }}
          DIGEST: ${{ steps.promote_digest.outputs.digest }}
        run: |
          set -euo pipefail
          GIMG="${REGISTRY}/${SCANNER_ADAPTER_IMAGE}"
          HIMG="docker.io/${DOCKERHUB_SCANNER_ADAPTER}"
          # Exact identity tag only, guarded to the same digest. The adapter's
          # floating line (X.Y / X / latest) is re-applied by
          # `apply-floating-tags`, which runs after all three merge jobs.
          gargs=( -t "${GIMG}:${V}" ); hargs=( -t "${HIMG}:${V}" )
          docker buildx imagetools create "${gargs[@]}" "${GIMG}@${DIGEST}"
          n=0; max=5
          until docker buildx imagetools create "${hargs[@]}" "${GIMG}@${DIGEST}"; do
            n=$((n + 1))
            if [[ "$n" -ge "$max" ]]; then
              echo "::error title=Docker Hub mirror failed::adapter promote to Docker Hub failed after ${max} attempts."
              exit 1
            fi
            echo "Docker Hub copy attempt ${n}/${max} failed; retrying in $((n * 10))s..."
            sleep $((n * 10))
          done

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}@${{ steps.inspect.outputs.digest || steps.promote_digest.outputs.digest }}

      # CONTROL, not telemetry (#3496) — see the long note on the same step
      # in merge-backend. No continue-on-error: a provenance push that fails
      # must be visible, and this job is idempotent so the fix is a re-run.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest || steps.promote_digest.outputs.digest }}
          push-to-registry: true

  merge-backend-alpine:
    name: Backend Alpine Multi-Arch Manifest
    # Alpine builds suspended; the multi-arch manifest job follows them.
    if: false
    runs-on: ubuntu-latest
    # Gated on the container scan; see merge-backend (#2609).
    needs: [publish-preflight, build-backend-alpine, scan-containers]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: /tmp/digests
          pattern: backend-alpine-digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (ghcr.io)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          flavor: |
            suffix=-alpine
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Extract metadata (Docker Hub)
        id: meta-dockerhub
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: docker.io/${{ env.DOCKERHUB_BACKEND }}
          flavor: |
            suffix=-alpine
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=raw,value=${{ needs.publish-preflight.outputs.series_dev_tag }},enable=${{ needs.publish-preflight.outputs.series_dev_tag != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=${{ needs.publish-preflight.outputs.dispatch_tag }},enable=${{ github.event_name == 'workflow_dispatch' && needs.publish-preflight.outputs.dispatch_tag != '' }}

      - name: Create manifest list and push (ghcr.io)
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@sha256:%s ' *)
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}

      - name: Inspect image
        id: inspect
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }}
          DIGEST=$(docker buildx imagetools inspect --format '{{json .Manifest}}' \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:${{ steps.meta.outputs.version }} | jq -r '.digest')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Copy to Docker Hub
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta-dockerhub.outputs.json }}') \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.inspect.outputs.digest }}

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.inspect.outputs.digest }}

      # CONTROL, not telemetry (#3496) — see the long note on the same step
      # in merge-backend. No continue-on-error: a provenance push that fails
      # must be visible, and this job is idempotent so the fix is a re-run.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ steps.inspect.outputs.digest }}
          push-to-registry: true

      - name: Checkout (for VEX files)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .vex

      # BEST-EFFORT and loud — see the note on the same step in merge-backend
      # (#3496). Soft-fail lives in the script, not in continue-on-error.
      - name: Attach VEX attestations
        run: |
          set -uo pipefail
          failed=()
          for vex in .vex/*.vex.json; do
            [ -f "$vex" ] || continue
            echo "Attaching VEX: $vex"
            if ! docker scout attestation add \
              --file "$vex" \
              --predicate-type https://openvex.dev/ns/v0.2.0 \
              ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}@${{ steps.inspect.outputs.digest }}; then
              failed+=("$vex")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::warning title=VEX attestation not attached::docker scout attestation add failed for ${failed[*]}. The image is published and its provenance is attested; only the VEX predicate is missing. Re-run this job to retry."
            {
              echo "### VEX attestations NOT attached"
              echo ""
              printf -- '- `%s`\n' "${failed[@]}"
              echo ""
              echo "Best-effort step (#3496): the published image is unaffected. Re-run this job to retry."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # ══════════════════════════════════════════════════════════════════════════
  # APPLY FLOATING TAGS  (issues #2698, #3540)
  #
  # THE ONLY JOB IN THIS WORKFLOW THAT WRITES A FLOATING TAG. `:latest`, the
  # AK `:X.Y` series alias and the scanner-adapter's own `X.Y` / `X` / `latest`
  # line are all applied here and nowhere else.
  #
  # Why it is a separate job (the partial-publish problem)
  # -----------------------------------------------------
  # `merge-backend`, `merge-openscap` and `merge-scanner-adapter` are parallel
  # siblings. When each wrote its own floating tags, backend's `:latest` moved
  # the moment backend's build and scan passed -- whether or not the other two
  # images ever published. That is how v1.7.2 came to serve
  # `backend:1.7.2` and `backend:latest` publicly for hours as a version that
  # was then retired. This job `needs:` all three, with the default `success()`
  # semantics, so a failed OR SKIPPED sibling means no floating tag moves at
  # all; the immutable `:X.Y.Z` identity tags that did publish stay published,
  # which is the correct outcome -- they name exactly the bytes they name.
  #
  # Why backend/openscap floating tags are NOT applied on a tag push
  # ---------------------------------------------------------------
  # Because this workflow runs BEFORE the release gate, and always will: it is
  # what produces the bytes the gate tests. On v1.8.1 docker-publish finished
  # at 14:59:49 and the release published at 16:17:54, so under the old
  # arrangement `:latest` named gate-uncertified bytes for 78 minutes on a
  # release where nothing went wrong. A tag push therefore publishes only the
  # immutable `:X.Y.Z`, and `release.yml` dispatches this workflow again with
  # `promote_version=X.Y.Z -f promote_floating=true` AFTER the gate and the
  # GitHub Release. That second run rebuilds nothing: it resolves the digest
  # that `:X.Y.Z` already names and re-points the floating tags at it.
  #
  # The scanner-adapter is deliberately NOT deferred, for two reasons that are
  # specific to it and are worth stating rather than hiding:
  #   * `release.yml`'s `verify-images-published` requires the adapter's
  #     floating `:1` before the release job runs, so deferring it past the
  #     release would deadlock the first publish of any new adapter MAJOR; and
  #   * the adapter's floating tags intentionally follow an unchanged-source
  #     rebuild that its exact tag does NOT (#2391, Alpine errata), so a
  #     version-keyed post-gate promote would pin them to the previous build.
  # Its floating tags therefore still move pre-gate; they gain the sibling
  # barrier above but not the gate ordering. Tracked as follow-up work.
  # ══════════════════════════════════════════════════════════════════════════
  apply-floating-tags:
    name: Apply Floating Tags
    runs-on: ubuntu-latest
    # No `if:` and no `always()`: the default `success()` on all three merge
    # jobs IS the control. Adding `!cancelled()` here would re-open exactly the
    # partial-publish hole this job exists to close.
    needs: [publish-preflight, merge-backend, merge-openscap, merge-scanner-adapter]
    permissions:
      contents: read   # read published GitHub Releases (the floating-tag rule)
      packages: write  # re-point ghcr tags
    env:
      PROMOTE_VERSION: ${{ needs.publish-preflight.outputs.promote_version }}
      ADVANCE_FLOATING: ${{ needs.publish-preflight.outputs.advance_floating }}
      BACKEND_DIGEST: ${{ needs.merge-backend.outputs.digest }}
      BACKEND_VERSION: ${{ needs.merge-backend.outputs.version }}
      OPENSCAP_DIGEST: ${{ needs.merge-openscap.outputs.digest }}
      OPENSCAP_VERSION: ${{ needs.merge-openscap.outputs.version }}
      ADAPTER_DIGEST: ${{ needs.merge-scanner-adapter.outputs.digest }}
      ADAPTER_VERSION: ${{ needs.merge-scanner-adapter.outputs.version }}
      ADAPTER_FLOATING: ${{ needs.merge-scanner-adapter.outputs.floating }}

    steps:
      - name: Checkout (scripts)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Produces /tmp/floating-plan.txt, one `<image>|<digest>|<tag>` line per
      # tag to write. Deciding first and writing second keeps the whole plan
      # visible in the log even on the (common) do-nothing paths.
      - name: Plan floating tags
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          : > /tmp/floating-plan.txt

          # Current ghcr digest for a tag; empty when the tag is absent.
          tag_digest() {
            docker buildx imagetools inspect --format '{{json .Manifest}}' "$1" 2>/dev/null \
              | jq -r '.digest' 2>/dev/null || true
          }

          # plan <ghcr-image> <hub-image> <digest> <mode> <tag>...
          #   advance - write the tag at <digest> unconditionally (the caller
          #             has already established that it is allowed to move).
          #   mirror  - write the tag ONLY where ghcr ALREADY has it at
          #             <digest>. This is the historic promote behaviour: copy
          #             ghcr's CURRENT state to a registry that is missing it,
          #             never move a floating tag.
          plan() {
            local gimg="$1" himg="$2" digest="$3" mode="$4"; shift 4
            local t cur
            for t in "$@"; do
              [[ -n "$t" ]] || continue
              if [[ "$mode" == "mirror" ]]; then
                cur="$(tag_digest "${gimg}:${t}")"
                if [[ -z "$cur" || "$cur" != "$digest" ]]; then
                  echo "  ${gimg}:${t} -> skipped (ghcr=${cur:-absent}, not this digest)"
                  continue
                fi
                echo "  ${gimg}:${t} -> ${digest} (mirror)"
              else
                echo "  ${gimg}:${t} -> ${digest} (advance)"
              fi
              printf '%s|%s|%s\n' "${gimg}" "${digest}" "${t}" >> /tmp/floating-plan.txt
              printf '%s|%s|%s\n' "${himg}" "${digest}" "${t}" >> /tmp/floating-plan.txt
            done
          }

          GB="${REGISTRY}/${BACKEND_IMAGE}";         HB="docker.io/${DOCKERHUB_BACKEND}"
          GO="${REGISTRY}/${OPENSCAP_IMAGE}";        HO="docker.io/${DOCKERHUB_OPENSCAP}"
          GS="${REGISTRY}/${SCANNER_ADAPTER_IMAGE}"; HS="docker.io/${DOCKERHUB_SCANNER_ADAPTER}"

          # ── backend + openscap: the AK-versioned floating line ─────────────
          if [[ "${ADVANCE_FLOATING}" == "true" ]]; then
            # POST-GATE PROMOTION. Which floating tags may name this version is
            # not this workflow's decision to make on its own -- it is decided
            # by whether a published GitHub Release exists for it, which only
            # happens after the gate. floating-tag-plan.sh applies that rule and
            # exits non-zero if the version has no release at all, so a promote
            # aimed at a never-released version (the v1.7.2/v1.7.5 shape) fails
            # here rather than moving `:latest`.
            echo "Post-gate floating promotion for ${PROMOTE_VERSION}."
            gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
              > /tmp/published-releases.txt
            echo "Published stable releases seen:"
            sed 's/^/    /' /tmp/published-releases.txt

            if ! .github/scripts/floating-tag-plan.sh "${PROMOTE_VERSION}" \
                  < /tmp/published-releases.txt > /tmp/allowed-floating.txt; then
              echo "::error title=Floating promotion refused::floating-tag-plan.sh refused ${PROMOTE_VERSION}; no floating tag will be moved."
              exit 1
            fi
            mapfile -t FT < /tmp/allowed-floating.txt
            if [[ "${#FT[@]}" -eq 0 ]]; then
              echo "::notice title=No floating tag advances::${PROMOTE_VERSION} is newest in neither its series nor overall; :latest and :X.Y stay where they are."
            fi
            plan "$GB" "$HB" "${BACKEND_DIGEST}"  advance ${FT[@]+"${FT[@]}"}
            plan "$GO" "$HO" "${OPENSCAP_DIGEST}" advance ${FT[@]+"${FT[@]}"}
          elif [[ -n "${PROMOTE_VERSION}" ]]; then
            # Plain promote (the documented recovery dispatch). Unchanged
            # behaviour: mirror ghcr's current floating state, move nothing.
            echo "Promote without floating advance: mirroring ghcr's current floating state only."
            plan "$GB" "$HB" "${BACKEND_DIGEST}"  mirror "${PROMOTE_VERSION%.*}" latest
            plan "$GO" "$HO" "${OPENSCAP_DIGEST}" mirror "${PROMOTE_VERSION%.*}" latest
          else
            echo "Normal build: backend/openscap floating tags are NOT applied here."
            echo "  :X.Y.Z is published and immutable; :latest and :X.Y are applied by the"
            echo "  post-gate promotion release.yml dispatches after the release gate passes."
          fi

          # ── scanner-adapter: its own independent floating line ─────────────
          # Not gate-deferred; see this job's header for why.
          if [[ -n "${PROMOTE_VERSION}" ]]; then
            plan "$GS" "$HS" "${ADAPTER_DIGEST}" mirror \
              "${ADAPTER_VERSION%.*}" "${ADAPTER_VERSION%%.*}" latest
          elif [[ "${ADAPTER_FLOATING}" == "true" ]]; then
            plan "$GS" "$HS" "${ADAPTER_DIGEST}" advance \
              "${ADAPTER_VERSION%.*}" "${ADAPTER_VERSION%%.*}" latest
          else
            echo "Scanner-adapter floating tags: not requested by this build."
          fi

          sort -u -o /tmp/floating-plan.txt /tmp/floating-plan.txt
          echo ""
          echo "Floating tag plan ($(wc -l < /tmp/floating-plan.txt) writes):"
          sed 's/^/    /' /tmp/floating-plan.txt

      # `imagetools create` re-points a tag to an EXISTING manifest-list digest.
      # It uploads no layers, produces no new manifest and therefore does not
      # change the digest -- the cosign signature and the provenance attestation
      # the merge jobs bound to that digest keep covering it. That is the whole
      # reason the promotion can be build-free and still satisfy
      # bytes-tested == bytes-published: the floating tag is an alias, not a
      # second artifact.
      - name: Apply floating tags
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/floating-plan.txt ]]; then
            echo "No floating tags to apply."
            exit 0
          fi
          while IFS='|' read -r img digest; do
            [[ -n "$img" ]] || continue
            mapfile -t tags < <(awk -F'|' -v i="$img" -v d="$digest" '$1 == i && $2 == d { print $3 }' /tmp/floating-plan.txt)
            args=(); for t in "${tags[@]}"; do args+=( -t "${img}:${t}" ); done
            echo "==> ${img}@${digest} <- ${tags[*]}"
            # Retry: a transient Docker Hub PROTOCOL_ERROR/ETIMEDOUT is what
            # leaves a release half-tagged, and re-pointing to the SAME digest
            # makes every attempt a safe no-op-or-complete.
            n=0; max=5
            until docker buildx imagetools create "${args[@]}" "${img}@${digest}"; do
              n=$((n + 1))
              if [[ "$n" -ge "$max" ]]; then
                echo "::error title=Floating tag write failed::imagetools create for ${img} failed after ${max} attempts."
                exit 1
              fi
              echo "attempt ${n}/${max} failed; retrying in $((n * 10))s..."
              sleep $((n * 10))
            done
          done < <(cut -d'|' -f1,2 /tmp/floating-plan.txt | sort -u)

      # Digest identity, asserted rather than assumed. Every tag this job wrote
      # must now resolve to the digest it was written at. A promotion that
      # rebuilt instead of re-pointing, or a registry that silently kept an old
      # manifest, fails here.
      - name: Assert every floating tag resolves to the digest it was written at
        run: |
          set -euo pipefail
          if [[ ! -s /tmp/floating-plan.txt ]]; then
            echo "Nothing written; nothing to verify."
            exit 0
          fi
          bad=0
          while IFS='|' read -r img digest tag; do
            [[ -n "$img" ]] || continue
            got=$(docker buildx imagetools inspect --format '{{json .Manifest}}' "${img}:${tag}" 2>/dev/null \
              | jq -r '.digest' 2>/dev/null || true)
            if [[ "$got" == "$digest" ]]; then
              echo "  ok  ${img}:${tag} == ${digest}"
            else
              echo "::error title=Floating tag digest mismatch::${img}:${tag} resolves to ${got:-<unresolvable>}, expected ${digest}."
              bad=1
            fi
          done < /tmp/floating-plan.txt
          exit "$bad"

      - name: Summarise
        run: |
          set -euo pipefail
          {
            echo "### Floating tags"
            echo ""
            if [[ -s /tmp/floating-plan.txt ]]; then
              while IFS='|' read -r img digest tag; do
                echo "- \`${img}:${tag}\` -> \`${digest}\`"
              done < /tmp/floating-plan.txt
            else
              echo "None applied by this run."
              if [[ -z "${PROMOTE_VERSION}" ]]; then
                echo ""
                echo "On a release tag this is expected: \`:latest\` and \`:X.Y\` are applied by the post-gate promotion that \`release.yml\` dispatches once the release gate has passed."
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ════════════════════════════════════════════════════════════════════════════
  # VERIFY-PUBLISHED: fail fast if a tag-triggered run did not actually
  # publish the expected semver tags on ghcr.io.
  #
  # Background: issue #905 was filed because operators believed semver tags
  # (1.1.7, 1.1.8) were missing on ghcr.io. The reproduction used
  # `gh api .../packages/.../versions` without `--paginate`; that endpoint
  # returns at most 30 versions per page sorted by recency, and the page is
  # dominated by sha-prefixed dev/branch tags, so semver tags get pushed off
  # the visible window. The tags were in fact present.
  #
  # To make the publish contract self-evident, this job probes the registry
  # the same way consumers do (a HEAD on the manifest endpoint) and fails
  # the workflow if any expected semver tag is missing for the current ref.
  # That way we catch the real failure mode (a push that silently no-op'd)
  # in the publish workflow itself, not days later via a broken helm install.
  # ════════════════════════════════════════════════════════════════════════════
  verify-published:
    name: Verify Published Tags
    runs-on: ubuntu-latest
    permissions:
      packages: read
    # `merge-backend-alpine` removed from `needs` while alpine builds are
    # suspended (it is `if: false` and would never report success).
    #
    # `apply-floating-tags` is in `needs` for ORDER, not for content: this job
    # probes the immutable `:X.Y.Z` identity tags only, and deliberately still
    # does. Floating tags are no longer part of what a tag push promises to
    # publish -- on a stable tag `:latest` and `:X.Y` are applied by the
    # post-gate promotion, so asserting them here would fail every cut.
    needs: [merge-backend, merge-openscap, merge-scanner-adapter, apply-floating-tags]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # Needed to read docker/scanner-adapter/VERSION — the adapter is
      # independently versioned, so its published tag is NOT the AK release tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Probe ghcr.io manifests for expected semver tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}
          OPENSCAP_IMAGE: ${{ env.OPENSCAP_IMAGE }}
          SCANNER_ADAPTER_IMAGE: ${{ env.SCANNER_ADAPTER_IMAGE }}
        run: |
          set -u
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "Verifying ghcr.io semver tags for version: ${VERSION}"

          MANIFEST_ACCEPT='-H Accept:application/vnd.oci.image.index.v1+json -H Accept:application/vnd.docker.distribution.manifest.list.v2+json -H Accept:application/vnd.docker.distribution.manifest.v2+json'

          probe_ghcr() {
            local name="$1"; local tag="$2"
            local token
            token=$(curl -sf "https://ghcr.io/token?service=ghcr.io&scope=repository:${name}:pull" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              | jq -r '.token // empty')
            [ -n "${token}" ] || return 1
            # shellcheck disable=SC2086
            curl -sfL --proto =https -o /dev/null \
              -H "Authorization: Bearer ${token}" \
              ${MANIFEST_ACCEPT} \
              "https://ghcr.io/v2/${name}/manifests/${tag}"
          }

          # Tags this workflow promises to publish on a tag push. Mirror the
          # metadata-action `tags:` blocks above. The `-alpine` variant is
          # currently suspended (its build/merge jobs are gated `if: false`),
          # so it is intentionally absent here — re-add the
          # `${BACKEND_IMAGE}:${VERSION}-alpine` entry when those jobs return.
          #
          # backend/openscap publish the AK release semver (git tag). The
          # scanner-adapter is INDEPENDENTLY versioned (source of truth:
          # docker/scanner-adapter/VERSION) and never publishes a tag at the AK
          # release version, so it must be verified at its OWN version — see
          # merge-scanner-adapter.
          EXPECTED=(
            "${BACKEND_IMAGE}:${VERSION}"
            "${OPENSCAP_IMAGE}:${VERSION}"
          )

          # merge-scanner-adapter only publishes the adapter's semver tag on
          # clean (non-prerelease) v-tags. Mirror that gate so prerelease cuts
          # don't flag a tag the publish step intentionally skipped.
          SCANNER_VERSION="$(cat docker/scanner-adapter/VERSION)"
          case "${GITHUB_REF}" in
            *-*) echo "Prerelease tag ${GITHUB_REF}; skipping scanner-adapter semver check (not published)." ;;
            *)   EXPECTED+=("${SCANNER_ADAPTER_IMAGE}:${SCANNER_VERSION}") ;;
          esac

          missing=()
          for entry in "${EXPECTED[@]}"; do
            name="${entry%:*}"
            tag="${entry#*:}"
            if probe_ghcr "${name}" "${tag}"; then
              echo "  ok  ghcr.io/${name}:${tag}"
            else
              echo "::error::ghcr.io/${name}:${tag} is missing"
              missing+=("ghcr.io/${name}:${tag}")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Tag-triggered publish completed but some expected semver tags are not present on ghcr.io. Inspect the merge-* jobs for silent imagetools failures."
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi
          echo "All expected ghcr.io semver tags present for ${VERSION}."

  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    permissions: {}
    needs: [merge-backend, merge-openscap, merge-scanner-adapter, apply-floating-tags]
    # always() would otherwise run this even when the fork guard on
    # publish-preflight skipped everything else; mirror that guard here.
    if: ${{ always() && (github.event_name != 'schedule' || github.repository == 'artifact-keeper/artifact-keeper') }}
    steps:
      # Names the images this run publishes, NOT `:latest` for each of them --
      # which is what it used to print unconditionally, on every branch build
      # and on every failed one. `:latest` is now applied by
      # `apply-floating-tags` (adapter) or by the post-gate promotion
      # (backend/openscap), and each writes its own summary section saying what
      # it actually moved.
      - name: Summary
        run: |
          echo "## Docker Images Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ghcr.io | Docker Hub |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Backend | \`${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}\` | \`docker.io/${{ env.DOCKERHUB_BACKEND }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| OpenSCAP | \`${{ env.REGISTRY }}/${{ env.OPENSCAP_IMAGE }}\` | \`docker.io/${{ env.DOCKERHUB_OPENSCAP }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Scanner Adapter | \`${{ env.REGISTRY }}/${{ env.SCANNER_ADAPTER_IMAGE }}\` | \`docker.io/${{ env.DOCKERHUB_SCANNER_ADAPTER }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "See the **Apply Floating Tags** job for which floating tags (if any) moved." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Supply Chain Security" >> $GITHUB_STEP_SUMMARY
          echo "- All images signed with [cosign](https://docs.sigstore.dev/cosign/overview/) keyless signing (GitHub OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "- Verify: \`cosign verify --certificate-oidc-issuer=https://token.actions.githubusercontent.com --certificate-identity-regexp='https://github.com/artifact-keeper/.*' ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:<version>\`" >> $GITHUB_STEP_SUMMARY
