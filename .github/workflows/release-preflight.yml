name: Release Preflight

# On-demand pre-tag readiness check (issue #3042).
#
# Run this from the Actions UI (or `gh workflow run "Release Preflight"`)
# BEFORE cutting a release/RC tag. It runs scripts/ci/release-preflight.sh,
# which asserts `main` is actually releasable so a stale main does not cost a
# full re-cut cycle (see #3039: v1.7.0-rc.1 stalled ~90 min at docker-publish's
# Security Scan because two trivy-CLI CVE suppressions were never forward-ported
# from release/1.6.x to main).
#
# This publishes NOTHING. It only reads: the repo tree, the .trivyignore of
# active release/* branches, the latest main Docker Publish run status, and
# the manifests of already-published component images (check 4, #3339).
# A red run means "do not tag yet"; a green run means main is safe to cut.

on:
  workflow_dispatch:
  # Also surface drift proactively on a schedule so a stale main is caught
  # before anyone even tries to cut. Advisory only -- never blocks a merge.
  schedule:
    - cron: '17 13 * * 1-5'  # weekday mid-morning US, after the overnight merges

permissions:
  contents: read
  actions: read
  # Check 4 reads published component manifests from ghcr.io. These packages
  # are public, so an anonymous pull token would usually do -- but "usually"
  # is not a property to depend on: if one is ever made private the probe
  # would report `indeterminate` and the preflight would exit 2 (INFRA)
  # rather than silently degrade. Read scope keeps that from happening.
  packages: read

jobs:
  preflight:
    name: Pre-tag readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          fetch-depth: 1

      # Runs first, and offline. If check 3 has regressed into a soft warn
      # again (#3308), this fails here rather than silently blessing a cut
      # below. The interesting case -- a MEASURED-RED Docker Publish -- is
      # invisible whenever main happens to be green, so it has to be tested
      # against stubs rather than waited for.
      - name: Self-test the preflight gate
        run: bash scripts/ci/test-release-preflight.sh

      - name: Run release preflight
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_REPO: ${{ github.repository }}
          # Used by check 4's registry probes. The checkout is depth-1, so the
          # commit a published tag was built from is not local; the check
          # fetches just that commit when it needs it, and reports INFRA if it
          # cannot get it rather than guessing.
          GHCR_TOKEN: ${{ github.token }}
        run: bash scripts/ci/release-preflight.sh
