name: Require E2E Proof

# Every bug-fix PR names its end-to-end proof in artifact-keeper-test, or an
# exemption with a reason (CONTRIBUTING.md, "End-to-end proof for bug fixes").
# The rules live in scripts/ci/check-e2e-proof.py; its self-test is
# scripts/ci/test-check-e2e-proof.sh (run by ci.yml).
#
# pull_request_target, like require-linked-issue.yml, so the token can copy
# the needs-e2e-test label to the linked issue on fork PRs too. Safe: each job
# checks out only scripts/ci of the DEFAULT branch, so the script that runs is
# the reviewed one on main, and the PR body is read from the event payload as
# data (the script strips HTML comments, fenced code blocks and inline code
# spans exactly as require-linked-issue.yml does). No PR code is checked out or
# run.
#
# Why the default branch and not the PR's base (#6112): pull_request_target
# runs THIS file from the default branch for PRs into every branch, so the
# script has to come from the same place. Checking out the base sha ran a
# release line's scripts/ci, and a line cut before the script existed
# (release/1.11.x until #6107) failed every PR with exit 2.
# scripts/ci/test-check-e2e-proof.sh pins these checkout refs.
#
# ADVISORY for now: while the 1.12.0 backfill lands, a missing or invalid
# proof is reported as a warning annotation and in the job summary, and the
# job still succeeds. To make it blocking, set ENFORCE below to 'true' and add
# "Require E2E proof for bug fixes" to the main and release/* rulesets'
# required status checks.
#
# The second job, "Require gate test for behaviour changes" (#6074), is
# BLOCKING: a PR labelled behaviour-change or breaking-change cites the
# artifact-keeper-test PR that moves the release gate with it, or carries a
# `Gate-Exempt: <reason>` line (CONTRIBUTING.md, "Gate tests for behaviour
# changes"). It passes on every unlabelled PR. Like the job above it reads the
# body and labels from the event payload, which is why the triggers include
# edited, labeled and unlabeled: a re-run of an old run would see the stale
# body, so fix the body or the labels instead.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: require-e2e-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  require-e2e-proof:
    name: Require E2E proof for bug fixes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENFORCE: 'false'
    steps:
      - name: Check out the default branch's scripts (never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true

      - name: Check the PR's end-to-end proof
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python3 scripts/ci/check-e2e-proof.py pr --event "$GITHUB_EVENT_PATH"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            exit 0
          fi
          if [ "$rc" -eq 1 ]; then
            msg="This bug-fix PR does not declare a valid end-to-end proof (see the job summary and CONTRIBUTING.md, \"End-to-end proof for bug fixes\")."
          else
            msg="The end-to-end proof check could not be measured (exit $rc); see the log."
          fi
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::$msg"
            exit 1
          fi
          echo "::warning::$msg Advisory: this check does not block the merge yet."

  require-gate-test:
    name: Require gate test for behaviour changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's scripts (never the PR head)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
          sparse-checkout-cone-mode: true

      - name: Check the PR's gate test
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e
          python3 scripts/ci/check-e2e-proof.py gate --event "$GITHUB_EVENT_PATH"
          rc=$?
          set -e
          if [ "$rc" -eq 1 ]; then
            echo "::error::This behaviour-change PR names no gate test update and no Gate-Exempt reason (see the job summary and CONTRIBUTING.md, \"Gate tests for behaviour changes\")."
          elif [ "$rc" -ne 0 ]; then
            echo "::error::The gate-test check could not be measured (exit $rc); see the log, then re-run the job."
          fi
          exit "$rc"
