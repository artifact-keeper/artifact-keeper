name: Sync OpenAPI Spec

# HOW THIS RUNS FOR A REAL RELEASE: release.yml DISPATCHES it on the tag once
# the GitHub Release exists, and follows the run to a verdict (#3789). The
# `release: published` trigger below cannot do that job on its own -- the
# Release is created inside release.yml with GITHUB_TOKEN, and a token-created
# event fires no workflow, so this workflow simply never ran for v1.7.8,
# v1.8.0, v1.8.1, v1.8.2 or v1.9.0 and artifact-keeper-api was stale from
# v1.7.3 onward with nothing red anywhere. The trigger is kept for a release
# created BY HAND, which does fire it.
#
# Both paths land here with the version in a different place, which is what
# `Push spec to API repo` resolves: `github.event.release.tag_name` on the
# event, the tag ref itself on the dispatch. Getting that wrong is not a
# cosmetic bug -- an unresolved version pushes the spec but tags nothing, and
# the API repo's tag is what starts SDK generation.
on:
  # A release created by hand (see the note above; a workflow-created release
  # fires nothing, so release.yml dispatches this workflow instead)
  release:
    types: [published]
  # The dispatch release.yml makes, and ad-hoc syncs
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip pushing to API repo)'
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sync-spec:
    name: Export & Sync OpenAPI Spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout backend
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Export OpenAPI spec
        env:
          SQLX_OFFLINE: true
          EXPORT_OPENAPI_SPEC: "1"
          EXPORT_OPENAPI_DIR: ${{ github.workspace }}
        run: |
          # Build the spec via test harness — no database or server needed
          cargo test --lib export_openapi_spec -- --ignored

          # Verify export succeeded
          python3 -c "import json; spec=json.load(open('openapi.json')); print(f'Paths: {len(spec[\"paths\"])}, Schemas: {len(spec.get(\"components\",{}).get(\"schemas\",{}))}')"

          # Convert to YAML
          pip3 -q install pyyaml
          python3 -c "
          import json, yaml
          with open('openapi.json') as f:
              spec = json.load(f)
          with open('openapi.yaml', 'w') as f:
              yaml.dump(spec, f, default_flow_style=False, sort_keys=False, allow_unicode=True, width=120)
          "

          echo "## Exported spec summary" >> $GITHUB_STEP_SUMMARY
          echo "- Paths: $(python3 -c "import json; print(len(json.load(open('openapi.json'))['paths']))")" >> $GITHUB_STEP_SUMMARY
          echo "- Schemas: $(python3 -c "import json; print(len(json.load(open('openapi.json')).get('components',{}).get('schemas',{})))")" >> $GITHUB_STEP_SUMMARY

      - name: Upload spec artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: openapi-spec
          path: |
            openapi.json
            openapi.yaml

      # `inputs.dry_run != true` rather than `!inputs.dry_run`: this step is the
      # whole point of the run, and the negation form skips it for ANY truthy
      # value -- including the string "false", which is what a dispatch would
      # carry if the input ever arrived untyped. Skipping here is silent and
      # leaves the run green, which is the exact failure shape #3789 is about.
      # `inputs` is null on the `release` event, and `null != true` is true.
      - name: Push spec to API repo
        if: ${{ inputs.dry_run != true }}
        env:
          DEPLOY_KEY: ${{ secrets.API_REPO_DEPLOY_KEY }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # On the `release` event the version is on the event; on the dispatch
          # release.yml makes (#3789) there is no event payload and the ref IS
          # the tag. Falling through to "manual" on a tag dispatch would push
          # the spec and tag nothing, so the API repo would carry the new spec
          # under no version and no SDK would be generated -- a silent half of
          # the very bug this dispatch exists to fix.
          VERSION="${RELEASE_TAG:-}"
          if [ -z "$VERSION" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          fi
          VERSION="${VERSION:-manual}"
          echo "Syncing the spec for ${VERSION} (event: ${GITHUB_EVENT_NAME})"

          # Set up SSH deploy key
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/api-repo-deploy
          chmod 600 ~/.ssh/api-repo-deploy
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/api-repo-deploy -o IdentitiesOnly=yes"

          git clone git@github.com:artifact-keeper/artifact-keeper-api.git /tmp/api-repo

          cp openapi.json /tmp/api-repo/openapi.json
          cp openapi.yaml /tmp/api-repo/openapi.yaml

          cd /tmp/api-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No spec changes detected"
          else
            git add openapi.json openapi.yaml
            git commit -m "chore: sync OpenAPI spec from backend ${VERSION}"
            git push origin main
          fi

          # Tag with the same version as the backend release.
          # This triggers the generate.yml workflow which publishes SDKs
          # with a matching version, keeping backend + SDKs in lockstep.
          if [ "$VERSION" != "manual" ]; then
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "Tagged API repo with ${VERSION} — SDK generation will start automatically"
            echo "- **Tagged:** \`${VERSION}\` → SDK generation triggered" >> $GITHUB_STEP_SUMMARY
          fi

          # Clean up key
          rm -f ~/.ssh/api-repo-deploy
