name: Docker Publish Watchdog

# ══════════════════════════════════════════════════════════════════════════════
# A DOCKER PUBLISH RUN THAT NEVER GETS A RUNNER MUST NOT SIT THERE  (#6080)
#
# A run that stays `queued` -- not one job started, so not even the
# GitHub-hosted publish-preflight got a runner -- holds its concurrency
# group's running slot, and every later run in that group sits `pending`
# with zero jobs (main@ea9425b6 sat 75 minutes; the next commits' images, and
# a Release Candidate waiting on them, went nowhere). Nothing reported it.
#
# It cancels each Docker Publish run that is still queued with no runner
# after 30 minutes (scripts/ci/find-stale-docker-publish-runs.sh says exactly
# what counts), and goes RED naming each one, so a stuck run is a red run in
# the Actions list rather than something somebody has to notice.
#
# A RUN THAT HAS STARTED CAN HOLD THE GROUP TOO  (#6289)
#
# Run 44495887855 (main@361dcf82) was `in_progress` for ~6 h: every job done
# but `Backend (linux/amd64)`, waiting in the one-slot ak-beefy-runners queue.
# Main pushes coalesce (#6264), so it held main's group and three newer pushes
# were replaced while `:main` stood still. The watchdog now also reads the
# JOBS of every started run: a job queued with no runner for 45 minutes, or a
# run older than 4 hours, makes it RED. It CANCELS such a run only when that
# loses nothing: attempt 1 of a main push, nothing mid-build, a newer main
# push waiting to replace it, no Release Candidate in flight, and no earlier
# started main run cancelled since main last completed one (#6297: one
# cancel per advance, so a saturated pool cannot starve `:main`). Tags,
# dispatches (a promote, a candidate's build), the schedule, release/** and
# re-runs are reported, never cancelled. 45 minutes: an idle pool picks a job
# up in under a minute, and one amd64 build is ~50-70 minutes, so a 45-minute
# wait means most of a build has gone through ahead of it (the watchdog runs
# every 15 minutes, so it acts at 45-60).
#
# WHEN IT RUNS. The schedule alone is not enough: GitHub fired the
# 15-minute cron 8 times in 3 days (2026-11-17..19, gaps of 6-9 h), so the
# 6-hour stall went unseen. It also runs whenever a Docker Publish run is
# requested or completes -- exactly when a newer main push starts waiting
# behind a stuck run -- which costs one short ubuntu-latest job per event.
#
# Re-run a cancelled run by hand once the runner problem is fixed
# (`gh run rerun <id>`: the same push run, so the same signing identity and
# provenance); a Release Candidate that was waiting on it re-runs it itself.
# ══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  # Event-driven as well (#6289): the schedule above fires hours apart in
  # practice. workflow_run runs this file from the default branch and checks
  # out the default branch's scripts, never the triggering run's code.
  workflow_run:
    workflows: [Docker Publish]
    types: [requested, completed]
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: 'Minutes a run may stay queued with no runner before it counts as stale.'
        required: false
        default: '30'
      stuck_job_minutes:
        description: 'Minutes one job of a started run may wait for a runner before the run counts as stuck (#6289).'
        required: false
        default: '45'
      stuck_run_minutes:
        description: 'Minutes a started run may run before it counts as stuck, whatever its jobs do (#6289).'
        required: false
        default: '240'
      dry_run:
        description: 'Report stale and stuck runs without cancelling any.'
        required: false
        type: boolean
        default: false

permissions: {}

# NOT cancel-in-progress (#6289). The watchdog starts on Docker Publish
# workflow_run events, and its own cancel ends a Docker Publish run, which
# starts another watchdog. Cancelling the sweep in progress would kill it
# while it writes its summary and ::error lines: the run would read
# "cancelled", not red, and the next sweep finds nothing, so a cancel would go
# unreported. A newer sweep waits instead; the group still replaces older
# waiting ones, so at most one waits.
concurrency:
  group: docker-publish-watchdog
  cancel-in-progress: false

jobs:
  sweep:
    name: Cancel Docker Publish runs stuck waiting for a runner
    if: ${{ github.repository == 'artifact-keeper/artifact-keeper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write   # cancel the stale and stuck runs
    steps:
      - name: Checkout the tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci

      - name: Find and cancel stale and stuck runs
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_MINUTES: ${{ inputs.stale_minutes || '30' }}
          STUCK_JOB_MINUTES: ${{ inputs.stuck_job_minutes || '45' }}
          STUCK_RUN_MINUTES: ${{ inputs.stuck_run_minutes || '240' }}
          STALE_ACTION: ${{ format('{0}', inputs.dry_run) == 'true' && 'report' || 'cancel' }}
        run: |
          set -uo pipefail
          rc=0
          out="$(bash scripts/ci/find-stale-docker-publish-runs.sh)" || rc=$?
          case "$rc" in
            0)
              echo "No Docker Publish run has been queued with no runner for ${STALE_MINUTES}m, has a job waiting for a runner for ${STUCK_JOB_MINUTES}m, or is older than ${STUCK_RUN_MINUTES}m." ;;
            1)
              {
                echo "### Stale or stuck Docker Publish runs"
                echo
                echo "Action: ${STALE_ACTION}. \`stale\`: queued ${STALE_MINUTES}m+ with no job started. \`stuck\`: started, with a job waiting ${STUCK_JOB_MINUTES}m+ for a runner or ${STUCK_RUN_MINUTES}m+ old; \`hold=\` says why it was not cancelled (only a superseded main push with nothing mid-build is, at most one per completed main run)."
                echo
                echo '```'
                echo "$out"
                echo '```'
                echo
                echo "Fix the runner problem, then re-run any run that is still needed: \`gh run rerun <id>\`."
              } >> "$GITHUB_STEP_SUMMARY"
              while read -r line; do
                [[ -z "$line" ]] && continue
                echo "::error title=Docker Publish run stuck waiting for a runner::${line}"
              done <<< "$out"
              exit 1 ;;
            *)
              echo "::error title=Watchdog could not read the runs::find-stale-docker-publish-runs.sh exited ${rc}; indeterminate, not a verdict."
              exit 1 ;;
          esac
