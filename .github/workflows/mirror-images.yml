name: Mirror Docker Hub Images

on:
  schedule:
    # Every Monday at 4 AM UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    name: Mirror ${{ matrix.image }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: postgres:18-alpine
            target: ghcr.io/artifact-keeper/ci-mirror/postgres:18-alpine
          - image: alpine:3.24
            target: ghcr.io/artifact-keeper/ci-mirror/alpine:3.24
          - image: python:3.14-slim
            target: ghcr.io/artifact-keeper/ci-mirror/python:3.14-slim
          - image: node:26-slim
            target: ghcr.io/artifact-keeper/ci-mirror/node:26-slim
          - image: rust:1.98-slim
            target: ghcr.io/artifact-keeper/ci-mirror/rust:1.98-slim
          # MinIO pulled its community images from Docker Hub (`docker.io/minio/mc`
          # and `docker.io/minio/minio` now 404 with "repository does not exist"),
          # so the concurrency E2E stack is mirrored from quay.io, which still
          # publishes them (#3949). Pinned to a RELEASE tag, never `latest`.
          - image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
            target: ghcr.io/artifact-keeper/ci-mirror/mc:RELEASE.2025-08-13T08-35-41Z
          - image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
            target: ghcr.io/artifact-keeper/ci-mirror/minio:RELEASE.2025-09-07T16-13-09Z

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image to GHCR (preserve multi-arch manifest)
        # `buildx imagetools create` copies the full OCI index — every platform
        # manifest the upstream image publishes — without re-pulling layers per
        # platform. This is required so downstream multi-arch builds
        # (e.g. docker-publish.yml builds linux/amd64 + linux/arm64) can resolve
        # the correct arch manifest from the mirror.
        run: |
          docker buildx imagetools create \
            --tag ${{ matrix.target }} \
            ${{ matrix.image }}
