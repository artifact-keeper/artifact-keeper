name: Release Candidate

# ══════════════════════════════════════════════════════════════════════════════
# GATE A COMMIT, NOT A TAG  (issues #3771, #3773; epic #3769)
#
# Until now the immutable git tag was what started the testing, and everything
# downstream of the tag push is irreversible: the tag itself (ruleset
# 19144026), the `:X.Y.Z` image tags, and for a while the adapter's `:latest`.
# The release gate therefore ran against bytes that already carried permanent
# names, so a gate failure burned a version number. `vX.Y.Z-rc.N` was advice,
# not enforcement, and it never exercised the stable-only checks. 1.9.0 hit
# every edge at once (#3769); v1.7.2 died the same way; v1.7.0 took four
# candidates.
#
# This workflow inverts the order. It takes a COMMIT (default: the tip of
# main), refuses it unless it is releasable, reuses the `sha-<sha>` images
# Docker Publish already built for it (nothing is rebuilt), runs the SAME
# reusable Release Gate release.yml runs, with the same inputs, and on green
# records a CERTIFICATION keyed by the commit. Nothing here has a permanent
# name: no tag exists, `:X.Y.Z` does not exist, `:latest` does not move. A red
# candidate costs nothing but time; recovery is "fix, then a new candidate".
#
# THE CERTIFICATION (the carrier, and why this one)
#   A signed attestation (`actions/attest`, Sigstore keyless via GitHub OIDC)
#   on EACH image's manifest-list digest, with a predicate naming the commit,
#   the version, this run, and every digest. It is verified by
#   `scripts/ci/assert-candidate-certified.sh` with `gh attestation verify`
#   pinned to THIS workflow file as the signer, the way release.yml pins
#   release provenance (#3558). It was chosen over a workflow artifact plus a
#   commit status because:
#     * its subject IS the bytes. It is bound to the digest, so a re-pushed
#       image under the same sha tag has no certification, and nothing has to
#       trust an artifact's word about which digest it meant;
#     * it cannot be forged by anything short of this workflow's OIDC identity
#       in this repository. A commit status needs `statuses: write`, an
#       artifact needs `actions: write` in any workflow; both are weaker than
#       the claim "the gate passed on these bytes";
#     * the repository already produces and verifies attestations for every
#       image and every release binary, so the tooling, the pins and the
#       failure vocabulary (BLOCKED vs INFRA) are the ones already in use.
#   A `release-candidate-<sha>` artifact and a `release-candidate/certified`
#   commit status are ALSO written, for humans and for the commit page; the
#   release path does not trust them.
#
# WHAT CONSUMES IT
#   release-promote.yml verifies the certification for the commit, re-applies
#   `:X.Y.Z` to the certified digests through Docker Publish's PROMOTE mode,
#   creates the annotated git tag LAST, and hands over to release.yml on the
#   tag ref. Every stable tag is created there, with GITHUB_TOKEN, which
#   fires no push event -- so a `push` of a stable tag is by construction a
#   hand push, and release.yml and docker-publish.yml refuse it outright
#   before building anything; the dispatches the promote makes verify the
#   certification instead. A hand-pushed tag can never skip the gate again
#   (#3772).
#
#   The verifier pins the certification to the EXACT signing identity of
#   this workflow file on `refs/heads/main` -- the certificate's SAN,
#   `--cert-identity ...release-candidate.yml@refs/heads/main`, compared
#   byte-for-byte -- not just to its path (`--signer-workflow` carries no
#   ref) and not only to the ref extension (`--source-ref` is compared
#   case-insensitively by gh, so `Main` would pass it; it is kept as a
#   second check). A copy of this file on any other branch has the same
#   workflow path and could otherwise certify main's images with the gate
#   edited out. `resolve` also refuses, case-sensitively, any dispatch ref
#   but main.
#
# PATCH RELEASES FROM `release/X.Y.x` (1.9.1 and after)
#   A patch release is cut from its maintenance branch -- but this workflow
#   is STILL DISPATCHED ON MAIN and certifies the branch's commit from
#   there. The signing identity therefore never widens: main's copy of this
#   file remains the only thing that can produce an accepted certification,
#   and a copy on any other branch -- including a `release/*` branch an
#   attacker managed to create -- signs with an identity nothing accepts.
#   That was the alternative to widening the pin to
#   `@refs/heads/release/1.9.x`, and it is strictly stronger: the attack of
#   creating a `release/*` ref, putting an edited copy of this file on it and
#   satisfying an exact pin does not exist, rather than being mitigated.
#
#   Nothing here relies on the dispatched ref for that to work, and -- since
#   the r1 review -- nothing runs the certified commit's code either: EVERY
#   checkout in this file is `refs/heads/main`, and the commit enters only as
#   named data. The reusable gate is an absolute cross-repository reference
#   (`artifact-keeper-test/...@main`) that takes the images by digest, so it
#   tests the maintenance commit's bytes whoever calls it.
#
#   WHICH COMMITS main may certify is then a second, independent control:
#   scripts/ci/resolve-certified-ref.sh derives the line a commit belongs to
#   from repository state alone and never from a dispatch input -- an
#   ancestor of `main`, failing that an ancestor of
#   `refs/heads/release/<X>.<Y>.x` with X.Y read from `Cargo.toml` AT THAT
#   COMMIT. The predicate records the resolved line as `certified_ref`, which
#   the verifier checks against the same derivation. See RELEASING.md, "Patch
#   releases from a `release/X.Y.x` branch".
#
#   THE COPY OF THIS FILE ON A RELEASE BRANCH IS INERT (#6122). Nothing runs
#   it: the dispatch guard is main-only, every checkout is main, and only
#   main's identity is accepted. Its blob is recorded in the predicate
#   (`certified_workflow_blob`) and no longer has to match main's copy, so
#   an edit to this file on main needs NO backport to any release/X.Y.x.
#   (Until #6122 it had to be byte-identical to main's current copy, a
#   demand that protected nothing that runs and refused every maintenance
#   candidate after each main edit until someone backported it by hand.)
#
# PARITY (#3773). Every check that used to run only on a clean `refs/tags/v*`
# ref, or was skipped for prereleases, runs here against the same inputs:
# release bookkeeping, the CHANGELOG entry, the curated notes file, the
# preflight evidence, the exact-tag digest guard for backend and openscap on
# both registries, the scanner-adapter exact-version decision on both
# registries, and the adoption gate (the published image's revision must be
# this commit). See the `images` and `bookkeeping` jobs.
#
# RE-RUNS (#3774). "Re-run failed jobs" on a failed gate cannot work: the
# gate's `deploy` job is not re-executed -- GitHub replays its first-attempt
# outputs -- so every suite targets a namespace the first attempt's teardown
# already deleted and dies on "backend not ready". The gate job therefore
# runs on attempt 1 only, and `gate-rerun-refused` says so in red rather than
# letting an hour of suites fail for a reason nobody can see.
#
# RERUN OF THE FAILED GROUPS (#6076). The supported recovery for a flake is a
# NEW dispatch with `rerun_of=<the failed candidate's run id>`, a `reason`, and
# the same `sha`. It is a fresh run in every respect -- resolve, publish,
# preflight, bookkeeping, images, all re-checked -- except that the gate runs
# only the jobs and dtf-gate legs the original did not pass (the gate's
# `only_jobs`, artifact-keeper-test#830), and certifies only when:
#   * the original is a failed attempt-1 dispatch of this file on main, under
#     RERUN_MAX_AGE_HOURS old, whose pre-gate jobs all succeeded, which was
#     not itself a rerun, and which no earlier dispatch has rerun: at most ONE
#     rerun per candidate, whatever that rerun's conclusion
#     (scripts/ci/resolve-candidate-rerun.sh);
#   * the commit, the three certified digests, the adapter decision, the
#     version, the line and this file's blob are the ones the original tested
#     (`record`; any difference refuses before the gate);
#   * the tests are the original's: `tests=same` pins the original's tests
#     commit and refuses if release-gate.yml changed. `tests=moved` accepts a
#     newer test tree (a merged test-only fix) and records that it moved;
#   * every gate job or leg of the rerun also ran in the original (`certify`,
#     coverage), so the union of the original's green and the rerun's green is
#     the whole gate.
# The certification then lists both runs, the reason and both actors. Every
# job here is still attempt-1-only; a rerun is never `gh run rerun`.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit to certify: a full 40-hex sha on main, or on the release/X.Y.x branch this is dispatched on. Empty = the tip of the dispatched ref.'
        required: false
        type: string
        default: ''
      # Rerun of the failed gate groups of an earlier candidate (#6076). Empty
      # (the default) is a full candidate. See RELEASING.md, "Rerunning the
      # failed gate groups", for when this is allowed.
      rerun_of:
        description: 'Rerun only the failed gate groups of this earlier Release Candidate run (its run id). Needs sha (the same commit) and reason. Empty = a full candidate.'
        required: false
        type: string
        default: ''
      reason:
        description: 'Required with rerun_of: why the failed groups may be rerun rather than a fresh candidate (recorded in the certification).'
        required: false
        type: string
        default: ''
      tests:
        description: 'With rerun_of: same = the original run''s artifact-keeper-test commit (refused if release-gate.yml changed); moved = the current one (a merged test-only fix; recorded).'
        required: false
        type: choice
        options:
          - same
          - moved
        default: same

permissions: {}

# One candidate per commit at a time, never cancelled: a cancelled gate leaves
# a namespace behind, and two concurrent candidates for the same commit would
# race to certify it twice.
concurrency:
  group: release-candidate-${{ inputs.sha || 'main' }}
  cancel-in-progress: false

env:
  # The in-toto predicate type of the certification. Read back, pinned, by
  # scripts/ci/assert-candidate-certified.sh (its default must match).
  CERT_PREDICATE_TYPE: https://github.com/artifact-keeper/artifact-keeper/attestations/release-candidate/v1
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend
  OPENSCAP_IMAGE: ghcr.io/${{ github.repository }}-openscap
  ADAPTER_IMAGE: ghcr.io/${{ github.repository }}-scanner-adapter
  # How old the original run may be for a rerun of its failed gate groups
  # (#6076). The gate's chart (iac@main), web image (:latest) and runners are
  # not pinned between runs, so the union of two runs' results is only
  # meaningful while they are close together.
  RERUN_MAX_AGE_HOURS: '72'
  # The caller's gate job name. resolve-candidate-rerun.sh finds the gate's
  # jobs by it ("<this> / <gate job>"): keep it in step with `release-gate`.
  GATE_JOB_NAME: Release Gate (Full Suite)

jobs:
  # ── which commit, which version ──────────────────────────────────────────────
  resolve:
    name: Resolve the commit and its version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read    # a rerun reads its original run (#6076)
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short: ${{ steps.resolve.outputs.short }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      certified_ref: ${{ steps.resolve.outputs.certified_ref }}
      certified_branch: ${{ steps.resolve.outputs.certified_branch }}
      workflow_blob: ${{ steps.resolve.outputs.workflow_blob }}
      candidate_workflow_blob: ${{ steps.resolve.outputs.candidate_workflow_blob }}
      # Rerun (#6076): all empty for a full candidate.
      rerun_of: ${{ steps.rerun_inputs.outputs.rerun_of }}
      rerun_reason: ${{ steps.rerun_inputs.outputs.reason }}
      rerun_tests: ${{ steps.rerun_inputs.outputs.tests }}
      rerun_jobs: ${{ steps.rerun.outputs.rerun_jobs }}
      rerun_pin_tests_sha: ${{ steps.rerun.outputs.pin_tests_sha }}
      rerun_gate_changed: ${{ steps.rerun.outputs.gate_changed }}
      original_actor: ${{ steps.rerun.outputs.original_actor }}
      original_created_at: ${{ steps.rerun.outputs.original_created_at }}
      original_gate_sha: ${{ steps.rerun.outputs.original_gate_sha }}
      original_record: ${{ steps.rerun.outputs.original_record }}
    steps:
      # The certification is only valid when this workflow ran on main (the
      # verifier pins the exact signing identity
      # `...release-candidate.yml@refs/heads/main`); a run from any other
      # ref would spend an hour of gate to produce a certification nothing
      # accepts, or -- the case that matters -- run an edited copy of this
      # file. Refused first, before anything is read. In the SHELL, not in an
      # `if:` expression: Actions expressions compare strings
      # case-insensitively, and a branch named `Main` is a different ref.
      # A maintenance release does NOT relax this: a release/X.Y.x commit is
      # certified from main too, which is why the identity never widens.
      - name: Refuse a dispatch that is not on main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error title=Not dispatched on main::Release Candidate was dispatched on ${GITHUB_REF}. It certifies commits from main -- including commits on a release/X.Y.x maintenance branch -- and its certification is only accepted when the workflow itself ran on main (scripts/ci/assert-candidate-certified.sh pins the signing identity to release-candidate.yml@refs/heads/main). Dispatch it with --ref main; pick the commit with -f sha=<40-hex>."
            exit 1
          fi
          echo "Dispatched on ${GITHUB_REF}."

      # A rerun (#6076) needs the commit spelled out and a reason; the rerun
      # knobs without rerun_of are refused rather than ignored. The reason is
      # free text that lands in a signed predicate: one line, printable, 10 to
      # 300 characters, passed only through env and jq --arg.
      - name: Check the rerun inputs
        id: rerun_inputs
        env:
          RERUN_OF: ${{ inputs.rerun_of }}
          REASON: ${{ inputs.reason }}
          TESTS: ${{ inputs.tests }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$RERUN_OF" ]]; then
            if [[ -n "$REASON" || "${TESTS:-same}" != same ]]; then
              echo "::error title=Rerun inputs without rerun_of::reason and tests=moved only apply to a rerun of the failed gate groups (rerun_of=<run id>). A full candidate takes neither."
              exit 1
            fi
            echo "Full candidate."
            exit 0
          fi
          if [[ ! "$RERUN_OF" =~ ^[0-9]{1,20}$ ]]; then
            echo "::error title=Bad rerun_of::rerun_of must be the run id of the failed Release Candidate (digits)."
            exit 1
          fi
          if [[ -z "$INPUT_SHA" ]]; then
            echo "::error title=Rerun needs the sha::A rerun certifies the same commit as its original: pass it as -f sha=<40-hex>, not the tip of main."
            exit 1
          fi
          if [[ ${#REASON} -lt 10 || ${#REASON} -gt 300 || "$REASON" =~ [[:cntrl:]] ]]; then
            echo "::error title=Rerun needs a reason::reason is required with rerun_of: one line of 10 to 300 printable characters saying why the failed groups may be rerun (for example the flake and its issue). It is recorded in the certification."
            exit 1
          fi
          {
            echo "rerun_of=${RERUN_OF}"
            echo "reason=${REASON}"
            echo "tests=${TESTS}"
          } >> "$GITHUB_OUTPUT"
          echo "Rerun of run ${RERUN_OF} (tests=${TESTS}) by ${GITHUB_TRIGGERING_ACTOR}: ${REASON}"

      # Always main, never anything else: this workflow runs main's tooling
      # and signs with main's identity whatever line the commit is on. The
      # maintenance lines are fetched as remote-tracking refs so
      # `git show <sha>:<path>` can reach a commit on one of them and the
      # resolver's answer can be re-checked against the same objects.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Fetch the maintenance lines
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'

      # The version is READ FROM Cargo.toml at the commit, never typed. A
      # free-text version input is exactly what release.yml removed: it let
      # the version being released drift from the ref being tested.
      - name: Resolve
        id: resolve
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${INPUT_SHA:-}"
          if [[ -z "$SHA" ]]; then
            SHA="$(git rev-parse HEAD)"
            echo "No sha given; certifying the tip of main: ${SHA}"
          fi
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Not a full sha::'${SHA}' is not a 40-character commit sha. Short shas and branch names are refused so the certification names exactly one tree."
            exit 1
          fi
          if ! git cat-file -e "${SHA}^{commit}" 2>/dev/null; then
            echo "::error title=Unknown commit::${SHA} is not a commit in this repository."
            exit 1
          fi
          # WHICH LINE this commit belongs to. Not an identity question --
          # the identity is main's, always -- but the constraint on WHICH
          # commits main may certify: an ancestor of main, else of the
          # release/X.Y.x its own Cargo.toml names. Derived by the one
          # resolver every consumer uses, from repository state and never
          # from a dispatch input. It also reports the blob of this file at
          # the certified commit, which the signed predicate records; it is
          # not compared with main's copy, because that copy never runs
          # here (#6122).
          rc=0
          resolved="$(GITHUB_OUTPUT='' scripts/ci/resolve-certified-ref.sh "$SHA")" || rc=$?
          if [[ "$rc" -ne 0 ]]; then
            echo "::error title=Commit cannot be certified::${SHA} is on neither main nor the maintenance line its Cargo.toml names (resolver exit ${rc}; its message is above)."
            exit 1
          fi
          CERTIFIED_REF="$(sed -n 's/^certified_ref=//p' <<<"$resolved" | head -1)"
          VERSION="$(sed -n 's/^version=//p' <<<"$resolved" | head -1)"
          WORKFLOW_BLOB="$(sed -n 's/^workflow_blob=//p' <<<"$resolved" | head -1)"

          # The resolver read the repository over the API; this is the same
          # question asked of the objects in this checkout. They agree or
          # nothing is certified.
          if ! git merge-base --is-ancestor "$SHA" "refs/remotes/origin/${CERTIFIED_REF#refs/heads/}"; then
            echo "::error title=Ancestry disagreement::${SHA} resolves to ${CERTIFIED_REF} over the API but is not reachable from origin/${CERTIFIED_REF#refs/heads/} in this checkout. Failing closed."
            exit 1
          fi
          # Information only (#6122): a maintenance line's copy of this file
          # lags main's after any main edit. It is never executed, so that is
          # expected and nothing has to be backported.
          # The copy RUNNING here is the one at GITHUB_WORKFLOW_SHA, not main's
          # checked-out tip, which can be newer if main moved after dispatch.
          # Recorded for a later rerun of the failed groups to compare (#6076):
          # a rerun under a different candidate workflow is refused.
          RUNNING_BLOB="$(git rev-parse "${GITHUB_WORKFLOW_SHA}:.github/workflows/release-candidate.yml")"
          if [[ "$CERTIFIED_REF" != "refs/heads/main" && "$WORKFLOW_BLOB" != "$RUNNING_BLOB" ]]; then
            echo "::notice title=Release-branch copy of release-candidate.yml differs from main's::${CERTIFIED_REF#refs/heads/} carries blob ${WORKFLOW_BLOB:0:12}; main's copy running here is ${RUNNING_BLOB:0:12}. Expected and inert: that copy never runs, and its blob is only recorded in the certification (#6122)."
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Not a stable version::Cargo.toml at ${SHA} says '${VERSION:-<none>}'. A candidate certifies a stable X.Y.Z (land the release prep first); prereleases keep the -rc.N tag path."
            exit 1
          fi
          # DISPATCH READINESS, before anything is dispatched or named. The
          # promote runs `gh workflow run release.yml --ref vX.Y.Z` and
          # `docker-publish.yml --ref vX.Y.Z -f promote_version=`, i.e. the
          # workflow FILES AT THIS COMMIT; a commit whose release.yml has no
          # workflow_dispatch trigger would get its immutable tag and then a
          # 422 -- the dead-tag shape. This workflow also runs scripts/ci at
          # the commit. Refused here, and again by the promote before the tag.
          need() { # <path> <pattern> <what>
            # Read the whole blob first: `git show | grep -q` under pipefail
            # fails on a MATCH in a long file (grep exits early, git show
            # takes SIGPIPE, the pipeline is non-zero) and read as "lacks".
            local blob
            blob="$(git show "${SHA}:$1" 2>/dev/null || true)"
            if ! grep -qE -- "$2" <<<"$blob"; then
              echo "::error title=Commit cannot be released by this flow::${SHA} has no $3 ($1 at that commit lacks '$2'). The promote dispatches the workflows at the released commit, so tagging it would leave a tag nothing can run on. Certify a commit that carries the candidate-then-promote flow (#3771)."
              exit 1
            fi
          }
          need .github/workflows/release.yml        '^[[:space:]]*workflow_dispatch:' 'dispatchable release.yml'
          need .github/workflows/docker-publish.yml '^[[:space:]]*promote_version:'   'promotable docker-publish.yml'
          # release.yml dispatches this one after publishing the Release and
          # fails if it never concludes (#3789), so a commit whose copy cannot
          # be dispatched turns into a red release run AFTER the release is
          # public. Cheaper to refuse it here.
          need .github/workflows/sync-openapi-spec.yml '^[[:space:]]*workflow_dispatch:' 'dispatchable sync-openapi-spec.yml'
          need scripts/ci/follow-dispatched-run.sh  '.'                               'scripts/ci/follow-dispatched-run.sh'
          need scripts/ci/assert-candidate-certified.sh '.'                           'scripts/ci/assert-candidate-certified.sh'
          need scripts/ci/resolve-certified-ref.sh  '.'                               'scripts/ci/resolve-certified-ref.sh'
          echo "Candidate: ${VERSION} at ${SHA} on ${CERTIFIED_REF} ($(git log -1 --format='%s' "$SHA"))"
          {
            echo "sha=${SHA}"
            echo "short=${SHA:0:7}"
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
            echo "certified_ref=${CERTIFIED_REF}"
            echo "certified_branch=${CERTIFIED_REF#refs/heads/}"
            echo "workflow_blob=${WORKFLOW_BLOB}"
            echo "candidate_workflow_blob=${RUNNING_BLOB}"
          } >> "$GITHUB_OUTPUT"

      # Which gate jobs the rerun runs, and whether it may run at all: read
      # from the original run through the API (scripts/ci/resolve-candidate-rerun.sh,
      # main's copy; nothing from the certified commit runs here).
      - name: Resolve the rerun from its original run
        id: rerun
        if: ${{ steps.rerun_inputs.outputs.rerun_of != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN_REPO: ${{ github.repository }}
          RERUN_OF: ${{ steps.rerun_inputs.outputs.rerun_of }}
          RERUN_SHA: ${{ steps.resolve.outputs.sha }}
          RERUN_TESTS: ${{ steps.rerun_inputs.outputs.tests }}
          RERUN_SELF_RUN_ID: ${{ github.run_id }}
          RERUN_GATE_JOB: ${{ env.GATE_JOB_NAME }}
        run: |
          set -euo pipefail
          rc=0
          bash scripts/ci/resolve-candidate-rerun.sh resolve > "$RUNNER_TEMP/rerun.txt" || rc=$?
          grep -v '^original_record=' "$RUNNER_TEMP/rerun.txt" || true
          exit "$rc"

  # ── warm the CLI binary build caches (#4927) ────────────────────────────────
  # release.yml builds the CLI binaries on the tag ref, which cannot read a
  # cache saved by an earlier tag, so every release compiled them cold (an
  # hour on the macOS legs). This dispatches release-cli-caches.yml on main,
  # which builds main's tip for the same five targets with the same rust-cache
  # key and saves the caches in main's scope, where the tag run restores them.
  # It is a separate workflow because a cargo build runs the tree's build
  # scripts, and this workflow runs no such code (see "What runs from the
  # certified commit" in RELEASING.md). The candidate's commit is not passed
  # on: nobody gets to choose what executes in a run that writes main's caches
  # (see that file's header). The key follows the lockfile, not the commit, so
  # main's tip serves any candidate with the same dependencies. This job only
  # DISPATCHES: nothing here waits for the build, nothing needs this job, and
  # `continue-on-error` keeps a failed dispatch from failing the candidate. A
  # missing cache costs build time at the tag, not correctness.
  warm-cli-caches:
    name: Dispatch the CLI build cache warm-up
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write   # gh workflow run
    steps:
      - name: Dispatch release-cli-caches.yml on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run release-cli-caches.yml --repo "${GITHUB_REPOSITORY}" --ref main
          echo "Dispatched Release CLI Caches on main's tip for candidate ${SHA}. Let it finish before the promote, or the tag run builds cold."

  # ── Docker Publish must be green before anything reads its result ──────────
  # Its own job, ahead of BOTH consumers (#4372). `preflight` used to start
  # beside the wait, which lived inside `images`, and preflight check 3
  # ("Docker Publish for the exact commit cleanly published its manifest")
  # reads the same run: dispatched while the images were still building, the
  # preflight fails on "Docker Publish for HEAD is still 'pending'" (Release
  # Preflight run 38989584850, 2026-10-17), and the candidate with it (run
  # 36862392025 for v1.10.2), which then has to be dispatched again for no
  # reason. Now both `preflight` and `images` need
  # this job, so the preflight is only dispatched once Docker Publish has
  # succeeded for the commit. Nothing about WHAT is certified changes: the
  # same run is selected the same way, the same preflight must go green, and
  # the run id still reaches the certification record through `images`.
  publish:
    name: Wait for a successful Docker Publish run
    needs: resolve
    runs-on: ubuntu-latest
    # Docker Publish for a fresh main commit can take 60-90 minutes on a cold
    # cache (see resolve-candidate-digest in release.yml); this follows it.
    timeout-minutes: 130
    permissions:
      contents: read
      actions: read
    outputs:
      run_id: ${{ steps.publish.outputs.run_id }}
    steps:
      # CODE FROM MAIN (adversarial review, finding 1): the resolver is main's
      # copy, and it reads nothing but the API.
      - name: Checkout main's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: scripts/ci

      # The same selection release.yml makes for a tag, keyed on the branch
      # the commit is on: a SUCCESSFUL Docker Publish run for this exact
      # commit on that branch. docker-publish.yml runs on `release/**` pushes
      # too, so a maintenance commit has its own `sha-<sha>` images. Nothing
      # is rebuilt; a commit that has no run cannot be certified, and says so.
      # Since #3629 that is a narrower set than "a docs-only tip": CHANGELOG.md,
      # the changes/** fragments and .github/release-notes/** build, because a
      # cut ends on one of them.
      - name: Wait for a successful Docker Publish run for this commit
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          BRANCH: ${{ needs.resolve.outputs.certified_branch }}
        run: |
          set -euo pipefail
          APPEAR_DEADLINE=$(($(date +%s) + 15*60))
          while true; do
            rc=0; out=""
            out="$(RESOLVE_REPO="${GITHUB_REPOSITORY}" RESOLVE_SHA="${SHA}" RESOLVE_REF="${BRANCH}" \
              bash scripts/ci/resolve-candidate-publish-run.sh)" || rc=$?
            case "$rc" in
              0)
                echo "  ${out}"
                echo "run_id=${out#*run_id=}" >> "$GITHUB_OUTPUT"
                break ;;
              10)
                echo "  Docker Publish for ${SHA} is still running; waiting 60s..."; sleep 60 ;;
              20)
                echo "::error title=Docker Publish failed for this commit::Every Docker Publish run for ${BRANCH}@${SHA} completed without success, so there are no scanned images to certify. Fix the cause on main; the next commit that publishes cleanly is the candidate."
                exit 1 ;;
              21|30)
                if [[ "$(date +%s)" -ge "$APPEAR_DEADLINE" ]]; then
                  echo "::error title=No Docker Publish run for this commit::No docker-publish.yml run exists for ${BRANCH}@${SHA} after 15m. A commit touching only markdown other than CHANGELOG.md, changes/** and .github/release-notes/**, or only .beads/** or LICENSE, is skipped by docker-publish.yml's path filter and gets no build (#3629): certify the newest commit that has one, or land a change outside that set."
                  exit 1
                fi
                echo "  no verdict yet (state ${rc}); waiting 30s..."; sleep 30 ;;
              *)
                echo "::error title=resolver error::resolve-candidate-publish-run.sh exited ${rc}."; exit 1 ;;
            esac
          done

  # ── the preflight, reused, and its evidence ─────────────────────────────────
  # release-preflight.yml is DISPATCHED on this commit and followed to a
  # verdict rather than re-implemented here, for the same reason release.yml
  # requires its evidence instead of running it inline (#3538): one
  # definition of "releasable", and the green run this leaves behind is the
  # `release-preflight-<sha>` evidence the tag-push run will demand later.
  preflight:
    name: Require a green Release Preflight for this commit
    # After `publish` (#4372): preflight check 3 audits the Docker Publish run
    # for this commit, so it must not be dispatched while that run is pending.
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write   # dispatch release-preflight.yml and follow it
    steps:
      # CODE FROM MAIN, DATA FROM THE COMMIT (adversarial review, finding 1).
      # This job holds a token, so nothing it EXECUTES may come from the
      # certified commit: a maintenance commit that edited only `scripts/ci`
      # would otherwise get arbitrary shell in a job whose OIDC identity is
      # `release-candidate.yml@refs/heads/main`, which is precisely the
      # certification the pin exists to make unforgeable. The `need` checks in
      # `resolve` still assert those scripts EXIST at the commit -- that is
      # about what the promote runs later at the tag -- but their copies are
      # never run here.
      # Nothing here reads the commit as data: both scripts are driven entirely
      # by the environment and the API.
      - name: Checkout main's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: scripts/ci

      - name: Dispatch the Release Preflight on this commit
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          # Backdated two minutes: a runner clock is compared against GitHub's
          # created_at (see promote-floating-tags in release.yml).
          START="$(date -u -d '-2 minutes' +%Y-%m-%dT%H:%M:%SZ)"
          echo "start=${START}" >> "$GITHUB_OUTPUT"
          gh workflow run release-preflight.yml \
            --repo "${GITHUB_REPOSITORY}" --ref main -f "ref=${SHA}"
          echo "Dispatched release-preflight.yml on main with ref=${SHA}."

      - name: Follow the preflight to a verdict
        env:
          GH_TOKEN: ${{ github.token }}
          FOLLOW_REPO: ${{ github.repository }}
          FOLLOW_WORKFLOW: release-preflight.yml
          FOLLOW_REF: main
          FOLLOW_SINCE: ${{ steps.dispatch.outputs.start }}
        run: |
          set -euo pipefail
          rc=0
          out="$(bash scripts/ci/follow-dispatched-run.sh)" || rc=$?
          echo "$out"
          case "$rc" in
            0) ;;
            1) echo "::error title=Release Preflight is NOT READY::The preflight dispatched for this commit concluded without success (${out}). Fix what it reported on main, then dispatch a new candidate. A red preflight is a measurement of this commit, not a formality."; exit 1 ;;
            *) echo "::error title=Release Preflight could not be followed::${out}. Re-run this workflow."; exit 1 ;;
          esac

      # The evidence gate release.yml applies, applied here first, with no
      # tag and therefore no break-glass trailer to honour.
      - name: Assert a green preflight audited this commit
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_REPO: ${{ github.repository }}
          GATE_SHA: ${{ needs.resolve.outputs.sha }}
          GATE_TAG: ''
        run: bash scripts/ci/assert-preflight-evidence.sh

  # ── bookkeeping, at the commit (#3773 parity) ────────────────────────────────
  bookkeeping:
    name: Release bookkeeping for the commit
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      # The artifact-keeper-test commit (and branch) the gate runs, resolved
      # once here and passed to the gate as `tests_sha`, so every gate job runs
      # one tree and the certification names it (#6076).
      tests_sha: ${{ steps.tests_ref.outputs.sha }}
      tests_branch: ${{ steps.tests_ref.outputs.branch }}
    steps:
      # CODE FROM MAIN, DATA FROM THE COMMIT (adversarial review, finding 1).
      # This job holds a token, so nothing it EXECUTES may come from the
      # certified commit: a maintenance commit that edited only `scripts/ci`
      # would otherwise get arbitrary shell in a job whose OIDC identity is
      # `release-candidate.yml@refs/heads/main`, which is precisely the
      # certification the pin exists to make unforgeable. The `need` checks in
      # `resolve` still assert those scripts EXIST at the commit -- that is
      # about what the promote runs later at the tag -- but their copies are
      # never run here.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      # The bookkeeping assertions are ABOUT the commit's CHANGELOG and its
      # curated notes file, so those two paths -- and only those two -- are
      # overlaid from the certified commit. They are read, never executed.
      - name: Overlay the certified commit's release bookkeeping
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'
          git checkout "$SHA" -- CHANGELOG.md .github/release-notes
          echo "CHANGELOG.md and .github/release-notes/ are now ${SHA}'s; every script run here is main's."

      # A tag that already exists means a release attempt already happened for
      # this version; whatever it points at, this commit cannot become vX.Y.Z.
      - name: Refuse a version whose git tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          rc=0
          out="$(gh api -i "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>/dev/null)" || rc=$?
          status="$(head -n1 <<<"$out" | tr -d '\r')"
          if [[ "$rc" -eq 0 ]]; then
            echo "::error title=Tag already exists::${TAG} already exists (it is immutable: ruleset 19144026). This version is spent; bump Cargo.toml and certify the new commit."
            exit 1
          elif [[ ! "$status" =~ ^HTTP/[0-9.]+[[:space:]]+404([[:space:]]|$) ]]; then
            echo "::error title=Tag lookup failed::could not prove ${TAG} is free (got: ${status:-no answer}). Failing closed."
            exit 1
          fi
          echo "${TAG} does not exist yet. OK."

      - name: Refuse an existing GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/assert-release-absent.sh "${{ needs.resolve.outputs.tag }}"

      # The three bookkeeping assertions release.yml makes on the tag
      # (curated notes file, open [Unreleased], no orphaned notes), on the
      # commit instead.
      - name: Verify release bookkeeping
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/assert-release-bookkeeping.sh "${{ needs.resolve.outputs.tag }}"

      # release.yml's verify-images-published runs this on stable tags only;
      # the artifact-keeper-test gate runs it only when backend_tag is X.Y.Z,
      # which a sha tag is not. So it runs here, on the commit.
      - name: Verify CHANGELOG.md documents this version
        run: scripts/ci/assert-changelog-documents-version.sh "${{ needs.resolve.outputs.version }}"

      # ── will the gate's chart install render? (#4722) ──────────────────────
      # The Release Gate installs the Helm chart from artifact-keeper-iac with
      # artifact-keeper-test's values profiles. A chart that refuses those
      # values is first seen at `helm install` on the cluster: the 1.11.1
      # candidate died there 14 minutes in (run 39001623001), after iac#380
      # began refusing ADMIN_PASSWORD in backend.env and every gate profile
      # still set it. `helm template` of the same chart with the same profiles
      # gives that verdict in seconds, with no cluster, before an hour of gate
      # is spent on a stack that will deploy nothing.
      #
      # Same inputs the gate uses:
      #   chart     artifact-keeper-iac at the ref passed as `iac_ref` to the
      #             release-gate job below (main; keep the two in step)
      #   profiles  artifact-keeper-test@main moved by its switch-tests-ref.sh
      #             to the release/X.Y.x branch for this commit's line when one
      #             exists, exactly as every gate job does
      #   Helm      v3.22.1, the gate's pin
      # The profile list and the render are artifact-keeper-test's
      # (helm/gate-profiles.txt, scripts/render-gate-profiles.sh), shared with
      # iac's helm-ci.yml so the three cannot drift. Running that repository's
      # main here trusts it no further than the release-gate job below, which
      # runs its main with GHCR_DOCKER_CONFIG; and nothing from the certified
      # commit is executed (CODE FROM MAIN, DATA FROM THE COMMIT above).
      - name: Checkout the gate's chart (artifact-keeper-iac@main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-iac
          ref: refs/heads/main
          path: .gate/iac
          persist-credentials: false

      - name: Checkout the gate's profiles (artifact-keeper-test@main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: artifact-keeper/artifact-keeper-test
          ref: refs/heads/main
          path: .gate/test
          persist-credentials: false

      # A rerun with tests=same pins the original's tests commit here
      # (GATE_TESTS_SHA, honoured since artifact-keeper-test#830); it must
      # still be on the branch the line is gated by, or this fails.
      - name: Move the profiles to the tests ref the gate will use
        working-directory: .gate/test
        env:
          GH_TOKEN: ${{ github.token }}
          BACKEND_TAG: sha-${{ needs.resolve.outputs.short }}
          GATE_TESTS_SHA: ${{ needs.resolve.outputs.rerun_pin_tests_sha }}
        run: scripts/switch-tests-ref.sh

      - name: Record the tests ref the gate will use
        id: tests_ref
        working-directory: .gate/test
        env:
          PIN: ${{ needs.resolve.outputs.rerun_pin_tests_sha }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          branch="$(cat deploy-test/.tests-ref 2>/dev/null || echo main)"
          if [[ -n "$PIN" && "$sha" != "$PIN" ]]; then
            echo "::error title=Tests ref not pinned::the rerun asked for artifact-keeper-test@${PIN} but the tree is at ${sha}: this switch-tests-ref.sh predates artifact-keeper-test#830. Failing closed."
            exit 1
          fi
          echo "Gate tests: artifact-keeper-test ${branch} @ ${sha}"
          { echo "sha=${sha}"; echo "branch=${branch}"; } >> "$GITHUB_OUTPUT"

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.22.1

      - name: Render the chart with every gate profile
        run: |
          set -euo pipefail
          if [[ ! -x .gate/test/scripts/render-gate-profiles.sh || ! -f .gate/test/helm/gate-profiles.txt ]]; then
            # A release/X.Y.x tests branch cut before artifact-keeper-test#450
            # has no profile manifest. Not a refusal: the gate still runs, it
            # just runs without this preflight. Backport #450 to the branch.
            echo "::warning title=Gate profiles not preflighted::the artifact-keeper-test ref the gate will use ($(git -C .gate/test rev-parse --short HEAD)) has no helm/gate-profiles.txt / scripts/render-gate-profiles.sh (artifact-keeper-test#450); the chart render is first checked by the gate's own helm install."
            exit 0
          fi
          rc=0
          .gate/test/scripts/render-gate-profiles.sh --chart-dir .gate/iac/charts/artifact-keeper || rc=$?
          case "$rc" in
            0) ;;
            1) echo "::error title=The Release Gate would deploy nothing::the chart at artifact-keeper-iac@main refuses the release gate's values (each failing profile is named above). Fix the chart or the profiles in artifact-keeper-test, then dispatch a new candidate; dispatching the gate now would fail at helm install."; exit 1 ;;
            *) echo "::error title=Gate profile render could not run::render-gate-profiles.sh exited ${rc} (missing chart or values file). Failing closed."; exit 1 ;;
          esac

  # ── the images Docker Publish already built for this commit ─────────────────
  images:
    name: Resolve the commit's published images
    needs: [resolve, publish]
    runs-on: ubuntu-latest
    # The wait for Docker Publish is the `publish` job's; once it is green
    # these steps are registry reads (~20s on the 1.11.2 candidate).
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      actions: read
    outputs:
      backend_digest: ${{ steps.digests.outputs.backend_digest }}
      openscap_digest: ${{ steps.digests.outputs.openscap_digest }}
      # The adapter digest the release SHIPS (#4076): this commit's sha-<sha>
      # rebuild when the exact version is new, the published `:VERSION`
      # digest when it stays. See "Pin the scanner-adapter digest that ships".
      adapter_digest: ${{ steps.adapter.outputs.adapter_digest }}
      adapter_tag: ${{ steps.adapter.outputs.adapter_tag }}
      adapter_image_ref: ${{ steps.adapter.outputs.adapter_image_ref }}
      adapter_decision: ${{ steps.adapter.outputs.adapter_decision }}
      adapter_owner_rev: ${{ steps.adapter.outputs.adapter_owner_rev }}
      adapter_version: ${{ steps.digests.outputs.adapter_version }}
      publish_run_id: ${{ needs.publish.outputs.run_id }}
    steps:
      # CODE FROM MAIN, DATA FROM THE COMMIT (adversarial review, finding 1).
      # This job holds a token, so nothing it EXECUTES may come from the
      # certified commit: a maintenance commit that edited only `scripts/ci`
      # would otherwise get arbitrary shell in a job whose OIDC identity is
      # `release-candidate.yml@refs/heads/main`, which is precisely the
      # certification the pin exists to make unforgeable. The `need` checks in
      # `resolve` still assert those scripts EXIST at the commit -- that is
      # about what the promote runs later at the tag -- but their copies are
      # never run here.
      # Full history, and the maintenance lines, so the adapter check can diff
      # the published revision against the certified commit at the OBJECT
      # level -- which is how it already read that commit, and why the
      # worktree never needs to be the commit's.
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0

      - name: Fetch the maintenance lines
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/release/*:refs/remotes/origin/release/*'

      # The `sha-<sha>` tags are content-addressed anchors written by every
      # main build. Their digests are what the gate tests and what the
      # certification names. (The scanner adapter's certified digest is
      # settled below, by its exact-version decision: #4076.) The adoption
      # gate release.yml applies to a promoted image (#3640) is applied here
      # in its strict form: the published image's recorded revision must BE
      # this commit.
      - name: Resolve the sha-tag digests and their provenance
        id: digests
        env:
          GHCR_TOKEN: ${{ github.token }}
          SHA: ${{ needs.resolve.outputs.sha }}
          SHORT: ${{ needs.resolve.outputs.short }}
        run: |
          set -euo pipefail
          resolve() { # <key> <ghcr repository>
            local key="$1" name="$2" digest rev
            digest="$(.github/scripts/registry-tag-digest.sh ghcr.io "$name" "sha-${SHORT}" 2>/dev/null || true)"
            if [[ ! "$digest" =~ ^sha256: ]]; then
              echo "::error title=Candidate image missing::ghcr.io/${name}:sha-${SHORT} is '${digest:-unreadable}'. Docker Publish reported success for this commit but the sha tag is not resolvable."
              exit 1
            fi
            rev="$(.github/scripts/registry-tag-revision.sh ghcr.io "$name" "sha-${SHORT}" 2>/dev/null || true)"
            if [[ "$rev" != "$SHA" ]]; then
              echo "::error title=Candidate image provenance mismatch::ghcr.io/${name}:sha-${SHORT} records source revision '${rev}', not ${SHA}. Refusing to certify bytes that were not built from this commit."
              exit 1
            fi
            echo "  ${key}: ghcr.io/${name}:sha-${SHORT} -> ${digest} (built from ${SHA})"
            echo "${key}_digest=${digest}" >> "$GITHUB_OUTPUT"
          }
          resolve backend  "${BACKEND_IMAGE#ghcr.io/}"
          resolve openscap "${OPENSCAP_IMAGE#ghcr.io/}"
          resolve adapter  "${ADAPTER_IMAGE#ghcr.io/}"
          # From the CERTIFIED COMMIT's object, not the worktree (which is
          # main's): the adapter version belongs to the commit being certified.
          echo "adapter_version=$(git show "${SHA}:docker/scanner-adapter/VERSION" | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"

      # ── parity: the exact-tag digest guard (#3773) ──────────────────────────
      # docker-publish.yml runs assert-version-digest-consistent.sh only when
      # an exact tag is being published, i.e. on a tag ref. Ask it now, with
      # the digests the promote will apply: `:X.Y.Z` must be absent on both
      # registries, or already name exactly these bytes (a re-certification
      # of the same commit). Anything else means the version is spent.
      - name: Assert the exact version tag is free, or already names these bytes
        env:
          GHCR_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          .github/scripts/assert-version-digest-consistent.sh "${VERSION}" \
            "${{ steps.digests.outputs.backend_digest }}" \
            "ghcr.io|${BACKEND_IMAGE#ghcr.io/}" "docker.io|artifactkeeper/backend"
          .github/scripts/assert-version-digest-consistent.sh "${VERSION}" \
            "${{ steps.digests.outputs.openscap_digest }}" \
            "ghcr.io|${OPENSCAP_IMAGE#ghcr.io/}" "docker.io|artifactkeeper/openscap"

      # ── parity: the scanner-adapter exact-version decision (#3773) ──────────
      # The check RELEASING.md step 6 admitted a candidate never exercised.
      # It also writes the decision to this step's outputs (#4076):
      # decision=new|stays, owner_rev, adapter_version.
      - name: Assert the scanner-adapter exact version can publish from this commit
        id: adapter_decision
        env:
          GHCR_TOKEN: ${{ github.token }}
          ADAPTER_SHA: ${{ needs.resolve.outputs.sha }}
        run: scripts/ci/assert-adapter-exact-version.sh

      # ── the adapter the release ships (#4076) ───────────────────────────────
      # On "new" the release ships this commit's sha-<sha> rebuild; on "stays"
      # it ships the published `:VERSION` digest, which is then what gets
      # certified (checked against the owner's sha tag and Docker Hub). The
      # logic and its rationale live in scripts/ci/pin-adapter-digest.sh,
      # tested by test-pin-adapter-digest.sh. It also refuses "stays" when the
      # certified commit's own assert-candidate-certified.sh predates #4076:
      # release.yml runs that copy on the tag and would refuse the
      # certification after the tag exists (backport first).
      #
      # The Release Gate runs exactly this adapter: the job below passes
      # `adapter_tag` and `adapter_digest`, the gate's k8s stack deploys
      # `<tag>@<digest>` and asserts the pod runs that digest, and its
      # candidate-adapter DTF tiers pull it by digest (#4439,
      # artifact-keeper-test#380).
      - name: Pin the scanner-adapter digest that ships
        id: adapter
        env:
          GHCR_TOKEN: ${{ github.token }}
          SHORT: ${{ needs.resolve.outputs.short }}
          CERT_SHA: ${{ needs.resolve.outputs.sha }}
          CERTIFIED_BRANCH: ${{ needs.resolve.outputs.certified_branch }}
          DECISION: ${{ steps.adapter_decision.outputs.decision }}
          OWNER_REV: ${{ steps.adapter_decision.outputs.owner_rev }}
          ADAPTER_VERSION: ${{ steps.digests.outputs.adapter_version }}
          REBUILD_DIGEST: ${{ steps.digests.outputs.adapter_digest }}
        run: scripts/ci/pin-adapter-digest.sh

  # ── what this candidate tests, written down before the gate runs (#6076) ──
  # The record a later rerun reads: the commit, the digests and adapter
  # decision the gate will test, the line, this file's blob, and the tests
  # commit. Uploaded as `release-candidate-record` BEFORE any gate job exists
  # in this run; resolve-candidate-rerun.sh accepts it only if it is the one
  # artifact of that name and no newer than this job's completion, so a gate
  # job cannot replace it unnoticed.
  #
  # On a rerun it first compares all of that with the original's record and
  # refuses any difference: a rerun cannot change the commit or the bytes
  # being certified, and with tests=same it cannot change the tests either.
  record:
    name: Record what this candidate tests
    needs: [resolve, bookkeeping, images]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read    # this run's referenced release-gate.yml commit
    outputs:
      tests_sha: ${{ steps.record.outputs.tests_sha }}
      gate_workflow_sha: ${{ steps.record.outputs.gate_workflow_sha }}
      gate_workflow: ${{ steps.record.outputs.gate_workflow }}
      tests_moved: ${{ steps.record.outputs.tests_moved }}
      contributing_runs: ${{ steps.record.outputs.contributing_runs }}
      rerun: ${{ steps.record.outputs.rerun }}
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      CERTIFIED_REF: ${{ needs.resolve.outputs.certified_ref }}
      WORKFLOW_BLOB: ${{ needs.resolve.outputs.workflow_blob }}
      CANDIDATE_WORKFLOW_BLOB: ${{ needs.resolve.outputs.candidate_workflow_blob }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
      OPENSCAP_DIGEST: ${{ needs.images.outputs.openscap_digest }}
      ADAPTER_DIGEST: ${{ needs.images.outputs.adapter_digest }}
      ADAPTER_DECISION: ${{ needs.images.outputs.adapter_decision }}
      ADAPTER_OWNER_REV: ${{ needs.images.outputs.adapter_owner_rev }}
      ADAPTER_TAG: ${{ needs.images.outputs.adapter_tag }}
      PUBLISH_RUN_ID: ${{ needs.images.outputs.publish_run_id }}
      TESTS_SHA: ${{ needs.bookkeeping.outputs.tests_sha }}
      TESTS_BRANCH: ${{ needs.bookkeeping.outputs.tests_branch }}
      RERUN_OF: ${{ needs.resolve.outputs.rerun_of }}
      RERUN_REASON: ${{ needs.resolve.outputs.rerun_reason }}
      RERUN_TESTS: ${{ needs.resolve.outputs.rerun_tests }}
      RERUN_JOBS: ${{ needs.resolve.outputs.rerun_jobs }}
      RERUN_GATE_CHANGED: ${{ needs.resolve.outputs.rerun_gate_changed }}
      ORIGINAL_ACTOR: ${{ needs.resolve.outputs.original_actor }}
      ORIGINAL_CREATED_AT: ${{ needs.resolve.outputs.original_created_at }}
      ORIGINAL_GATE_SHA: ${{ needs.resolve.outputs.original_gate_sha }}
      ORIGINAL_RECORD: ${{ needs.resolve.outputs.original_record }}
    steps:
      - name: Refuse a rerun whose commit, bytes or tests differ from the original
        if: ${{ needs.resolve.outputs.rerun_of != '' }}
        run: |
          set -euo pipefail
          bad=0
          same() { # <what> <original> <now>
            if [[ -z "$2" || "$2" != "$3" ]]; then
              echo "::error title=Rerun differs from its original::${1}: run ${RERUN_OF} tested '${2:-<none>}', this run resolves '${3:-<none>}'."
              bad=1
            else
              echo "  same ${1}: ${3}"
            fi
          }
          o() { jq -r "$1 // empty" <<<"$ORIGINAL_RECORD"; }
          same commit                "$(o .commit_sha)"                     "$SHA"
          same version               "$(o .version)"                        "$VERSION"
          same certified_ref         "$(o .certified_ref)"                  "$CERTIFIED_REF"
          same workflow_blob         "$(o .certified_workflow_blob)"        "$WORKFLOW_BLOB"
          # The candidate workflow itself (#6122): the commit's own copy above
          # is fixed per commit, so this is what catches release-candidate.yml
          # changing on main between the original and the rerun. An original
          # recorded before this field existed has none, and is refused.
          same candidate_workflow    "$(o .candidate_workflow_blob)"        "$CANDIDATE_WORKFLOW_BLOB"
          same backend_digest        "$(o .digests.backend)"                "$BACKEND_DIGEST"
          same openscap_digest       "$(o .digests.openscap)"               "$OPENSCAP_DIGEST"
          same scanner_adapter_digest "$(o .digests.scanner_adapter)"       "$ADAPTER_DIGEST"
          same adapter_decision      "$(o .scanner_adapter_decision.decision)" "$ADAPTER_DECISION"
          same adapter_tag           "$(o .scanner_adapter_decision.tag)"   "$ADAPTER_TAG"
          if [[ "$RERUN_TESTS" == same ]]; then
            same tests_sha           "$(o .tests.sha)"                      "$TESTS_SHA"
            same tests_branch        "$(o .tests.branch)"                   "$TESTS_BRANCH"
          fi
          if [[ "$bad" -ne 0 ]]; then
            echo "::error title=Rerun refused::A rerun certifies exactly what its original tested. A different digest means Docker Publish rebuilt the images since; a different tests ref with tests=same means the line's test branch changed. Dispatch a fresh candidate (or tests=moved for a test-only change)."
            exit 1
          fi

      - name: Write the record
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub's record of the gate this run called: `path` is the
          # `uses:` value with its ref (the pinned sha, #6170), `sha` the
          # commit that ref resolved to.
          gate_ref="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --jq '[.referenced_workflows[]? | select(.path | startswith("artifact-keeper/artifact-keeper-test/.github/workflows/release-gate.yml@"))] | first // {} | [.path // "", .sha // ""] | join(" ")')"
          GATE_WORKFLOW="${gate_ref% *}"
          GATE_SHA="${gate_ref##* }"
          if [[ ! "$GATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Gate commit unknown::this run records no artifact-keeper-test release-gate.yml commit (got '${GATE_SHA}')."
            exit 1
          fi
          if [[ ! "$TESTS_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Tests ref unknown::bookkeeping resolved no artifact-keeper-test commit (got '${TESTS_SHA}')."
            exit 1
          fi
          this_run="$(jq -nc --arg run "$GITHUB_RUN_ID" --arg actor "$GITHUB_TRIGGERING_ACTOR" \
            --arg gate "$GATE_SHA" --arg tsha "$TESTS_SHA" --arg tbr "$TESTS_BRANCH" \
            '{run_id: $run, actor: $actor, gate_workflow_sha: $gate, tests: {sha: $tsha, branch: $tbr}}')"
          if [[ -z "$RERUN_OF" ]]; then
            scope=full
            tests_moved=false
            rerun=null
            runs="$(jq -c '[. + {role: "full"}]' <<<"$this_run")"
          else
            scope=rerun
            otests="$(jq -c '.tests' <<<"$ORIGINAL_RECORD")"
            tests_moved=false
            if [[ "$RERUN_GATE_CHANGED" == true || "$(jq -r .sha <<<"$otests")" != "$TESTS_SHA" \
                  || "$(jq -r .branch <<<"$otests")" != "$TESTS_BRANCH" ]]; then
              tests_moved=true
            fi
            rerun="$(jq -nc --arg of "$RERUN_OF" --arg reason "$RERUN_REASON" --arg actor "$GITHUB_TRIGGERING_ACTOR" \
              --arg jobs "$RERUN_JOBS" --arg mode "$RERUN_TESTS" --argjson moved "$tests_moved" \
              '{of: $of, reason: $reason, actor: $actor, only_jobs: ($jobs | split(" ")), tests_mode: $mode, tests_moved: $moved}')"
            runs="$(jq -nc --argjson self "$this_run" --argjson otests "$otests" \
              --arg of "$RERUN_OF" --arg oactor "$ORIGINAL_ACTOR" --arg ogate "$ORIGINAL_GATE_SHA" --arg ostart "$ORIGINAL_CREATED_AT" \
              --arg reason "$RERUN_REASON" --arg jobs "$RERUN_JOBS" \
              '[{run_id: $of, role: "original", actor: $oactor, started_at: $ostart, gate_workflow_sha: $ogate, tests: $otests,
                 passed: "every gate job and dtf-gate leg except the ones the rerun ran"},
                ($self + {role: "rerun", reason: $reason, ran: ($jobs | split(" "))})]')"
          fi
          mkdir -p record
          jq -n \
            --arg sha "$SHA" --arg version "$VERSION" --arg certified_ref "$CERTIFIED_REF" --arg blob "$WORKFLOW_BLOB" \
            --arg cblob "$CANDIDATE_WORKFLOW_BLOB" \
            --arg run "$GITHUB_RUN_ID" --arg publish_run "$PUBLISH_RUN_ID" \
            --arg backend "$BACKEND_DIGEST" --arg openscap "$OPENSCAP_DIGEST" --arg adapter "$ADAPTER_DIGEST" \
            --arg adapter_decision "$ADAPTER_DECISION" --arg adapter_owner "$ADAPTER_OWNER_REV" --arg adapter_tag "$ADAPTER_TAG" \
            --arg gate "$GATE_SHA" --arg tsha "$TESTS_SHA" --arg tbr "$TESTS_BRANCH" \
            --arg scope "$scope" --argjson rerun "$rerun" --argjson runs "$runs" \
            '{
              schema: 1,
              commit_sha: $sha, version: $version, certified_ref: $certified_ref, certified_workflow_blob: $blob,
              candidate_workflow_blob: $cblob,
              candidate_run_id: $run, docker_publish_run_id: $publish_run,
              digests: { backend: $backend, openscap: $openscap, scanner_adapter: $adapter },
              scanner_adapter_decision: { decision: $adapter_decision, owner_rev: $adapter_owner, tag: $adapter_tag },
              gate_workflow_sha: $gate,
              tests: { sha: $tsha, branch: $tbr },
              gate_scope: $scope,
              rerun: $rerun,
              contributing_runs: $runs
            }' > record/record.json
          cat record/record.json
          {
            echo "tests_sha=${TESTS_SHA}"
            echo "gate_workflow_sha=${GATE_SHA}"
            echo "gate_workflow=${GATE_WORKFLOW}"
            echo "tests_moved=${tests_moved}"
            echo "contributing_runs=${runs}"
            echo "rerun=${rerun}"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-record
          path: record/record.json
          retention-days: 90
          if-no-files-found: error

  # ── the gate, exactly as release.yml runs it ─────────────────────────────────
  release-gate:
    # The name is GATE_JOB_NAME: resolve-candidate-rerun.sh finds a run's gate
    # jobs by it. A rerun keeps the name; only `only_jobs` narrows it.
    name: Release Gate (Full Suite)
    needs: [resolve, preflight, bookkeeping, images, record]
    # Attempt 1 only (#3774): a re-run cannot re-create the gate's namespace.
    # `gate-rerun-refused` below turns that into a red job with the reason.
    # A rerun of the failed groups (#6076) is a new dispatch, so attempt 1.
    if: >-
      ${{ !cancelled()
          && needs.preflight.result == 'success'
          && needs.bookkeeping.result == 'success'
          && needs.images.result == 'success'
          && needs.record.result == 'success'
          && fromJSON(github.run_attempt) == 1 }}
    # The gate's jobs request at most contents: read and packages: read (ghcr
    # pulls); a called workflow can never hold more than its calling job grants.
    permissions:
      contents: read
      packages: read
    # Pinned to an artifact-keeper-test commit, not @main (#6170): a gate
    # change reaches a candidate only through a bump PR in this repo, which
    # Mergify does not auto-merge. CODEOWNERS lists this file to mark
    # ownership; a code-owner review is enforced only once branch protection
    # on main and release/* requires it (#6216). The pin does not wait on
    # protection for artifact-keeper-test (#6178). All five callers carry ONE
    # sha, and
    # scripts/ci/check-gate-workflow-pins.sh enforces both that and that the
    # sha is on artifact-keeper-test main.
    uses: artifact-keeper/artifact-keeper-test/.github/workflows/release-gate.yml@987bccd15df3fd4c9c24bf78436ce12fb5bd5783 # artifact-keeper-test main as of 2026-11-18
    with:
      backend_tag: sha-${{ needs.resolve.outputs.short }}
      # The chart ref the gate deploys. `bookkeeping` renders the chart at this
      # same ref before the gate is dispatched (#4722): keep the two in step.
      iac_ref: main
      backend_digest: ${{ needs.images.outputs.backend_digest }}
      # The adapter this release ships (pin-adapter-digest.sh): this commit's
      # sha-<short> rebuild when its VERSION is new, the published :VERSION
      # when it stays, pinned to the digest the certification names. The
      # gate's k8s stack and its scanner-adapter tiers run it (#4439).
      scanner_adapter_tag: ${{ needs.images.outputs.adapter_tag }}
      scanner_adapter_digest: ${{ needs.images.outputs.adapter_digest }}
      web_tag: latest
      test_suite: all
      # One tests tree for every gate job, the one `record` names (#6076).
      tests_sha: ${{ needs.record.outputs.tests_sha }}
      # Empty for a full candidate. A rerun: the gate jobs and dtf-gate legs
      # the original did not pass (artifact-keeper-test#830).
      only_jobs: ${{ needs.resolve.outputs.rerun_jobs }}
    # Only the one secret the gate declares, not every secret this repo holds.
    secrets:
      GHCR_DOCKER_CONFIG: ${{ secrets.GHCR_DOCKER_CONFIG }}

  gate-rerun-refused:
    name: Refuse a re-run of the gate
    needs: [resolve, release-gate]
    if: ${{ !cancelled() && fromJSON(github.run_attempt) > 1 && needs.release-gate.result != 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Explain
        env:
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          echo "::error title=Re-running a failed Release Gate cannot work (#3774)::'Re-run failed jobs' does not re-execute the gate's deploy job -- GitHub replays its first-attempt outputs -- so every suite would target a test namespace the first attempt's teardown already deleted and fail with 'backend not ready'. Recovery: fix the cause, then dispatch a NEW Release Candidate on the fixed commit (or on ${SHA} again if the failure was in the gate itself)."
          exit 1

  # ── certify ──────────────────────────────────────────────────────────────────
  certify:
    name: Certify the commit
    needs: [resolve, preflight, bookkeeping, images, record, release-gate]
    # Every gate named explicitly, `!cancelled()` rather than `always()`, so a
    # cancelled run never certifies (same reasoning as release.yml's release
    # job, #3538).
    if: >-
      ${{ !cancelled()
          && needs.preflight.result == 'success'
          && needs.bookkeeping.result == 'success'
          && needs.images.result == 'success'
          && needs.record.result == 'success'
          && needs.release-gate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read        # a rerun's coverage check lists both runs' jobs
      packages: read       # the self-verification reads the sha tags back
      id-token: write      # GitHub OIDC -> Sigstore, for actions/attest
      attestations: write  # store the certification (and read it back)
      statuses: write      # the release-candidate/certified commit status
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      CERTIFIED_REF: ${{ needs.resolve.outputs.certified_ref }}
      WORKFLOW_BLOB: ${{ needs.resolve.outputs.workflow_blob }}
      BACKEND_DIGEST: ${{ needs.images.outputs.backend_digest }}
      OPENSCAP_DIGEST: ${{ needs.images.outputs.openscap_digest }}
      ADAPTER_DIGEST: ${{ needs.images.outputs.adapter_digest }}
      ADAPTER_DECISION: ${{ needs.images.outputs.adapter_decision }}
      ADAPTER_OWNER_REV: ${{ needs.images.outputs.adapter_owner_rev }}
    steps:
      # CODE FROM MAIN, DATA FROM THE COMMIT (adversarial review, finding 1).
      # This job holds a token, so nothing it EXECUTES may come from the
      # certified commit: a maintenance commit that edited only `scripts/ci`
      # would otherwise get arbitrary shell in a job whose OIDC identity is
      # `release-candidate.yml@refs/heads/main`, which is precisely the
      # certification the pin exists to make unforgeable. The `need` checks in
      # `resolve` still assert those scripts EXIST at the commit -- that is
      # about what the promote runs later at the tag -- but their copies are
      # never run here.
      # THE job that holds `id-token: write` and `attestations: write`. It
      # reads nothing from the certified commit at all; the predicate is built
      # from job outputs and the verification is API-driven.
      - name: Checkout main's tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          sparse-checkout: |
            scripts/ci
            .github/scripts

      # A rerun's green covers the whole gate only if every gate job and leg
      # it has also ran in the original (#6076): with tests=moved the gate may
      # have gained a group since, which neither run would then have tested.
      # The original's green covers everything the rerun did not run, because
      # the rerun ran every gate job and leg the original did not pass.
      - name: Check the rerun and its original cover the whole gate
        if: ${{ needs.resolve.outputs.rerun_of != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN_REPO: ${{ github.repository }}
          RERUN_OF: ${{ needs.resolve.outputs.rerun_of }}
          RERUN_SELF_RUN_ID: ${{ github.run_id }}
          RERUN_GATE_JOB: ${{ env.GATE_JOB_NAME }}
        run: bash scripts/ci/resolve-candidate-rerun.sh coverage

      # ONE predicate for all three subjects, so the verifier can require
      # that the whole image set was certified by the same run.
      - name: Write the certification predicate
        env:
          ADAPTER_VERSION: ${{ needs.images.outputs.adapter_version }}
          ADAPTER_DECISION: ${{ needs.images.outputs.adapter_decision }}
          ADAPTER_OWNER_REV: ${{ needs.images.outputs.adapter_owner_rev }}
          ADAPTER_TAG: ${{ needs.images.outputs.adapter_tag }}
          PUBLISH_RUN_ID: ${{ needs.images.outputs.publish_run_id }}
          GATE_WORKFLOW_SHA: ${{ needs.record.outputs.gate_workflow_sha }}
          GATE_WORKFLOW: ${{ needs.record.outputs.gate_workflow }}
          TESTS_SHA: ${{ needs.bookkeeping.outputs.tests_sha }}
          TESTS_BRANCH: ${{ needs.bookkeeping.outputs.tests_branch }}
          CONTRIBUTING_RUNS: ${{ needs.record.outputs.contributing_runs }}
          RERUN: ${{ needs.record.outputs.rerun }}
        run: |
          set -euo pipefail
          mkdir -p certification
          jq -n \
            --arg sha "$SHA" --arg version "$VERSION" --arg certified_ref "$CERTIFIED_REF" \
            --arg workflow_blob "$WORKFLOW_BLOB" \
            --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg publish_run "$PUBLISH_RUN_ID" \
            --arg adapter_version "$ADAPTER_VERSION" \
            --arg adapter_decision "$ADAPTER_DECISION" --arg adapter_owner "$ADAPTER_OWNER_REV" --arg adapter_tag "$ADAPTER_TAG" \
            --arg backend "$BACKEND_DIGEST" --arg openscap "$OPENSCAP_DIGEST" --arg adapter "$ADAPTER_DIGEST" \
            --arg backend_image "$BACKEND_IMAGE" --arg openscap_image "$OPENSCAP_IMAGE" --arg adapter_image "$ADAPTER_IMAGE" \
            --arg at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg gate_workflow "$GATE_WORKFLOW" --arg gate_sha "$GATE_WORKFLOW_SHA" --arg tests_sha "$TESTS_SHA" --arg tests_branch "$TESTS_BRANCH" \
            --argjson runs "$CONTRIBUTING_RUNS" --argjson rerun "$RERUN" \
            '{
              commit_sha: $sha,
              version: $version,
              # The branch this run signed on, written down at signing time so
              # the verifier can cross-check it against the ref it derives
              # from the repository (scripts/ci/resolve-certified-ref.sh).
              certified_ref: $certified_ref,
              # The git blob id of release-candidate.yml at the certified
              # commit, recorded (not compared with main, #6122: that copy
              # never runs). Verifiers compare the commit against this
              # record, never against the moving tip of main. (No apostrophes in here: the whole jq
              # program is single-quoted in the shell.)
              certified_workflow_blob: $workflow_blob,
              sha_tag: ("sha-" + ($sha | .[0:7])),
              candidate_run_id: $run,
              candidate_run_attempt: $attempt,
              candidate_run_url: $run_url,
              # The gate is a reusable workflow called by this run, so its
              # jobs live under this run id.
              gate_run_id: $run,
              # The `uses:` ref the gate was called by, as GitHub recorded it
              # for this run: the pinned artifact-keeper-test sha (#6170).
              gate_workflow: $gate_workflow,
              # What the gate ran (#6076): the release-gate.yml commit GitHub
              # resolved for this run, and the one tests tree every gate job
              # checked out (the gate input tests_sha).
              gate_workflow_sha: $gate_sha,
              tests: { sha: $tests_sha, branch: $tests_branch },
              # "full", or "rerun": this run ran only the gate jobs its
              # original did not pass, and `rerun` says which, why and who.
              gate_scope: (if $rerun == null then "full" else "rerun" end),
              rerun: $rerun,
              # Every run whose gate results this certification rests on,
              # with its actor and tests ref: this run alone for a full
              # candidate, the original and this rerun otherwise.
              contributing_runs: $runs,
              docker_publish_run_id: $publish_run,
              scanner_adapter_version: $adapter_version,
              # The exact-version decision (#4076). On "stays" the adapter
              # digest below is the published :VERSION (tag), built from
              # owner_rev, and the verifier anchors the adapter at that tag
              # instead of sha_tag. On "new" owner_rev is empty and tag is
              # sha_tag.
              scanner_adapter_decision: { decision: $adapter_decision, owner_rev: $adapter_owner, tag: $adapter_tag },
              digests: { backend: $backend, openscap: $openscap, scanner_adapter: $adapter },
              images: { backend: $backend_image, openscap: $openscap_image, scanner_adapter: $adapter_image },
              certified_at: $at
            }' > certification/predicate.json
          cat certification/predicate.json

      # No `continue-on-error`, here or below: an attestation step that is
      # allowed to fail quietly is #2824 again, and
      # scripts/ci/check-supply-chain-soft-fail.sh enforces it.
      - name: Attest the backend digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.BACKEND_IMAGE }}
          subject-digest: ${{ env.BACKEND_DIGEST }}
          predicate-type: ${{ env.CERT_PREDICATE_TYPE }}
          predicate-path: certification/predicate.json

      - name: Attest the openscap digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.OPENSCAP_IMAGE }}
          subject-digest: ${{ env.OPENSCAP_DIGEST }}
          predicate-type: ${{ env.CERT_PREDICATE_TYPE }}
          predicate-path: certification/predicate.json

      - name: Attest the scanner-adapter digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ env.ADAPTER_IMAGE }}
          subject-digest: ${{ env.ADAPTER_DIGEST }}
          predicate-type: ${{ env.CERT_PREDICATE_TYPE }}
          predicate-path: certification/predicate.json

      # THE POINT: verify the certification exactly the way the promote and
      # the tag-push run will, before claiming it exists. A certification
      # nobody has watched verify is a certification that will refuse the
      # release at the worst moment.
      - name: Verify the certification the way the release will
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          CERT_REPO: ${{ github.repository }}
          CERT_SHA: ${{ env.SHA }}
          CERT_EXPECT_VERSION: ${{ env.VERSION }}
        run: scripts/ci/assert-candidate-certified.sh

      # For humans and for `gh run download`: the predicate and a one-page
      # record, named by the commit like the preflight evidence is.
      - name: Record the certification
        env:
          RERUN_OF: ${{ needs.resolve.outputs.rerun_of }}
          RERUN_REASON: ${{ needs.resolve.outputs.rerun_reason }}
          RERUN_JOBS: ${{ needs.resolve.outputs.rerun_jobs }}
        run: |
          set -euo pipefail
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "certified_sha=${SHA}"
            echo "version=${VERSION}"
            echo "candidate_run_id=${GITHUB_RUN_ID}"
            echo "backend_digest=${BACKEND_DIGEST}"
            echo "openscap_digest=${OPENSCAP_DIGEST}"
            echo "scanner_adapter_digest=${ADAPTER_DIGEST}"
            echo "scanner_adapter_decision=${ADAPTER_DECISION}"
            echo "scanner_adapter_owner_rev=${ADAPTER_OWNER_REV}"
            if [[ -n "$RERUN_OF" ]]; then
              echo "rerun_of=${RERUN_OF}"
              echo "rerun_actor=${GITHUB_TRIGGERING_ACTOR}"
              echo "rerun_reason=${RERUN_REASON}"
              echo "rerun_jobs=${RERUN_JOBS}"
            fi
            echo "verdict=CERTIFIED"
          } > certification/certification.txt
          cat certification/certification.txt

      - name: Upload the certification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ env.SHA }}
          path: certification/
          retention-days: 90
          if-no-files-found: error

      - name: Mark the commit as certified
        env:
          GH_TOKEN: ${{ github.token }}
          RERUN_OF: ${{ needs.resolve.outputs.rerun_of }}
          RERUN_REASON: ${{ needs.resolve.outputs.rerun_reason }}
          RERUN_JOBS: ${{ needs.resolve.outputs.rerun_jobs }}
          TESTS_MOVED: ${{ needs.record.outputs.tests_moved }}
        run: |
          set -euo pipefail
          how="run ${GITHUB_RUN_ID}"
          [[ -z "$RERUN_OF" ]] || how="run ${RERUN_OF} + rerun ${GITHUB_RUN_ID}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SHA}" \
            -f state=success \
            -f context=release-candidate/certified \
            -f "description=${VERSION} passed the Release Gate (${how})" \
            -f "target_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --silent
          {
            echo "### Release Candidate: CERTIFIED"
            echo
            echo "\`${VERSION}\` at \`${SHA}\` passed the full Release Gate on the images Docker Publish built for it."
            echo
            echo "| image | digest |"
            echo "|---|---|"
            echo "| backend | \`${BACKEND_DIGEST}\` |"
            echo "| openscap | \`${OPENSCAP_DIGEST}\` |"
            echo "| scanner-adapter | \`${ADAPTER_DIGEST}\` (${ADAPTER_DECISION}${ADAPTER_OWNER_REV:+, published from \`${ADAPTER_OWNER_REV:0:7}\`}) |"
            echo
            if [[ -n "$RERUN_OF" ]]; then
              echo "**Rerun of the failed gate groups** of run [${RERUN_OF}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RERUN_OF}) by ${GITHUB_TRIGGERING_ACTOR}: ${RERUN_REASON}"
              echo
              echo "Rerun here: \`${RERUN_JOBS}\`. Tests moved since the original: ${TESTS_MOVED}. The certification lists both runs."
              echo
            fi
            echo "Next: dispatch **Release Promote** on main with \`sha=${SHA}\`. It re-applies \`:${VERSION}\` to these digests, creates \`v${VERSION}\` last, and hands over to the release workflow."
          } >> "$GITHUB_STEP_SUMMARY"
