name: Release CLI Caches

# ══════════════════════════════════════════════════════════════════════════════
# WARM THE CLI BINARY BUILD CACHES ON MAIN  (#4927)
#
# release.yml builds the five CLI binaries on a TAG ref. A GitHub Actions cache
# lookup only sees caches saved on the run's own ref or on the default branch,
# so a cache release.yml saved on `refs/tags/vN` was invisible to `vN+1` and
# every leg compiled cold (27 to 30 min on Linux and Windows, 54 to 57 min on
# macOS, measured on v1.11.5 and v1.11.6). Nothing on main saved these keys,
# because ci.yml only builds the native Linux target.
#
# This workflow runs the same `cargo auditable build` for the same five targets
# ON MAIN, so the caches it saves live in main's scope where the tag run can
# restore them. It packages, signs and uploads nothing; the only thing it
# leaves behind is the cache.
#
# IT BUILDS MAIN'S TIP AND NOTHING ELSE: NO INPUT, NO `ref:`
#   release.yml restores these caches into the binaries it signs, so whatever
#   executes here decides what those binaries link. `cargo build` executes the
#   checked-out tree's build scripts and proc macros, and a job's `permissions:`
#   do not limit that: the cache token is not governed by them, so code in this
#   run can write any key in main's scope. Building in a job without the save
#   step would not help either, because what gets saved is still the output of
#   that code. What keeps this safe is that nobody can choose the code. A
#   dispatch names a ref, and the checkout below takes the commit the run was
#   started on, so the run on main executes main's tip, the same reviewed code
#   and the same cache scope as ci.yml on a push to main. A dispatch on any
#   other ref runs that ref's code but saves in that ref's own scope, which no
#   release reads. Do not add a sha input back, however it is validated.
#   scripts/ci/test-resolve-certified-ref.sh fails CI on that shape.
#
# WHY MAIN'S TIP IS ENOUGH
#   The cache holds dependency artifacts only (rust-cache cleans the workspace
#   crates before saving), and its key depends on the lockfile and the
#   manifests rather than on the commit. Any commit with the same Cargo.lock
#   and manifests hits it exactly, and a version bump changes neither hash
#   (see below). A tag whose dependencies differ from main's tip takes the
#   prefix match on the restore key and recompiles only what changed.
#
# WHO DISPATCHES IT
#   release-candidate.yml's `warm-cli-caches` job, right after `resolve`. It is
#   a separate workflow rather than a job in the candidate on purpose: the
#   candidate runs no code from a checkout other than main's tooling
#   (RELEASING.md, "What runs from the certified commit"; pinned by
#   scripts/ci/test-resolve-certified-ref.sh) and holds the signing identity,
#   and the candidate's certification does not wait for this run or depend on
#   it. It can also be dispatched by hand:
#     gh workflow run release-cli-caches.yml --ref main
#
# THE KEY (Swatinem/rust-cache at the pinned commit, src/config.ts)
#   `shared-key` replaces both `key` and the job id, so the key is the same in
#   this workflow and in release.yml's `build-binaries`:
#     primary  v0-rust-cli-<target>-<OS>-<arch>-<env hash>-<lock hash>
#     restore  v0-rust-cli-<target>-<OS>-<arch>-<env hash>
#   <env hash> covers the rustc version and every CARGO*, CC*, CFLAGS*, CXX*,
#   CMAKE* and RUST* variable visible to the cache step, which is why the
#   toolchain pin and the workflow-level CARGO_TERM_COLOR below must stay equal
#   to release.yml's. <lock hash> covers Cargo.lock and the workspace manifests
#   with package versions normalised to 0.0.0, so the release prep's version
#   bump does not change it. Keep the steps up to `Cache Cargo` in step with
#   release.yml's build-binaries job, or the tag run misses and builds cold.
# ══════════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-cli-caches-${{ github.sha }}
  cancel-in-progress: false

env:
  # Same as release.yml. CARGO_* is part of rust-cache's environment hash.
  CARGO_TERM_COLOR: always

jobs:
  # Not the security boundary (a dispatch on another ref runs that ref's copy
  # of this file): it says why such a run is useless instead of spending five
  # builds on caches no release can read.
  require-main:
    name: Require a dispatch on main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refuse a dispatch that is not on main
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "::error title=Not dispatched on main::Release CLI Caches was dispatched on ${GITHUB_REF}. Its caches are only visible to a release tag when saved on main; dispatch it with --ref main."
            exit 1
          fi
          echo "Warming the CLI build caches from main's tip, ${GITHUB_SHA}"

  warm:
    name: Warm ${{ matrix.target }}
    needs: require-main
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      # Same targets and runners as release.yml's build-binaries. The runner
      # OS and CPU architecture are part of the cache key.
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            features: vendored-openssl,jemalloc
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            features: vendored-openssl,jemalloc
          - target: x86_64-apple-darwin
            os: macos-latest
            features: vendored-openssl
          - target: aarch64-apple-darwin
            os: macos-latest
            features: vendored-openssl
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            features: vendored-openssl

    steps:
      # No `ref:`, deliberately: this is the commit the dispatch started on.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Windows cross-compilation tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: sudo apt-get install -y mingw-w64

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      # Saves on main (the default `save-if`). release.yml restores this key
      # and does not save.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31 # v2
        with:
          shared-key: cli-${{ matrix.target }}

      - name: Install SBOM tooling
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-auditable,cargo-cyclonedx,cargo-audit

      # No "Set version from tag" step: the workspace crates are not saved, and
      # the cache key normalises their versions, so the version main's tip
      # carries makes no difference to what the tag restores.
      #
      # jemalloc's page size is fixed at compile time. Match release.yml's
      # aarch64 leg, which is cross-compiled on a 4 KiB-page runner (#5130).
      - name: Build jemalloc for 64 KiB pages on arm64
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          echo "JEMALLOC_SYS_WITH_LG_PAGE=16" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build
        env:
          SQLX_OFFLINE: true
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: cargo auditable build --release --target ${{ matrix.target }} --features ${{ matrix.features }}
