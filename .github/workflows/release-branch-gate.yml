name: Release Branch Gate

# Required process gate for `release/*` maintenance branches.
#
# Default policy: PRs against `release/*` MUST consist of commits that are
# either already on `main` or are cherry-picks of commits already on `main`.
# This enforces the "land on main first, then cherry-pick" workflow.
#
# Two shapes that legitimately CANNOT trace to main by patch-id are accepted
# on their own terms (#3422): a release-hygiene commit (path C — a release prep,
# a changelog-only commit, a dependency bump or a CI/workflow-only commit, each
# confined to its own path set) and a narrowed backport (a `(cherry picked from
# commit <sha>)` trailer naming a commit that is on main, where hunks that
# could not apply were resolved away). Both are logged explicitly so the
# narrowing stays visible. The logic and its self-test live in
# scripts/ci/check-release-branch-commits.sh and its sibling test-*.sh, so the
# gate can be exercised without opening a release PR; path C's rules live in
# scripts/ci/release-commit-exemptions.sh, shared verbatim with release
# preflight check 5 so the two gates cannot exempt different things (#3829).
#
# Why: PR #1068 was authored directly against `release/1.1.x` without
# going through main. It bundled +1489 lines, broke remote-proxy fetches
# across every package format, and forced a revert mid-release-candidate
# cycle. The resulting v1.1.9 ship slipped by days. This gate prevents
# repeating that mistake by failing CI on PRs whose commits aren't
# main-merged ancestors (or cherry-picks of such commits).
#
# There is NO label bypass (#4070). `release-process: approved` used to skip
# this job outright, and a skipped job still concluded success -- so the
# required `Verify commits trace back to main` context on ruleset 20038606 was
# satisfiable by anyone who could open a PR against `release/*` and label their
# own PR, without the ancestry check ever running. The label is now a review
# marker and nothing else: the check always runs, and a PR carrying the label
# gets a warning saying so. The shapes that legitimately cannot trace back to
# main are path C and path D above -- reviewed code in
# scripts/ci/release-commit-exemptions.sh, not a label anyone can apply.

on:
  pull_request:
    branches: ['release/**']
    # `labeled`/`unlabeled` no longer change the verdict (#4070); they are kept
    # so that applying `release-process: approved` re-runs the job and produces
    # the warning below, which is how whoever applied it learns it does nothing.
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: release-branch-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-main-ancestor:
    name: Verify commits trace back to main
    runs-on: ubuntu-latest
    steps:
      # Not a gate step: it writes an annotation and always succeeds. Nothing
      # below is conditional on it, which is the whole point of #4070.
      - name: "Warn if 'release-process: approved' is set (it does not bypass this gate)"
        env:
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels) }}
        run: |
          set -euo pipefail
          if echo "$LABELS_JSON" | jq -e '.[] | select(.name == "release-process: approved")' > /dev/null; then
            echo "::warning title=The 'release-process: approved' label does not bypass this gate::Since artifact-keeper#4070 the label records a review decision only; this check runs regardless of it, and a labelled PR fails exactly as an unlabelled one does. A commit that legitimately cannot trace back to main must match one of the exemptions in scripts/ci/release-commit-exemptions.sh (path C) or carry a (cherry picked from commit <sha>) trailer naming a commit on main (path D)."
          fi

      - name: Checkout PR head with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Verify every PR commit is on main or a cherry-pick of main
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # The checkout is the PR HEAD, so the script has to exist on the
          # maintenance branch too. It arrives with this workflow when the
          # gate is forward-ported; say so plainly rather than dying on
          # "No such file or directory".
          for f in scripts/ci/check-release-branch-commits.sh \
                   scripts/ci/release-commit-exemptions.sh; do
            if [ ! -f "$f" ]; then
              echo "::error title=Release branch gate is incomplete::${f} is missing on this branch. The gate is three files — .github/workflows/release-branch-gate.yml, scripts/ci/check-release-branch-commits.sh and the exemption set it shares with release preflight check 5 (scripts/ci/release-commit-exemptions.sh) — and they are cherry-picked together (artifact-keeper#3422, artifact-keeper#3829)."
              exit 1
            fi
          done
          bash scripts/ci/check-release-branch-commits.sh "$PR_BASE_SHA" "$PR_HEAD_SHA"
