version: 2

# Grouped and moved to the weekend. Each weekly Wednesday sweep opened
# every bump as its own PR within five minutes -- nine on 2026-09-17 (five
# cargo, four github-actions), ten on 2026-09-10, ten on 2026-09-03 -- and
# every cargo bump is a Cargo.lock change, which runs the full backend suite:
# check-rust, unit, integration, coverage and the image build, ~130 minutes
# on the self-hosted pool per PR. The 2026-09-17 burst put 22 heavy jobs in
# front of the release PRs of the day and starved them for over 90 minutes
# until the bot runs were cancelled by hand. One grouped PR per ecosystem
# runs that suite once; a bump that needs code changes (a major) still
# arrives on its own so it cannot hold the group hostage. Saturday because
# the pool is idle then and the group is reviewed on Monday either way.
updates:
  - package-ecosystem: "docker"
    directory: "/docker"
    schedule:
      interval: "weekly"
      day: "saturday"
    reviewers:
      - "artifact-keeper/maintainers"
    labels:
      - "dependencies"
      - "registry/docker"
    commit-message:
      prefix: "chore"
    groups:
      docker-images:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    reviewers:
      - "artifact-keeper/maintainers"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns: ["*"]
    # The Rust toolchain pin is a deliberate, hand-managed version: the
    # toolchain-pin check in scripts/ci enforces one value across every
    # workflow, and dependabot has three times proposed a release that does
    # not exist (#3686, #3810, #4065), which fails Security Audit at install
    # and Check Rust at the pin check. Bump it by hand with the pin check.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
    labels:
      - "dependencies"
      - "registry/cargo"
    commit-message:
      prefix: "chore"
    # Minor and patch bumps travel together; a major bump stays a PR of its
    # own, because it usually needs a code change and would otherwise block
    # the whole group from merging.
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    # The RustCrypto digest 0.10 -> 0.11 ecosystem migration is mid-flight.
    # Bumping any one of sha2 / hmac / md-5 / sha1 in isolation is not
    # mergeable: the new versions require digest 0.11, which is not
    # type-compatible with the digest 0.10 traits the rest of the workspace
    # (and transitives like rsa, blake2, sqlx, object_store) still use.
    # See artifact-keeper#844 / #848 for the closed dependabot PRs and the
    # tracking analysis. Reassess once rsa publishes a sha2 0.11 release
    # and blake2 reaches 0.11 stable; at that point a single coordinated
    # bump PR can land sha2 + hmac + md-5 + sha1 together.
    ignore:
      - dependency-name: "sha2"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "hmac"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "md-5"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sha1"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # sigstore is pinned at 0.14.0 and implements a trait over x509-cert 0.2
      # types (attestation_verify.rs), so x509-cert 0.3 cannot compile on our
      # side until sigstore-rs moves (upstream PR 604). See #4008.
      - dependency-name: "x509-cert"
        update-types: ["version-update:semver-major"]
