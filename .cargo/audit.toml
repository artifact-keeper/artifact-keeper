# Configuration for cargo-audit
# See https://github.com/rustsec/rustsec/tree/main/cargo-audit

[advisories]
# List of advisory IDs to ignore
ignore = [
    # rsa 0.9.10 - Marvin Attack timing sidechannel
    # No fix available upstream. This is a transitive dependency from sqlx-mysql
    # which we don't use (we use postgres). The vulnerability requires:
    # 1. An attacker to have network access to the server
    # 2. Ability to measure timing differences with high precision
    # 3. The server to be using RSA for authentication
    # Risk is low for our use case as we don't use MySQL or RSA authentication.
    "RUSTSEC-2023-0071",

    # wasmtime advisories from the 2026-04-09 batch (RUSTSEC-2026-0086,
    # 0088, 0089, 0094, 0095, 0096) are resolved by the wasmtime 24 -> 36.0.7
    # upgrade tracked in issue #691. No wasmtime ignores needed.

    # rand unsoundness: aliased mutable references when both `log` and
    # `thread_rng` features are enabled and a custom logger reentrantly calls
    # rand::rng() during reseed. Reaches us only via transitive deps
    # (totp-rs, quinn-proto, object_store) that pin pre-fix rand versions
    # (0.8.5, 0.9.2, 0.10.0; fixed in 0.8.6 / 0.9.3 / 0.10.1). We do not
    # enable the `log` feature on `rand`, and our loggers do not call
    # rand::rng(), so the unsound code path is unreachable from artifact-keeper.
    # Re-evaluate once upstream deps bump their rand pins.
    "RUSTSEC-2026-0097",

    # zip extraction batch (RUSTSEC-2026-0367: SUID/SGID bits preserved on
    # extraction; -0368: ZipArchive::extract creates symlinks pointing outside
    # the destination; -0369: extract() applies Unix permissions through
    # symlinks; -0429: extract() aborts the process on a symlink entry with a
    # large declared size; all fixed in zip >= 9.0.0). Our DIRECT zip
    # dependency and the one rattler_package_streaming pulls are both 9.x
    # (#4705), and the backend never calls extract(): it reads entries by
    # index and writes with ZipWriter. The ONLY remaining pre-9 instance is
    # zip 2.4.2, a BUILD-dependency of utoipa-swagger-ui 8.1.0 (`cargo tree -i
    # zip@2.4.2 -e normal` prints nothing): its build.rs unpacks the
    # swagger-ui distribution vendored inside the crate with its own by_index
    # loop and never calls extract(), at build time, and nothing from it is
    # linked into the shipped binary. No utoipa-swagger-ui release depends on
    # zip 9 yet (10.0.1 still requires ^8.6 and needs utoipa 6), so it cannot
    # be upgraded out today. Remove these four once utoipa-swagger-ui builds
    # with zip 9 or the backend moves to utoipa 6 (#4705, #5162).
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",

    # crypto-bigint timing variability (RUSTSEC-2026-0387, patched only in
    # >= 0.7.6). The 0.7.x copy (via kryptering under bergshamra) is on 0.7.6.
    # The other copy, 0.5.5, comes from elliptic-curve 0.13, which pgp 0.14
    # and bergshamra 0.5 both require, and the 0.5 line has no patched
    # release. Even the latest pgp (0.21) still requires elliptic-curve 0.13,
    # so no update removes it today. Exposure is low: the signing keys the
    # backend generates are RSA or Ed25519, which do not use this crate, and
    # bergshamra only verifies SAML signatures with IdP public keys.
    # cargo-audit ignores by id, so this also covers the 0.7.x copy: keep it
    # at >= 0.7.6. Remove once `cargo tree -i crypto-bigint@0.5.5` prints
    # nothing (#4940).
    "RUSTSEC-2026-0387",

    # zstd / zstd-safe advisories of 2026-10-16 (RUSTSEC-2026-0391 zstd
    # `with_context` reuses a context without resetting it; -0398 zstd-safe
    # `Seekable::decompress`; -0403 zstd-safe `DCtx::decompress_stream` after
    # a failed legacy frame; patched in zstd >= 0.14.3 and zstd-safe >=
    # 8.2.0). Release-line narrowing of main's #5023: the direct zstd, zip and
    # async-compression (0.4.49 / compression-codecs 0.4.44) are on zstd
    # 0.14.3 / zstd-safe 8.2.0, but main's rattler_package_streaming 0.27.16
    # needs rattler_conda_types 0.58, a breaking bump this line does not take.
    # So zstd 0.13.3 / zstd-safe 7.2.4 stay, under rattler_package_streaming
    # 0.27.15 and wasmtime-internal-cache 36. Neither reaches the affected
    # functions:
    # - 0391: nothing calls `with_context` on zstd 0.13.
    # - 0398: zstd-safe 7.2.4 is built with `std` and `zstdmt` only, so the
    #   `seekable` module is not compiled in.
    # - 0403: the advisory lists the read decoder, `decode_all` and the bulk
    #   API as not affected. The backend calls rattler only through
    #   `seek::stream_conda_info` and `seek::read_package_file_content`,
    #   which decode with `zstd::stream::read::Decoder`; wasmtime's cache uses
    #   `decode_all` / `encode_all` and only runs with a configured
    #   compilation cache, which wasm_runtime.rs never sets. (zstd-sys does
    #   have `legacy` enabled through zstd 0.14's defaults, so this rests on
    #   the call sites, not the feature set.)
    # cargo-audit ignores by id, so this also covers the 0.14 copy: keep it at
    # >= 0.14.3. Remove these three once `cargo tree -i zstd@0.13.3` prints
    # nothing.
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",

    # libsqlite3-sys 0.30.1 bundles a C SQLite affected by CVE-2026-119375
    # (RUSTSEC-2026-0459, patched in libsqlite3-sys >= 0.39.0). It is in
    # Cargo.lock only as the dependency of sqlx-sqlite 0.9.0, which sqlx and
    # sqlx-macros-core name through weak `sqlx-sqlite?/...` features (any,
    # chrono, json, uuid, migrate). Cargo writes such optional deps into the
    # lockfile even when they are never activated; we enable only the
    # postgres driver, so `cargo tree -i libsqlite3-sys -e normal,build,dev
    # --target all` prints nothing: no SQLite code is compiled, linked or
    # executed. Same situation as rsa via sqlx-mysql above. It cannot be
    # updated away: sqlx 0.9.0 is the latest release and sqlx-sqlite 0.9.0
    # requires libsqlite3-sys < 0.38, and turning off sqlx's default features
    # leaves it in the lock. Remove once sqlx allows libsqlite3-sys >= 0.39 or
    # the lock no longer contains it (#5555).
    "RUSTSEC-2026-0459",
]
