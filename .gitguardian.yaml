version: 2

# SCOPE OF THIS FILE — read before adding entries below.
#
# This is the `ggshield` CLI's configuration. It is honored by local runs and
# by the pre-commit hook. It is NOT read by the **GitGuardian GitHub App**,
# which is what posts the "GitGuardian Security Checks" run on every pull
# request — that scan is configured entirely in the GitGuardian dashboard
# (Settings -> Exclusions, or by resolving/ignoring an individual incident).
#
# Demonstrated on PR #3417: `backend/src/services/egress_proxy.rs` matches the
# `backend/src/services/*.rs` entry under `ignored_paths` below, and the App
# raised a "Basic Auth String" incident on it anyway. There is no reason to
# expect `ignored_matches` to behave differently, since the App does not read
# this file at all.
#
# So: adding an entry here will NOT turn a red GitGuardian check green. To fix
# a false positive on a PR, either resolve the incident in the dashboard or
# change the fixture so the detector does not fire. Tracked in #3418.

secret:
  # Paths to ignore (test files with intentional test credentials)
  ignored_paths:
    - "**/tests/**"
    - "**/test_*.rs"
    - "**/test-*.sh"
    - "**/test_fixtures/**"
    - "scripts/native-tests/**"
    - "scripts/mesh-e2e/**"
    - "scripts/redteam/**"
    - "**/.astro/**"
    # Backend source files contain #[cfg(test)] modules with test credentials
    - "backend/src/storage/*.rs"
    - "backend/src/api/handlers/*.rs"
    - "backend/src/services/*.rs"
    - "backend/src/formats/*.rs"
    - "backend/src/models/*.rs"
    - "backend/src/config.rs"
    - "backend/src/api/middleware/*.rs"

  # Specific patterns to ignore
  ignored_matches:
    # Test RSA keys for unit testing (GCS, CloudFront backends)
    - name: "Test RSA key for unit tests"
      match: "BEGIN PRIVATE KEY"
    - name: "Test RSA key for unit tests"
      match: "BEGIN RSA PRIVATE KEY"
    - name: "Test RSA key for unit tests"
      match: "END PRIVATE KEY"

    # Default test passwords used in examples and unit tests
    - name: "Default test password"
      match: "admin123"
    - name: "Test password in unit tests"
      match: "secret123"
    - name: "Test password in unit tests"
      match: "password123"
    - name: "Test secret in unit tests"
      match: "test-secret"
    - name: "Test key in unit tests"
      match: "test-key"
    - name: "Test API key in unit tests"
      match: "test-api-key"
    - name: "Test webhook secret in unit tests"
      match: "my-secret-key"

    # GCS test service account
    - name: "Test GCS service account email"
      match: "iam.gserviceaccount.com"

    # Astro build cache hashes
    - name: "Astro build cache"
      match: "data-store.json"
