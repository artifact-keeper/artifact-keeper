# Clippy configuration

# Minimum supported Rust version, as clippy sees it (#3699).
#
# Nothing compiles against this number -- it only shapes clippy's
# MSRV-conditional suggestions -- so when it is wrong nothing fails, it just
# quietly stops suggesting anything newer. It sat at 1.75.0 while
# rust-toolchain.toml pinned 1.98.0 and `toml` 1.1.3 declared
# `rust-version = 1.85`, i.e. a floor the workspace could not have honoured
# anyway. Keep it equal to the pinned channel and bump both together;
# scripts/ci/check-toolchain-pin.sh fails the build if they disagree.
msrv = "1.98.0"

# Streaming-invariant enforcement gate — Part of #1608 (Core Invariant ①).
#
# Artifact-path handlers must never read a full artifact body into memory. These
# calls buffer an entire HTTP/multipart body on the heap, which is exactly the
# ad-hoc full-buffering pattern that produced the 16 memory/OOM issues tracked
# under #1607. Forbid new call sites via clippy; every CURRENT legitimate site is
# annotated `#[allow(clippy::disallowed_methods)] // STREAMING-EXEMPT: <reason>`
# and enumerated in backend/tests/streaming_invariant.rs. As later phases convert
# a site to streaming, its annotation (and allowlist entry) is removed.
disallowed-methods = [
    { path = "reqwest::Response::bytes", reason = "STREAMING: buffers the whole upstream body in memory; use .bytes_stream()/streaming copy or a capped read; see #1608" },
    { path = "axum::extract::multipart::Field::bytes", reason = "STREAMING: buffers the whole multipart field in memory; use .chunk() with an incremental hash / put_stream; see #1608" },
    { path = "axum::body::to_bytes", reason = "STREAMING: buffers the whole request/response body in memory; pass a bounded limit and prefer streaming; see #1608" },

    # Cryptographic boundary (#5579). Security functions run on the single
    # validated provider through `crate::crypto`; these are the entry points
    # into the non-validated crates. Protocol checksums (MD5/SHA-1/BLAKE2 for
    # Maven, npm, apk, conda, git) are not security functions and are not
    # listed; the sha2 *types* are listed below because SHA-2 content digests
    # feed integrity gates. A legitimate non-security use (backoff jitter,
    # a test fixture) is annotated
    # `#[allow(clippy::disallowed_methods)] // NON-SECURITY: <reason>`.
    { path = "bcrypt::hash", reason = "CRYPTO: use crate::crypto::password (hash_bcrypt for the legacy write path); see #5579" },
    { path = "bcrypt::verify", reason = "CRYPTO: use crate::crypto::password::verify, which reads both formats; see #5579" },
    { path = "rand::rng", reason = "CRYPTO: security randomness comes from crate::crypto::rng (module DRBG); jitter may keep rand with a NON-SECURITY allow; see #5579" },
    { path = "rand::random", reason = "CRYPTO: use crate::crypto::rng; see #5579" },
    { path = "rand::random_range", reason = "CRYPTO: use crate::crypto::rng::below; jitter may keep rand with a NON-SECURITY allow; see #5579" },
]

disallowed-types = [
    { path = "sha2::Sha256", reason = "CRYPTO: use crate::crypto::digest; see #5579" },
    { path = "sha2::Sha384", reason = "CRYPTO: use crate::crypto::digest; see #5579" },
    { path = "sha2::Sha512", reason = "CRYPTO: use crate::crypto::digest; see #5579" },
    { path = "hmac::Hmac", reason = "CRYPTO: use crate::crypto::hmac; see #5579" },
    { path = "aes_gcm::Aes256Gcm", reason = "CRYPTO: use crate::crypto::aead; see #5579" },
    { path = "aes_gcm::Aes128Gcm", reason = "CRYPTO: use crate::crypto::aead (AES-256-GCM); see #5579" },
    { path = "ed25519_dalek::SigningKey", reason = "CRYPTO: use crate::crypto::signature::Ed25519KeyPair; see #5579" },
    { path = "ed25519_dalek::VerifyingKey", reason = "CRYPTO: use crate::crypto::signature::ed25519_verify; see #5579" },
    # `rsa::RsaPrivateKey` joins this list with #5586, when repository RSA
    # signing moves onto the module. Until then the `rsa` crate does the RSA
    # arithmetic over digests the facade computes.
    { path = "rand::rngs::SysRng", reason = "CRYPTO: use crate::crypto::rng::ModuleRng; see #5579" },
    { path = "rand08::rngs::OsRng", reason = "CRYPTO: use crate::crypto::rng::ModuleRng; see #5579" },
    { path = "rsa::rand_core::OsRng", reason = "CRYPTO: use crate::crypto::rng::ModuleRng; see #5579" },
]

# result_large_err threshold — see #3551.
#
# `Result<T, Response>` is the axum idiom this codebase uses for every handler
# and handler helper in backend/src/api/handlers: the `Err` payload is not an
# error *description* that gets formatted later, it IS the HTTP response the
# caller is about to return, so `?` can propagate a fully-built 401/404/409
# straight out of a helper. There is nothing to box — boxing it would only move
# the same bytes to the heap and add an allocation on every early return.
#
# `axum::response::Response` (`http::Response<axum::body::Body>`) measures 128
# bytes, which is exactly clippy's default `large-error-threshold`. Rust 1.98's
# clippy began firing on it and reported 555 errors, in one directory, for one
# type, with no source change on our side (#3551).
#
# 129 = size_of::<Response>() + 1. It is the smallest value that admits that one
# type and nothing bigger, so the lint keeps a real job: any `Err` variant of
# 129 bytes or more — a struct that inlines a String plus a backtrace, an enum
# that inlines a Response *and* something else — still fails the build. It is a
# threshold, not an `allow`: the lint stays enabled everywhere.
#
# backend/src/api/handlers/mod.rs has a unit test pinning size_of::<Response>()
# so that a future axum or rustc that grows the type past this threshold fails
# as one named assertion instead of 555 anonymous clippy errors.
large-error-threshold = 129
