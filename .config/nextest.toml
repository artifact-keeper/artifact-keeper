# cargo-nextest configuration.
#
# The coverage CI job runs the suite via `cargo llvm-cov nextest`, which
# executes each test in its OWN PROCESS. Several DB integration tests serialize
# themselves with an *in-process* `tokio::Mutex` because they mutate GLOBAL,
# cluster-wide state and assert on exact results:
#
#   * `scan_result_service.rs` `CLEANUP_TEST_LOCK` — the `cleanup_stuck_scans_*`
#     tests share the global stuck-scan reap query + `pg_try_advisory_xact_lock(
#     STUCK_SCAN_LOCK_ID)`. Concurrent ticks see the lock held by a sibling and
#     reap 0, failing `assert!(reaped >= 1)`.
#   * `storage_gc_service.rs` `STORAGE_GC_TEST_LOCK` (via `storage_gc_test_guard`)
#     — the `test_run_gc_*` tests run a cluster-wide GC reap and assert on the
#     exact set of keys collected. A concurrent GC test reaps another's fixtures
#     first, failing e.g. "GC result should include the upload temp and part keys".
#   * `sync_worker.rs` `recover_expired_sync_task_claims` — the
#     `expired_sync_task_claims_recover_and_fence_stale_owner` and
#     `legacy_in_progress_sync_task_without_claim_metadata_recovers` tests seed an
#     expired / legacy `in_progress` `sync_tasks` row, then call the recovery
#     sweep, which UPDATEs *every* stale claim in the DB (no peer scope) and assert
#     on the exact global count (`recovered == 1`). A sibling test's stale row is
#     swept in the same pass, failing the count/fence assertions. (The peer-scoped
#     `claim_pending_sync_tasks` concurrency tests only touch their own unique
#     peer's rows via `WHERE peer_instance_id = $1` and hold live-TTL claims the
#     sweep cannot match, so they stay parallel.)
#   * `repositories.rs`
#     `rest_delete_index_unwind_rolls_back_when_soft_delete_fails_db` (#3476) —
#     proves the REST delete's OCI index unwind and the `artifacts` soft-delete
#     are ONE transaction by injecting a `BEFORE UPDATE` trigger on `artifacts`.
#     The trigger's `WHEN (NEW.id = '<uuid>')` clause makes it inert for every
#     other row, but it is attached to the SHARED `artifacts` table for the
#     duration of the test, so no other `artifacts`-mutating test may be
#     mid-UPDATE while it exists.
#   * `oci_migration_reindex.rs` `run_repair` (#2457) — the `test_run_repair_*`
#     tests exercise the startup reindex, whose candidate scan, hollow-tag flag,
#     and orphan-tag DELETE are all CLUSTER-WIDE (no repository scope) and which
#     the tests assert on via the returned `RepairStats` (`manifests_registered`,
#     `orphan_tags_reconciled`). Run process-per-test against the shared DB, a
#     sibling `run_repair` call registers or drops another test's seeded
#     manifest / orphan tag first, so the count is attributed to the wrong test
#     (e.g. `orphan_tags_reconciled == 0`). Serializing them restores the
#     exact-count assertions the single-process `cargo test` run provided.
#
# Under nextest's process-per-test model those in-process mutexes do NOT
# serialize across the suite, so the tests interfere nondeterministically, fail,
# and abort the instrumented run before `lcov.info` is written — leaving the
# Code Coverage gate red (#1753).
#
# There is no longer a single-process unit-test job to fall back on (#3479).
# BOTH CI unit-test jobs — the Tier 1 unit tests and the coverage job — run
# `cargo nextest run --workspace --lib --test-threads 8`, so the groups below
# are the ONLY thing serializing these suites in CI. They are not a
# coverage-specific workaround, and removing an entry breaks the unit-test gate
# outright rather than degrading one job.
#
# An earlier revision of this comment claimed a plain single-process
# `cargo test` job kept the in-process mutexes working there. That job no
# longer exists, and the premise did not generalize anyway: the `sync_worker`
# entries below have no in-process mutex at all — under a multi-threaded
# single-process run they fail today — so for those the groups are the only
# serialization that has ever existed.
#
# Pin every test that mutates this shared DB state to a single-threaded test
# group so nextest never runs two of them at once. Add new tests that take
# STUCK_SCAN_LOCK_ID or `storage_gc_test_guard()`, or that call
# `recover_expired_sync_task_claims` or `run_repair` and assert on its global
# result, to the matching filter below.

[test-groups]
db-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(cleanup_stuck_scans) | test(storage_gc_service::tests) | test(sync_worker::tests::expired_sync_task_claims_recover_and_fence_stale_owner) | test(sync_worker::tests::legacy_in_progress_sync_task_without_claim_metadata_recovers) | test(oci_migration_reindex::tests::test_run_repair) | test(rest_delete_index_unwind_rolls_back_when_soft_delete_fails_db)'
test-group = 'db-serial'
