# TCP forwarder from the internal sandbox network to Artifact Keeper (#5253).
# It is the only thing a sandboxed npm or PyPI guest can reach. It speaks no
# HTTP and terminates no TLS, so the guest verifies AK's own certificate.
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }

stream {
    # Replace with the host and ports of AK_URL.
    upstream ak_https { server ak.example.com:443; }
    upstream ak_http  { server ak.example.com:80; }

    server {
        listen 443;
        proxy_pass ak_https;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
    server {
        listen 80;
        proxy_pass ak_http;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
}
