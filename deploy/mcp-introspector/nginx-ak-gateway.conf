# TCP forwarder from the sandbox guest networks to Artifact Keeper (#5253).
# Every npm or PyPI guest has an internal network of its own that the worker
# attaches this forwarder to (#5447); the forwarder is the only thing on it
# besides the guest. It speaks no HTTP, terminates no TLS (the guest verifies
# AK's own certificate) and forwards only to AK, never to another guest: the
# `listen` addresses are unbound so a newly attached network is served
# without a reload, and nothing here routes between networks.
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }

stream {
    # `ak-upstream` is AK's address, set by `extra_hosts` in
    # compose.sandbox-network.yaml. Never the AK hostname: on a guest
    # network that name is this gateway's own alias, so it would resolve to
    # this container and forward every connection back to itself. Change
    # the ports if AK_URL uses others.
    upstream ak_https { server ak-upstream:443; }
    upstream ak_http  { server ak-upstream:80; }

    server {
        listen 443;
        proxy_pass ak_https;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
    server {
        listen 80;
        proxy_pass ak_http;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
}
