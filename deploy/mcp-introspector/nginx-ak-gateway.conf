# TCP forwarder from the internal sandbox network to Artifact Keeper (#5253).
# It is the only thing a sandboxed npm or PyPI guest can reach. It speaks no
# HTTP and terminates no TLS, so the guest verifies AK's own certificate.
worker_processes 1;
pid /var/run/nginx.pid;
events { worker_connections 256; }

stream {
    # `ak-upstream` is AK's address, set by `extra_hosts` in
    # compose.sandbox-network.yaml. Never the AK hostname: on the sandbox
    # network that name is this gateway's own alias, so it would resolve to
    # this container and forward every connection back to itself. Change
    # the ports if AK_URL uses others.
    upstream ak_https { server ak-upstream:443; }
    upstream ak_http  { server ak-upstream:80; }

    server {
        listen 443;
        proxy_pass ak_https;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
    server {
        listen 80;
        proxy_pass ak_http;
        proxy_connect_timeout 10s;
        proxy_timeout 130s;
    }
}
