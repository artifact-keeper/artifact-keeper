# The worker may create, watch, attach to and delete pods in the sandbox
# namespace, and nothing else: no engine socket, no node access, no secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ak-mcp-introspector
  namespace: ak-mcp-introspector
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ak-mcp-sandbox-launcher
  namespace: ak-mcp-sandbox
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/attach"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ak-mcp-sandbox-launcher
  namespace: ak-mcp-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ak-mcp-sandbox-launcher
subjects:
  - kind: ServiceAccount
    name: ak-mcp-introspector
    namespace: ak-mcp-introspector
