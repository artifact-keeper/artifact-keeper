# gVisor for guest pods. The nodes need gVisor's containerd shim
# (runsc + containerd-shim-runsc-v1); GKE Sandbox ships it as `gvisor`
# already. Pin guests to sandbox nodes with a nodeSelector/taint if only
# some nodes have it.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
