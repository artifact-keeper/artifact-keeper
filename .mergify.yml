queue_rules:
  - name: default
    merge_method: squash
    update_method: rebase

pull_request_rules:
  - name: Auto-merge Dependabot patch updates
    conditions:
      - author=dependabot[bot]
      - "title~=^Bump .* from .* to .*"
      - "-title~=major"
      # A release-gate pin bump (#6170) is never auto-merged: it changes what
      # certifies a release. The body check catches it inside a grouped
      # update whose title does not name it. NOTE: this rule is effectively
      # dead today: Dependabot titles here are `chore: bump ...` (the
      # commit-message prefix, e.g. #5981, #5138), not `^Bump`, and the
      # check-success names below are job ids, not check names. The
      # exclusion is kept so it still holds if the rule is ever fixed.
      - "-title~=artifact-keeper-test"
      - "-body~=artifact-keeper/artifact-keeper-test"
      - check-success=check-rust
      - check-success=test-backend-unit
      - check-success=ci-complete
      - "#approved-reviews-by>=1"
    actions:
      queue:
        name: default

  - name: Flag Dependabot major updates
    conditions:
      - author=dependabot[bot]
      - "title~=major"
    actions:
      label:
        add:
          - needs-review
          - major-update
      comment:
        message: |
          Major version bump detected. Manual review recommended before merging.

  - name: Require tests for API handler changes
    conditions:
      - "files~=^backend/src/api/handlers/"
      - -draft
    actions:
      label:
        add:
          - needs-tests
          - api-change
      comment:
        message: |
          This PR modifies API handlers. Please ensure:
          - Unit tests cover the new/changed logic
          - Integration test updated if endpoint behavior changed
          - OpenAPI annotations match the implementation

  - name: Label and review migrations
    conditions:
      - "files~=^backend/migrations/"
    actions:
      label:
        add:
          - migration
          - needs-review
      request_reviews:
        teams:
          - backend

  - name: Label format handler changes
    conditions:
      - "files~=^backend/src/formats/"
    actions:
      label:
        add:
          - format-handler

  - name: Require test checklist completion
    conditions:
      - "body~=\\[x\\].*[Tt]est"
      - "#approved-reviews-by>=1"
    actions:
      label:
        add:
          - tests-verified

